  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: SheetSteel
        amount: 3

- type: entity
  parent: CrateGenericSteel
  id: CrateMaterialTextiles
  name: ящик для текстилю
  description: 60 шматків тканини та 30 шматків дюраніту.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MaterialCloth
          amount: 2
        - id: MaterialDurathread

