  description: Духовні та магічні легені колишньої оперної співачки. Хоча, чесно кажучи, голосові зв’язки створюють виступ.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: lung-l
  - type: Instrument
    program: 121
  - type: Item
    size: Small

