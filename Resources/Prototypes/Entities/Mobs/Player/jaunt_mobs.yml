- type: entity
  name: прогулянка
  parent: [Incorporeal, BaseMob]
  id: BaseMobJaunt
  description: Тут залишаються слабкі сліди гуманоїдної фігури
  suffix: Ефірний
  components:
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: MovementSpeedModifier
    baseSprintSpeed: 12
    baseWalkSpeed: 8
  - type: Visibility
    layer: 2
  - type: Spectral

# Should be slow, for balance
- type: entity
  name: прогулянка
  parent: BaseMobJaunt
  id: EtherealJaunt
  suffix: майстер
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#60f7eb"
    layers:
    - state: animated
      shader: unshaded
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseSprintSpeed: 6
    baseWalkSpeed: 4

- type: entity
  parent: [Incorporeal, BaseMob]
  id: DesynchronizedPocket
  name: десинхронізована кишеня
  description: Кишеня в просторі-часі, утримуючи користувача на частку секунди в майбутньому.
  components:
  - type: Spectral
  - type: MovementSpeedModifier
    baseSprintSpeed: 0
    baseWalkSpeed: 0
