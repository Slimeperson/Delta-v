- type: entity
  id: BaseAltRock #It's 1994
  parent: BaseWall
  abstract: true
  name: астероїдна скеля
  description: Скелястий астероїд.
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/asteroid_rock.rsi
    state: full
  - type: Icon
    sprite: _DV/Structures/Walls/asteroid_rock.rsi
    state: full
  - type: Tag
    tags:
    - Wall
    - Natural
  - type: MiningScannerViewable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: IconSmooth
    key: walls
    base: rock_

- type: entity
  id: AsteroidAltRock
  parent: BaseAltRock
  suffix: Низький вихід, стандартне значення
  components:
  - type: OreVein
    oreChance: 0.2
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  id: AsteroidAltRockMining
  parent: AsteroidAltRock
  suffix: Висока врожайність, стандартне значення
  components:
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  id: AsteroidRockOreCrab
  parent: AsteroidAltRock
  suffix: Рудний краб
  components:
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: OreCrab

- type: entity
  id: MountainRock
  parent: BaseAltRock
  name: гірська скеля
  description: Скеляста гірська стіна.
  suffix: Не можна видобувати
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/mountain_rock.rsi
    state: full
    drawdepth: Walls
  - type: Icon
    sprite: _DV/Structures/Walls/mountain_rock.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: MountainRock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  id: MountainRockMining
  parent: MountainRock
  suffix: Низька врожайність, висока вартість
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/mountain_rock_ore.rsi
    state: full
    drawdepth: Walls
  - type: Icon
    sprite: _DV/Structures/Walls/mountain_rock_ore.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: OreVein
    oreChance: 0.20
    oreRarityPrototypeId: RandomOreDistributionHigh
