- type: entity
  id: BorgChassisSelectable
  parent: BaseBorgChassisNT
  components:
  - type: Sprite
    layers:
    - state: robot
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: robot_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: robot_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    # Default borg can take no modules until selected type.
    maxModules: 0
    hasMindState: robot_e
    noMindState: robot_e_r
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/chassis.rsi
      state: robot
    name: кіборг
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Common
    - Binary
  # Begin Impstation - Borg PDAs
  - type: Pda
    idSlot:
      locked: true
    penSlot:
      locked: true
    paiSlot:
      locked: true
  - type: PdaBorderColor
    borderColor: "#717059"
  - type: Ringer
  - type: NanoChatCard
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - NanoChatCartridge
    cartridgeSlot:
      locked: true
      priority: -1
      name: device-pda-slot-component-slot-name-cartridge
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - Cartridge
  - type: ActionGrant
    actions:
    - ActionOpenCartridges
  - type: StationAiWhitelist
  - type: BorgPda
  # End Impstation - Borg PDAs

- type: entity
  id: BorgChassisGeneric
  parent: BorgChassisSelectable
  name: родовий кіборг
  suffix: вибраний тип
  components:
  - type: BorgSwitchableType
    selectedBorgType: generic

- type: entity
  id: BorgChassisMining
  parent: BorgChassisSelectable
  name: рятувальний кіборг
  components:
  - type: BorgSwitchableType
    selectedBorgType: mining

- type: entity
  id: BorgChassisEngineer
  parent: BorgChassisSelectable
  name: інженер кіборг
  components:
  - type: BorgSwitchableType
    selectedBorgType: engineering

- type: entity
  id: BorgChassisJanitor
  parent: BorgChassisSelectable
  name: двірник кіборг
  components:
  - type: BorgSwitchableType
    selectedBorgType: janitor

- type: entity
  id: BorgChassisMedical
  parent: BorgChassisSelectable
  name: медичний кіборг
  components:
  - type: BorgSwitchableType
    selectedBorgType: medical

- type: entity
  id: BorgChassisService
  parent: BorgChassisSelectable
  name: службовий кіборг
  components:
  - type: BorgSwitchableType
    selectedBorgType: service

- type: entity
  id: BorgChassisSyndicateAssault
  parent: BaseBorgChassisSyndicate
  name: синдикат штурмового кіборга
  description: Економна, підла машина для вбивств із доступом до різноманітних смертоносних модулів.
  components:
    - type: Sprite
      layers:
        - state: synd_sec
        - state: synd_sec_e
          map: ["enum.BorgVisualLayers.Light"]
          shader: unshaded
          visible: false
        - state: synd_sec_l
          shader: unshaded
          map: ["light"]
          visible: false
    - type: BorgChassis
      maxModules: 3
      moduleWhitelist:
        tags:
          - BorgModuleGeneric
          - BorgModuleSyndicate
          - BorgModuleSyndicateAssault
      hasMindState: synd_sec_e
      noMindState: synd_sec
    - type: InteractionPopup
      interactSuccessString: petting-success-syndicate-cyborg
      interactFailureString: petting-failure-syndicate-cyborg
      interactSuccessSound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  id: BorgChassisSyndicateMedical
  parent: [BaseBorgChassisSyndicate, ShowMedicalIcons]
  name: синдикат медичного кіборга
  description: Бойовий медичний кіборг. Має обмежений атакувальний потенціал, але компенсує його своїми можливостями підтримки.
  components:
    - type: Sprite
      layers:
        - state: synd_medical
        - state: synd_medical_e
          map: ["enum.BorgVisualLayers.Light"]
          shader: unshaded
          visible: false
        - state: synd_medical_l
          shader: unshaded
          map: ["light"]
          visible: false
    - type: BorgChassis
      maxModules: 3
      moduleWhitelist:
        tags:
          - BorgModuleGeneric
          - BorgModuleMedical
          - BorgModuleSyndicate
      hasMindState: synd_medical_e
      noMindState: synd_medical
    - type: ShowHealthBars
      damageContainers: # DeltaV
      - Biological
      - BiologicalMetaphysical # Kitsune
    - type: InteractionPopup
      interactSuccessString: petting-success-syndicate-cyborg
      interactFailureString: petting-failure-syndicate-cyborg
      interactSuccessSound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg
    - type: SolutionScanner
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepHoverBorg
        params:
          volume: -6

- type: entity
  id: BorgChassisSyndicateSaboteur
  parent: BaseBorgChassisSyndicate
  name: синдикат диверсант кіборг
  description: Обтічний інженерний кіборг, оснащений пристроєм маскування та легким озброєнням. # DeltaV
  components:
    - type: Sprite
      layers:
        - state: synd_engi
        - state: synd_engi_e
          map: ["enum.BorgVisualLayers.Light"]
          shader: unshaded
          visible: false
        - state: synd_engi_l
          shader: unshaded
          map: ["light"]
          visible: false
    - type: BorgChassis
      maxModules: 7 # Delta V - Given additional modules, +1 for SRN's Engi module
      moduleWhitelist:
        tags:
          - BorgModuleGeneric
          - BorgModuleEngineering
          - BorgModuleSyndicate
      hasMindState: synd_engi_e
      noMindState: synd_engi
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
    - type: InteractionPopup
      interactSuccessString: petting-success-syndicate-cyborg
      interactFailureString: petting-failure-syndicate-cyborg
      interactSuccessSound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  id: BorgChassisDerelict
  parent: BaseBorgChassisDerelict
  name: покинутий кіборг
  description: Гібрид людини і машини, який допомагає в діяльності станції. Цей знаходиться в дуже занедбаному стані.
  components:
  - type: Sprite
    layers:
    - state: derelict
    - state: derelict_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: derelict_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: BorgChassis
    maxModules: 5 # One less module slot than the regular module to reflect this being a "broken" cyborg.
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
    hasMindState: derelict_e
    noMindState: derelict_e_r
  - type: Construction
    node: derelictcyborg
  - type: InteractionPopup
    interactSuccessString: petting-success-derelict-cyborg
    interactFailureString: petting-failure-derelict-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  parent: BaseBorgChassisDerelict
  id: EngineeringBorgChassisDerelict
  name: покинутий інженер-кіборг
  description: Гібрид людини та машини, який допомагає інженерному відділу. Здається, на його поверхні є шматки дивних кристалів.
  components:
  - type: Sprite
    layers:
    - state: engineer_derelict
    - state: engineer_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: engineer_derelict_crystal #This layer and the layer below are duplicated in order to create a more mellow unshaded layer. See https://github.com/space-wizards/space-station-14/pull/37869 for more info on the method.
      shader: unshaded
    - state: engineer_derelict_crystal
      shader: shaded
    - state: engineer_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: BorgChassis
    maxModules: 5 # One less module slot than the regular module to reflect this being a "broken" cyborg.
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleEngineering
    hasMindState: engineer_e
    noMindState: engineer_e_r

- type: entity
  parent: BaseBorgChassisDerelict
  id: JanitorBorgChassisDerelict
  name: покинутий двірник кіборг
  description: Гібрид людини і машини, який допомагає сервісному відділу. Це більший безлад, ніж усе, що він може прибрати.
  components:
  - type: Sprite
    layers:
    - state: janitor_derelict
      map: ["movement"]
    - state: janitor_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: janitor_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: janitor_moving_derelict
    noMovementLayers:
      movement:
        state: janitor_derelict
  - type: BorgChassis
    maxModules: 5 # One less module slot than the regular module to reflect this being a "broken" cyborg.
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleJanitor
    hasMindState: janitor_e
    noMindState: janitor_e_r

- type: entity
  parent: BaseBorgChassisDerelict
  id: MedicalBorgChassisDerelict
  name: покинутий медичний кіборг
  description: Гібрид людини і машини, який допомагає медичному відділу. Голки цього виглядають не зовсім гігієнічно.
  components:
  - type: Sprite
    layers:
    - state: medical_derelict
      map: ["movement"]
    - state: medical_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: medical_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: medical_moving_derelict
    noMovementLayers:
      movement:
        state: medical_derelict
  - type: BorgChassis
    maxModules: 6 # One less module slot than the regular module to reflect this being a "broken" cyborg.
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleMedical
    hasMindState: medical_e
    noMindState: medical_e_r
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - BiologicalMetaphysical # DeltaV - Kitsune
  - type: ShowHealthIcons
    damageContainers:
    - Biological
    - BiologicalMetaphysical # DeltaV - Kitsune

- type: entity
  parent: BaseBorgChassisDerelict
  id: MiningBorgChassisDerelict
  name: покинутий врятований кіборг
  description: Гібрид людини і машини, який допомагає вантажному відділу. Цей побачив неправильну сторону шматка гібтоніту.
  components:
