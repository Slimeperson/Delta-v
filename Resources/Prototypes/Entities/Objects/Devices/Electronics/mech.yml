# Ripley

- type: entity
  id: RipleyCentralElectronics
  parent: BaseElectronics
  name: центральний модуль управління ripley
  description: Електричний центр керування механізмом Ріплі.
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: mainboard
    - type: Tag
      tags:
      - RipleyCentralControlModule
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: RipleyPeripheralsElectronics
  parent: BaseElectronics
  name: модуль керування периферійними пристроями Ripley
  description: Керування електричними периферійними пристроями Ріплі.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: id_mod
    - type: Tag
      tags:
      - RipleyPeripheralsControlModule
    - type: GuideHelp
      guides:
      - Robotics

