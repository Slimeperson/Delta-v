- type: entity
  parent: CrateMedical
  id: CrateMedicalSupplies
  name: Колектор випромінювання, який найкраще використовувати для двигунів сингулярності. Плазма включена.
  description: Ящик з двома гусями.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MedkitFilled
          amount: 2
        - id: Gauze
          amount: 2
        - id: Bloodpack
          amount: 2
        - id: BoxLatexGloves
        - id: BoxSterileMask
        - id: BoxMouthSwab

- type: entity
  parent: CrateMedical
  id: CrateChemistrySupplies
  name: ящик для хімії
  description: Основні предмети хімії.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxSyringe
        - id: BoxBeaker
        - id: BoxPillCanister
        - id: Dropper
          amount: 2
        - id: BoxBottle
          amount: 2
        - id: Skimmer # DeltaV - Add skimmers
          amount: 2

- type: entity
  parent: CrateMedical
  id: CrateChemistryVials
  name: контейнер для флаконів
  description: Ящик, наповнений коробкою з флаконами.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxVial

- type: entity
  parent: CrateMedical
  id: CrateMindShieldImplants
  name: Ящик для імплантатів MindShield
  description: Ящик, наповнений 3 імплантатами MindShield.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MindShieldImplanter
        amount: 3

- type: entity
  parent: CrateSurgery
  id: CrateMedicalSurgery
  name: ящик для хірургічного приладдя
  description: Хірургічні інструменти.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: Scalpel
        - id: Retractor
        - id: Cautery
        - id: Drill
        - id: SawElectric # Shitmed Change
        - id: Hemostat
        - id: ClothingMaskSterile
        # Shitmed Change
        - id: BoneGel
        - id: BoxLatexGloves
        - id: BoxSterileMask

- type: entity
  parent: CrateMedical
  id: CrateMedicalScrubs
  name: ящик для медичних скрабів
  description: Медичний одяг.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: UniformScrubsColorGreen
        - id: UniformScrubsColorPurple
        - id: UniformScrubsColorBlue
# DeltaV adds cyan through white scrubs
        - id: UniformScrubsColorCyan
        - id: UniformScrubsColorBlack
        - id: UniformScrubsColorPink
        - id: UniformScrubsColorRainbow
        - id: UniformScrubsColorWhite
        - id: ClothingHeadHatSurgcapBlue
        - id: ClothingHeadHatSurgcapPurple
        - id: ClothingHeadHatSurgcapGreen
# DeltaV adds cyan through white surgcaps
        - id: ClothingHeadHatSurgcapCyan
        - id: ClothingHeadHatSurgcapBlack
        - id: ClothingHeadHatSurgcapPink
        - id: ClothingHeadHatSurgcapRainbow
        - id: ClothingHeadHatSurgcapWhite
        - id: ClothingMaskSterile
# DeltaV nerfs amount from 3 to 1(more items)
          amount: 1

