# As opposed to MagazineBox these are boxes of magazines so BoxMagazine
# CaselessRifle
- type: entity
  name: коробка журналів
  parent: BoxCardboard
  id: BoxMagazine
  description: Ящик, повний журналів.
  components:
  - type: Sprite
    layers:
      - state: box_security
      - state: magazine

- type: entity
  name: коробка безгільзових магазинів .25
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRifle
  description: Ящик, повний безгільзових магазинів .25.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MagazinePistolCaselessRifle
        amount: 4

- type: entity
  name: коробка безгільзових (практичних) журналів .25
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRiflePractice
  description: Коробка, наповнена практичними магазинами без гільз калібру .25.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MagazinePistolCaselessRiflePractice
        amount: 4

