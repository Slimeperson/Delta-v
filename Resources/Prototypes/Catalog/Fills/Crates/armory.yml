- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateSecurityRiot
  name: спецназ ящик
  description: Містить два набори броні для масових заворушень, шоломи, щити та силовиків, навантажених мішками. Додаткові боєприпаси включені. Щоб відкрити, потрібен доступ до Збройової палати.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterArmorARC # DeltaV - ClothingOuterArmorRiot replaced in favour of ARC suit
          amount: 2
        - id: ClothingHeadHelmetRiot
          amount: 2
        - id: WeaponShotgunEnforcerRubber
          amount: 2
        - id: BoxBeanbag
          amount: 2
        - id: RiotShield
          amount: 2

