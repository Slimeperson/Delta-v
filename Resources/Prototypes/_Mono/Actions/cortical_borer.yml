- type: entity # DeltaV - rework for action refactor
  id: ActionCorticalBorerChemMenu
  name: Хімічні речовини
  description: Відкрийте меню хімікатів.
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_chem.png
  - type: InstantAction
    event: !type:CorticalChemMenuActionEvent

- type: entity # DeltaV - rework for action refactor
  id: ActionCorticalBorerInfest
  name: Infest
  description: Infest target Humanoid. Цільовий господар повинен мати кровотік.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_infest.png
    useDelay: 5
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction   
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:CorticalInfestEvent {}

- type: entity # DeltaV - rework for action refactor
  id: ActionCorticalBorerEject
  name: Вилучити хост
  description: Великий лабораторний гумовий килимок. Відчуйте себе в безпеці, коли ви розливаєте кислоту на себе!
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEjectEvent

- type: entity # DeltaV - rework for action refactor
  id: ActionCheckBlood
  name: Перевірте кров
  description: Огляньте кров свого господаря, щоб побачити, як вони почуваються.
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_bloodcheck.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalCheckBloodEvent

- type: entity # DeltaV - rework for action refactor
  id: ActionControlHost
  name: Візьміть під контроль
  description: Візьміть повний контроль над своїм хостом, триває 40 секунд на хостах, що активні.
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_control.png
    useDelay: 340 #5 minutes and 40 seconds
  - type: InstantAction
    event: !type:CorticalTakeControlEvent

- type: entity # DeltaV - rework for action refactor
  id: ActionEndControlHost
  name: Відмовтеся від контролю
  description: Завчасно відмовляйтеся від захоплення тіла господаря.
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEndControlEvent

- type: entity # DeltaV - rework for action refactor
  id: ActionLayEggHost
  name: Відкласти яйце
  description: Змусити господаря вирвати яйце. Коштує 200 хімікатів. # потрібно змінити, якщо змінюється базова хімічна вартість
  components:
  - type: Action
    icon: _Mono/Interface/Action/borer_egg.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalLayEggEvent
