# Kill

- type: entity
  abstract: true
  parent: [ BaseNinjaObjective, BaseTeachLessonObjective ]
  id: BaseNinjaTeachLessonObjective
  description: Цей дурень виступив проти клану павука. Навчіть їх помилковості їхніх шляхів.
  components:
  - type: Objective
    unique: true
    icon:
      sprite: Objects/Weapons/Throwable/throwing_star.rsi
      state: icon
  - type: TargetObjective
    title: об'єктивна-умова-навчити-людини-назви

- type: entity
  parent: BaseNinjaTeachLessonObjective
  id: NinjaTeachLessonRandomHeadObjective
  components:
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter

- type: entity
  parent: BaseNinjaTeachLessonObjective
  id: NinjaTeachLessonRandomPersonObjective
  components:
  - type: PickRandomPerson

- type: entity
  parent: [ BaseNinjaObjective, BaseKillObjective ]
  id: NinjaKillRandomHeadObjective
  description: Клану Павуків потрібно більше кіборгів-диверсантів. Мозок цієї голови буде ідеальним.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/energykatana.rsi
      state: icon
  - type: TargetObjective
    title: object-ninja-kill-head-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter

  - type: KillPersonCondition
    requireDead: true

# Steal

- type: entity
  abstract: true
  parent: [ BaseNinjaObjective, BaseStealObjective ]
  id: BaseNinjaStealObjective
  components:
  - type: StealCondition
    verifyMapExistence: false

- type: entity
  parent: BaseNinjaStealObjective
  id: NinjaIanDossierStealObjective
  components:
  - type: StealCondition
    stealGroup: BookIanDossier

- type: entity
  parent: BaseNinjaStealObjective
  id: NinjaLuckyBillStealObjective
  components:
  - type: StealCondition
    stealGroup: SpaceCashLuckyBill

- type: entity
  parent: BaseNinjaStealObjective
  id: NinjaCaptainsCloakStealObjective
  components:
  - type: StealCondition
    stealGroup: CaptainsCloak

- type: entity
  parent: BaseNinjaStealObjective
  id: NinjaNotaryStampStealObjective
  components:
  - type: StealCondition
    stealGroup: RubberStampNotary
    owner: job-name-clerk
