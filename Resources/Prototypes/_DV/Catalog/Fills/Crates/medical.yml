- type: entity
  id: CratePainkillerBottles
  parent: CrateMedical
  name: ящик для знеболюючого
  description: Закінчити їх - не варіант.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: PillCanisterStubantazine
        amount: 3

- type: entity
  id: CrateViralCarePackage
  parent: CrateMedical
  name: упаковка для лікування вірусів
  description: Містить усе, що вам потрібно, щоб приборкати спалах вірусу.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: JugPotassium
        - id: JugNitrogen
        - id: JugHydrogen
        - id: JugSilicon
        - id: Skimmer
        - id: BoxBottle
        - id: BoxSyringe
        - id: ClothingOuterBioVirology
          amount: 2
        - id: ClothingHeadHatHoodBioVirology
          amount: 2
        - id: ClothingMaskSterile
          amount: 2
        - id: PaperViralCarePackageManual

- type: entity
  id: CrateCrashCart
  parent: CrateMedical
  name: аварії кошик ящик
  description: Містить один порожній аварійний візок.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CrashCart
