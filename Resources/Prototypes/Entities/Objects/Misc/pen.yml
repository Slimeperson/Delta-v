- type: entity
  name: перо
  parent: BaseItem
  id: Pen
  description: Темна чорнильна ручка.
  components:
  - type: Sprite
    sprite: Objects/Misc/pens.rsi
    state: pen
  - type: Item
    sprite: Objects/Misc/pens.rsi
    heldPrefix: pen
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Pen
  - type: PhysicalComposition
    materialComposition:
      Steel: 25
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/pen_click.ogg
      params:
        volume: -4
        maxDistance: 2
  - type: UseDelay
    delay: 1.5
  - type: Tending # Shitmed
    speed: 0.55
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/hemostat1.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.3,0.1
          - -0.1,0.3
          - 0.3,-0.1
          - 0.1,-0.3
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  parent: Pen
  id: PenEmbeddable
  abstract: true
  components:
  - type: EmbeddableProjectile
    offset: 0.3,0.0
    removalTime: 0.0
  - type: ThrowingAngle
    angle: 315
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3

#TODO: I want the luxury pen to write a cool font like Merriweather in the future.

- type: entity
  name: розкішна ручка
  parent: Pen
  id: LuxuryPen
  description: Шикарна та дорога ручка, якою ви заслуговуєте, лише якщо маєте кваліфікацію, щоб працювати з величезною кількістю документів.
  components:
  - type: Sprite
    state: luxury_pen
  - type: Item
    heldPrefix: luxury_pen

- type: entity
  id: BaseAdvancedPen
  parent: PenEmbeddable
  abstract: true
  components:
  - type: Tag
    tags:
    - Write
    - WriteIgnoreStamps
    - Pen
  - type: MeleeWeapon
    wideAnimationRotation: -45
    damage:
      types:
        Piercing: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities:
    - Screwing
    useSound:
      collection: Screwdriver

- type: entity
  name: Ручка Cybersun
  parent: [BaseAdvancedPen, BaseSyndicateContraband]
  id: CyberPen
  description: Високотехнологічна ручка безпосередньо від юридичного відділу Cybersun, здатна заломлювати яскраве світло під неможливими кутами через алмазний кінчик, щоб писати. Настільки потужний, що він навіть може переписати офіційні документи з печаткою, якщо виникне потреба.
  components:
  - type: Sprite
    state: overpriced_pen
  - type: Item
    heldPrefix: overpriced_pen
  - type: StaticPrice
    price: 500

- type: entity
  name: Перо CentComm
  parent: [BaseAdvancedPen, BaseCentcommContraband]
  id: PenCentcom
  description: Намагаючись не відставати від «влади» кіберсонячної бюрократії, NT зробили копію кіберручки у своєму фірмовому стилі.
  components:
  - type: Sprite
    state: pen_centcom
  - type: Item
    heldPrefix: pen_centcom

- type: entity
  name: капітанська авторучка
  parent: PenEmbeddable
  id: PenCap
  description: Розкішна авторучка для капітана станції.
  components:
  - type: Sprite
    state: pen_cap

- type: entity
  name: Перова ручка HoP
  parent: PenEmbeddable
  id: PenHop
  description: Розкішна авторучка для головного вокзалу.
  components:
  - type: Sprite
    state: pen_hop

- type: entity
  name: чарівне перо чарівника
  parent: [ PenEmbeddable, BaseMagicalContraband ]
  id: PenWiz
  description: Розкішна авторучка. Здається, має чарівний кришталевий ластик.
  components:
  - type: Sprite
    state: pen_wizard
  - type: Tag
    tags:
    - WriteIgnoreStamps
    - Write
    - Pen
