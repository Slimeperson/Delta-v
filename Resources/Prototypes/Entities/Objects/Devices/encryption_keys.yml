  components:
  - type: EncryptionKey
    channels:
    - Security
    - Prison #deltaV
    defaultChannel: Security
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label
  - type: Tag
    tags:
    - EncryptionSecurity

- type: entity
  parent: [ EncryptionKey, BaseCivilianContraband ]
  id: EncryptionKeyService
  name: службовий ключ шифрування
  description: Ключ шифрування, який використовується обслуговуючим персоналом, який має підтримувати станцію заповненою, щасливою та чистою.
  components:
  - type: EncryptionKey
    channels:
    - Service
    defaultChannel: Service
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: service_label
  - type: Tag
    tags:
    - EncryptionService

- type: entity
  parent: [ EncryptionKey, BaseSyndicateContraband ]
  id: EncryptionKeySyndie
  name: криваво-червоний ключ шифрування
  description: Ключ шифрування, який використовує... зачекайте... Хто є власником цього чіпа?
  components:
  - type: EncryptionKey
    channels:
    - Syndicate
    defaultChannel: Syndicate
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label
  - type: ReverseEngineering # Nyano
    difficulty: 5
    recipes:
      - EncryptionKeySyndie
  - type: StaticPrice
    price: 500 # 1000 for 2

- type: entity
  parent: [ EncryptionKey, BaseSiliconScienceContraband ]
  id: EncryptionKeyBinary
  name: ключ двійкового транслятора
  description: Ключ шифрування, який перетворює двійкові сигнали, що використовуються силіконами.
  components:
  - type: EncryptionKey
    channels:
    - Binary
    defaultChannel: Binary
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: ai_label

- type: entity
  parent: [ EncryptionKey, BaseSyndicateContraband ]
  id: EncryptionKeyBinarySyndicate
  name: ключ двійкового транслятора
  description: Ключ шифрування синдикату, який перетворює двійкові сигнали, що використовуються силіконами.
  components:
  - type: EncryptionKey
    channels:
    - Binary
    defaultChannel: Binary
  - type: Sprite
    layers:
    - state: crypt_red
    - state: ai_label
  - type: StaticPrice
    price: 1000

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyFreelance
  name: фрілансерський ключ шифрування
  description: Ключ шифрування, який використовується фрілансерами, які можуть мати або не мати зв’язку. Схоже, що він зношений.
  components:
    - type: EncryptionKey
      channels:
        - Freelance
      defaultChannel: Freelance
    - type: Sprite
      layers:
        - state: crypt_rusted
        - state: pirate_label
