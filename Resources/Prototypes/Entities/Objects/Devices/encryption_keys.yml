  name: ключ шифрування med-epi # DeltaV - Департамент епістемології замінює науку
  description: Ключ шифрування, яким користується хтось, хто не вирішив, чию сторону стати.
  components:
  - type: EncryptionKey
    channels:
    - Medical
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: medsci_label

- type: entity
  parent: [ EncryptionKey, BaseScienceContraband ]
  id: EncryptionKeyScience
  name: ключ шифрування епістеміки # DeltaV - Департамент епістеміки замінює науку
  description: Ключ шифрування, який використовують вчені. Можливо, він плазмостійкий?
  components:
  - type: EncryptionKey
    channels:
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sci_label
