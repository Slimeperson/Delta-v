- type: entity
  name: Набір, що містить Прокляту Косу та набір броні Провісника.
  parent: BoxCardboard
  id: BoxEncryptionKeyPrisoner
  description: печінка павукоподібних # DeltaV
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: EncryptionKeyPrison
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: encryptokey
  - type: Storage
    whitelist:
      components:
      - EncryptionKey

