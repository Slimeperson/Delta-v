- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: HeavyFlatpackBase
  name: важкий плоский пакет
  description: Велика плоска упаковка, яка використовується для зберігання надзвичайно великої машини.
  components:
  - type: Sprite
    sprite: Objects/Devices/flatpack.rsi
    layers:
    - state: large
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 100
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractionOutline
