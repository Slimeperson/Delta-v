# Saws
- type: entity
  name: пилка по металу
  id: Saw
  parent: BaseToolSurgery
  description: Для розрізання деревини та інших предметів на частини. Або розпилювання кісток, у разі потреби.
  components:
  - type: Sharp
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: Item
    size: Normal
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    storedRotation: 90
  - type: Tool
    qualities:
      - Sawing
  # Shitmed Change
  - type: BoneSaw
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module
  # No melee for regular saw because have you ever seen someone use a band saw as a weapon? It's dumb.

- type: entity
  name: чоппа
  id: SawImprov
  parent: Saw
  description: Жахливе зубчасте лезо, зроблене з усіх бридких гострих предметів, які тільки можна знайти. # Це була б досить пристойна зброя, враховуючи, що є більше місця для деяких модифікацій інструментів.
  components:
  - type: Sprite
    state: improv
  - type: Item
    size: Small
    heldPrefix: improv
  - type: MeleeWeapon
    wideAnimationRotation: 90 # DeltaV: Added wideAnimationRotation
    damage:
      groups:
        Brute: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    speedModifier: 0.5
  - type: BoneSaw # Shitmed
    speed: 0.5

- type: entity
  name: циркулярна пила
  id: SawElectric
  parent: Saw
  description: Для важкого різання.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: Item
    size: Normal
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/circular-saw.rsi
  - type: MeleeWeapon
    # Start DeltaV additions
    autoAttack: true
    angle: 0
    wideAnimationRotation: 90
    attackRate: 4
    # End DeltaV additions
    damage:
      types:
        Slash: 2 # DeltaV: 15 brute changed to 2 slash
        Piercing: 2 # DeltaV: 15 brute changed to 2 piercing
        Structural: 10 # DeltaV: Added 10 structural damage
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool
    speedModifier: 1.5
  - type: BoneSaw # Shitmed
    speed: 1.5
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

- type: entity
  name: вдосконалена циркулярна пила
  id: SawAdvanced
  parent: [ SawElectric, BaseSyndicateContraband ]
  description: Найсучасніша хірургічна пила Interdyne. Гарантовано залишатиметься чистим і стерильним, незалежно від того, наскільки брудна робота.
