- type: entity
  parent: BaseAction
  id: ActionRevenantHaunt
  name: привид
  description: Дає сутність і вкрадену сутність для кожного свідка.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Ghosts/revenant.rsi
      state: icon
    useDelay: 20
  - type: InstantAction
    event: !type:RevenantHauntActionEvent

- type: entity
  parent: BaseAction
  id: ActionRevenantBloodWriting
  name: Написання крові
  description: Коштує 2 есенції за гліф.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: Interface/Actions/blood-writing.png
    useDelay: 1
  - type: InstantAction
    event: !type:RevenantBloodWritingEvent

- type: entity
  parent: BaseAction
  id: ActionRevenantAnimate
  name: силова стінка
  description: Коштує 50 Есенція.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: Interface/Actions/animate.png
    useDelay: 1
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Item
    canTargetSelf: false
    event: !type:RevenantAnimateEvent
