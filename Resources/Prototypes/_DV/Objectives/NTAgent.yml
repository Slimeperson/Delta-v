- type: entity
  parent: BaseSurviveObjective
  abstract: true
  id: BaseNTAgentObjective
  components:
  - type: Objective
    issuer: objective-issuer-NTAgent
    difficulty: 1
  - type: RoleRequirement
    roles:
    - NTAgentRole

- type: entity
  parent: BaseNTAgentObjective
  id: BaseNTAgentTestDepartment
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/bureaucracy.rsi
      state: paper_words

# listen to CC
- type: entity
  parent: BaseNTAgentObjective
  id: NTAgentObjective
  name: Виконайте своє завдання.
  description: Якщо до вас звернеться Центральний центр, також виконайте їхні цілі.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Ears/Headsets/centcom.rsi
      state: icon

# frame someone
- type: entity
  parent: BaseNTAgentObjective
  id: FrameRandomPersonObjective
  description: Ми хотіли б, якби вони потрапили в проблеми з законом. Переконайтеся, що вони потраплять у в'язницю.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: об'єктивна-умова-каркас-особа-титул
  - type: PickRandomPerson
    filters:
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TargetObjectiveImmune # DeltaV

# fire someone
- type: entity
  parent: BaseNTAgentObjective
  id: FireRandomPersonObjective
  description: Нам потрібно їх звільнити з кількох причин, але юридично ми не можемо знайти. Придумайте один.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/id_cards.rsi
      state: default
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: об'єктивний-умова-звільнена-особа-назва
  - type: PickRandomPerson
    filters:
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TargetObjectiveImmune # DeltaV

# auditing
- type: entity
  parent: BaseNTAgentTestDepartment
  id: TestSecurityObjective
  name: Аудит безпеки.
  description: Перевірте час відповіді, знання закону чи будь-що інше. Результати відправити в Централ.

- type: entity
  parent: BaseNTAgentTestDepartment
  id: TestEngineeringObjective
  name: Інженерний аудит.
  description: Перевірте час реагування на саботаж, структурні пошкодження чи щось інше. Результати відправити в Централ.

- type: entity
  parent: BaseNTAgentTestDepartment
  id: TestMedicalObjective
  name: Аудит медичний.
  description: Перевірте час відповіді, медичні знання чи будь-що інше. Результати відправити в Централ.

# defunding
- type: entity
  parent: BaseNTAgentObjective
  id: DefundDepartmentObjective
  name: Дефінансувати будь-який відділ.
  description: Розкрадати або витрачати кошти будь-якого відділу.
  components:
  - type: Objective
    icon:
      sprite: _DV/Objects/Misc/first_bill.rsi
      state: icon
