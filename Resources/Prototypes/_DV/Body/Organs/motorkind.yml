- type: entity
  id: BaseMotorkindOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Mobs/Species/Motorkind/organs.rsi
  - type: Organ

- type: entity
  id: OrganMotorkindBrainEngine
  parent: [BaseMotorkindOrgan, PositronicBrain]
  name: мотодвигун
  description: "Компактний двигун внутрішнього згоряння, який був модифікований, щоб служити центральним процесором для мотоциклів».
  components:
  - type: Sprite
    state: engine
    layers:
    - state: engine
      map: ["base"]

- type: entity
  id: OrganMotorkindEyes
  parent: BaseMotorkindOrgan
  name: лобове скло мотоцикла
  description: "Єдине лобове скло, яке служить для захисту кабіни Motorkind, а також забезпечує огляд, якимось чином».
  components:
  - type: Sprite
    state: windshield
  - type: Eyes
  - type: Organ
    slotId: eyes
  - type: Tag
    tags:
    - Organ
    - Eyes

- type: entity
  id: OrganMotorkindStomachFuelTank
  parent: BaseMotorkindOrgan
  name: паливний бак мотоцикла
  description: "Паливний бак, у якому зберігається різне паливо для двигуна автомобіля».
  components:
  - type: Sprite
    state: fuel_tank
  - type: Organ
    slotId: stomach
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 5
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Fuel ]
    groups:
    - id: Food
    - id: Drink
    - id: Medicine
    - id: Poison
    - id: Narcotic
    - id: Alcohol
  - type: Item
    size: Small
    heldPrefix: stomach

- type: entity
  id: OrganMotorkindLiverOilFilter
  parent: BaseMotorkindOrgan
  name: масляний фільтр двигуна
  description: "Масляний фільтр, який очищає оливу автомобіля, щоб забезпечити безперебійну роботу двигуна».
  components:
  - type: Sprite
    state: oil_filter
  - type: Organ
    slotId: liver

- type: entity
  id: OrganMotorkindLungsCatalyticConverter
  parent: OrganHumanLungs
  name: каталітичний нейтралізатор автомобіля
  description: "Допомагає очистити потужність двигуна Motorkind у щось менш токсичне. На мотоциклістів часто полюють заради цих цінних трофеїв».
  components:
  - type: Organ
    slotId: lungs
  - type: Sprite
    sprite: _DV/Mobs/Species/Motorkind/organs.rsi
    state: catalytic_converter
    layers:
      - state: catalytic_converter
      - state: catalytic_converter
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Fuel ]
    groups:
      - id: Gas
        rateModifier: 100.0
