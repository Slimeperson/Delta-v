- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseParadoxCloneObjective
  components:
  - type: Objective
    # required but not used
    difficulty: 1
    issuer: objective-issuer-paradox
  - type: RoleRequirement
    roles:
    - ParadoxCloneRole
  - type: Tag
    tags:
    - ParadoxCloneObjectiveBlacklist # don't copy the objectives from other clones

- type: entity
  parent: [BaseParadoxCloneObjective, BaseLivingObjective]
  id: ParadoxCloneLivingObjective
  name: Втікайте до CentComm живим і нестримним за допомогою евакуаційного човника.
  description: Поверніться до старого життя.
  components:
  - type: Objective
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition

- type: entity
  parent: [BaseParadoxCloneObjective, BaseKillObjective]
  id: ParadoxCloneKillObjective
  name: Виправити парадокс простору-часу.
  description: Замініть свій оригінал, щоб виправити парадокс. Пам'ятайте, що ваша місія - злитися, не вбивайте нікого, якщо вам це не потрібно!
  components:
  - type: PickSpecificPerson
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: object-condition-kill-head-title # вбити <ім'я>, <робота>

