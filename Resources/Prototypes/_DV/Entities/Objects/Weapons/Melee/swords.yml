- type: entity
  parent: BaseSword
  id: SilverSword
  name: срібний меч
  description: Прекрасний меч, виготовлений майже повністю зі срібла. Його лезо тупе і не може тримати вістря, але, можливо, це може бути щось більше...
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/silversword.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
  - type: Item
    sprite: _DV/Objects/Weapons/Melee/silversword.rsi
  - type: Construction
    graph: RadiantSword
    node: start
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
    - belt
  - type: Tag
    tags:
      - SilverSword

- type: entity
  parent: SilverSword
  id: EmbeddedSword
  name: вбудований меч bluespace
  description: Ви не думали, що просто додавання синього простору зробить цю зброю працездатною, чи не так?
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/silversword.rsi
    state: bluespace_embedded
  - type: Construction
    graph: RadiantSword
    node: embeddedsword


- type: entity
  parent: SilverSword
  id: RadiantSword
  name: променистий меч
  description: Срібний меч, пройнятий світлом віри капелана. Хоча він залишається неефективним проти фізичного, це потужний інструмент проти тих, хто з-за завіси.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Melee/radiantsword.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
        Holy: 15
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _DV/Objects/Weapons/Melee/radiantsword.rsi
  - type: Construction
    graph: RadiantSword
    node: radiantsword
  - type: RevealRevenantOnCollide
  - type: CollisionWake
    enabled: false
