- type: entity
  parent: BaseItem
  id: voicesensor
  name: голосовий датчик
  description: Цей мікрофон, винайдений Micheal Phone під час його роботи в Michealsoft, надсилає сигнали, коли вимовляється попередньо записана кодова фраза!
  components:
  - type: Sprite
    sprite: Objects/Devices/voicesensor.rsi
    state: icon
  - type: StaticPrice
    price: 40
  - type: DeviceLinkSource
    ports:
      - Trigger
  - type: SignalOnTrigger
    port: Trigger
  - type: TriggerOnVoice
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
  - type: EmitSoundOnTrigger
    sound:
      collection: TriggerActivate
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15
