# AME

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringAMEShielding
  name: bounty-description-toolbox
  description: 9 частин для основного корпусу реактора з антиматерією або для розширення існуючого.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: AmePartFlatpack
        amount: 9

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringAMEJar
  name: Ящик для зберігання антиматерії
  description: 3 банки антиматерії, для заправки реактора антиматерії.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: AmeJar
        amount: 3

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringAMEControl
  name: ящик блоку керування антиматерією
  description: Блок управління реактором антиматерії.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: AmeControllerUnanchored

# Singularity

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityEmitter
  name: емітерний ящик
  description: ящик для корів
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: EmitterFlatpack

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityCollector
  name: ящик для збору радіації
  description: Колектор випромінювання, який найкраще використовувати для двигунів сингулярності. Плазма включена.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: RadiationCollectorFlatpack
        - id: PlasmaTankFilled

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityContainment
  name: коробка генератора поля стримування
  description: Генератор поля стримування тримає сингуло в покорі.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: ContainmentFieldGeneratorFlatpack

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityGenerator
  name: ящик генератора сингулярності
  description: Генератор сингулярності, мати звіра.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: SingularityGeneratorFlatpack

# Particle Accelerator

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringParticleAccelerator
  name: Обрешітка з ПА дошки
  description: Складний у налаштуванні, але дуже корисний. Містить плати для всіх компонентів прискорювача частинок.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MachineParticleAcceleratorEndCapCircuitboard
        - id: MachineParticleAcceleratorEmitterStarboardCircuitboard
        - id: MachineParticleAcceleratorEmitterForeCircuitboard
        - id: MachineParticleAcceleratorEmitterPortCircuitboard
        - id: MachineParticleAcceleratorFuelChamberCircuitboard
        - id: MachineParticleAcceleratorPowerBoxCircuitboard
        - id: ParticleAcceleratorComputerCircuitboard

