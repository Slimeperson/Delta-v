  id: FoodPizzaCorncob
  description: Зібране як поганий жарт. Найкраще подавати з рідким маслом.
  components:
  - type: FlavorProfile
    flavors:
      - corncob
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/pizza.rsi
    state: corncob
  - type: SliceableFood
    slice: FoodPizzaCorncobSlice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: Nutriment
          Quantity: 36
        - ReagentId: Nausium
          Quantity: 33
