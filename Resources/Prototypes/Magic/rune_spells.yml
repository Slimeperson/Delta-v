- type: entity
  abstract: true
  parent: BaseAction
  id: BaseRuneAction
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default

- type: entity
  parent: BaseRuneAction
  id: ActionFlashRune
  name: Flash Rune
  description: Викликає руну, яка блимає, якщо її використати.
  components:
  - type: Action
    useDelay: 10
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: FlashRune

- type: entity
  parent: BaseRuneAction
  id: ActionExplosionRune
  name: Руна вибуху
  description: Викликає руну, яка вибухає, якщо її використати.
  components:
  - type: Action
    useDelay: 20
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: ExplosionRune

- type: entity
  parent: BaseRuneAction
  id: ActionIgniteRune
  name: Запалити руну
  description: Змінний статор для газової турбіни.
  components:
  - type: Action
    useDelay: 15
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: IgniteRune

- type: entity
  parent: BaseRuneAction
  id: ActionStunRune
  name: Приголомшлива руна
  description: Викликає руну, яка приголомшує, якщо її використати.
  components:
  - type: Action
    useDelay: 10
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: StunRune
