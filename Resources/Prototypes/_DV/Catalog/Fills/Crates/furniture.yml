- type: entity
  parent: CrateGenericSteel
  id: CrateFurnitureDecorativePlants
  name: кімнатні рослини
  description: Прикрасьте своє місце невеликою кількістю листя. Містить чотири горщики з попередньо висіяними рослинами.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - id: PlantPotPreSeeded
          weight: 10
          amount: !type:ConstantNumberSelector
            value: 4
        - id: PlantPotPreSeededBioluminscent
          amount: !type:ConstantNumberSelector
            value: 4

- type: entity
  parent: CrateGenericSteel
  id: CrateFurnitureDecorativePlantsPlastic
  name: горщикові пластикові рослини
  description: Прикрасьте своє місце невеликою кількістю листя. Містить чотири пластикові рослини в горщиках.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: PlantPotPreSeededPlastic
          amount: !type:ConstantNumberSelector
            value: 4
