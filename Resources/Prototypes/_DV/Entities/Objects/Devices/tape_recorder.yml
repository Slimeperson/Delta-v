- type: entity
  parent: BaseItem
  id: TapeRecorder
  name: магнітофон
  description: Усе, що сказано в цей пристрій, може і буде використано проти вас у суді космічного права.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/tape_recorder.rsi
    layers:
    - state: empty
    - state: idle
      map: ["tape"]
      visible: false
  - type: Item
    size: Small
  - type: TapeRecorder
  - type: ActiveListener
    range: 4
  - type: UseDelay
    delay: 1
  - type: Speech
  - type: ItemSlots
    slots:
      cassette_tape:
        priority: 4
        whitelist:
          components:
          - FitsInTapeRecorder
  - type: ContainerContainer
    containers:
      cassette_tape: !type:ContainerSlot
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TapeRecorderVisuals.Mode:
        tape:
          Stopped: { state: "idle" }
          Playing: { state: "playing" }
          Recording: { state: "recording" }
          Rewinding: { state: "rewinding" }
      enum.TapeRecorderVisuals.TapeInserted:
        tape:
          True: { visible: true }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.TapeRecorderUIKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.TapeRecorderUIKey.Key:
        type: TapeRecorderBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Pause
    - Record
    - Playback
    - Rewind

- type: entity
  parent: TapeRecorder
  id: TapeRecorderFilled
  suffix: Заповнений
  components:
  - type: ContainerFill
    containers:
      cassette_tape:
      - CassetteTape

- type: entity
  parent: BaseItem
  id: CassetteTape
  name: касетна стрічка
  description: Магнітна стрічка, яка може вмістити до двох хвилин вмісту з обох сторін.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cassette_tapes.rsi
    layers:
    - state: tape_greyscale
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tape_ribbonoverlay
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
  - type: Item
    size: Tiny
  - type: Damageable
  - type: TapeCassette
    maxCapacity: 180
    repairWhitelist:
      tags:
      - Screwdriver
      - Write
  - type: FitsInTapeRecorder
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        tape_greyscale: Rainbow

- type: entity
  suffix: Інтерв'ю з Гаррі Смошем
  parent: CassetteTape
  id: CassetteTapeInterview
  components:
  - type: Label
    currentLabel: cassette-tape-garry-smosh
  - type: TapeCassette
    recordedData:
      - timestamp: 2
        name: Філ Дервін
        message: "Зараз об 11:43 ранку, у кімнаті присутні Філ Дервін, детектив першого класу, офіцер Белв’ю та Ґрері Смош, підозрювані за одним пунктом звинувачення у незаконному проникненні, чотирьох пунктах нападу, двох пунктах звинувачення у крадіжці та 85 пунктах звинувачення у порушенні спокою».
      - timestamp: 6
        name: Філ Дервін
        message: "Пане Смош, чи розумієте ви звинувачення, у яких вас звинувачують?»
      - timestamp: 14
        name: Грері Смош
        message: "Мені байдуже, що ви говорите, я нічого не зробив».
      - timestamp: 18
        name: Філ Дервін
        message: "Сер, вас спіймали на гарячому в спальні капітанів. Посеред спроби викрасти його запас віскі не менше».
      - timestamp: 23
        name: Філ Дервін
        message: "Тобі пощастило, що він не застрелив тебе за це».
      - timestamp: 28
        name: Грері Смош
        message: "Я не бачив жодних знаків про те, що я не можу бути там».
      - timestamp: 34
        name: Філ Дервін
        message: "Спальня капітанів? Я не думаю, що нам потрібен знак, який закликає людей триматися подалі – це здоровий глузд».
      - timestamp: 38
        name: Філ Дервін
        message: "У будь-якому випадку, це не суть справи, навіть якщо це не було заборонено, все одно є питання заборонених предметів, які ми знайшли у вас, і подальшої спроби ухилитися від арешту».
      - timestamp: 42
        name: Грері Смош
        message: "Я нічого не зробив».
      - timestamp: 46
        name: Офіцер Белвью
        message: "Ви підскочили 3 офіцерам, вкрали електрошокову палицю та побили нею Ієна. HOP був дуже засмучений цією останньою частиною».
      - timestamp: 50
        name: Грері Смош
        message: "Хто з вас дав HOP дисейблер?"
      - timestamp: 54
        name: Філ Дервін
        message: "Наглядач так і зробив, виявилося гарною ідеєю, еге ж?»
      - timestamp: 58
        name: Офіцер Белвью
        message: "Я б так сказав».
