- type: entity
  parent: Holoprojector
  id: HoloprojectorEngineering
  name: інженерний голопроектор
  description: Відображає попереджувальний знак.
  components:
  - type: ChargeHolosignProjector
    signProto: HolosignEng
    signComponentName: Holosign # Fuck it, these can pick up janitor signs.
  - type: AutoRecharge
    rechargeDuration: 180
  - type: Sprite
    sprite: Nyanotrasen/Objects/Devices/Holoprojectors/eng.rsi
    state: icon

- type: entity
  parent: BaseItem
  id: HolotapeProjector
  name: голографічний проектор
  description: Зручний спосіб огородити особливо небезпечну зону – повідомте всім, що їм не можна заходити туди без каски.
  components:
  - type: ChargeHolosignProjector
    signProto: HoloTape
    signComponentName: Holotape
  - type: AutoRecharge
    rechargeDuration: 60
  - type: Sprite
    sprite: _DV/Objects/Devices/Holoprojectors/holotape.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: LimitedCharges
    maxCharges: 6
  - type: ContainerContainer
    containers:
      signs: !type:Container
  - type: Tag
    tags:
    - HolofanProjector
