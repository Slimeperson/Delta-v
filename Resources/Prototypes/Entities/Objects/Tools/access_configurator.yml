- type: entity
  parent: BaseItem
  id: AccessConfigurator
  name: конфігуратор доступу
  description: Використовується для зміни вимог до рівня доступу для шлюзів та інших пристроїв, що замикаються.
  components:
    - type: EmitSoundOnLand
      sound:
        path: /Audio/Items/multitool_drop.ogg
    - type: Sprite
      sprite: Objects/Tools/access_configurator.rsi
      state: icon
    - type: Item
      size: Small
    - type: Clothing
      sprite: Objects/Tools/access_configurator.rsi
      quickEquip: false
      slots:
        - Belt
    - type: AccessOverrider
      accessLevels:
      - Armory
      - Atmospherics
      - Bar
      #- Brig # DeltaV - Removed Brig Access
      - Detective
      - Captain
      - Cargo
      - Chapel
      - Chemistry
      - ChiefEngineer
      - ChiefMedicalOfficer
      - Command
      - Engineering
      - External
      - HeadOfPersonnel
      - HeadOfSecurity
      - Hydroponics
      - Janitor
      - Kitchen
      - Lawyer
      - Maintenance
      - Medical
      - Quartermaster
      - Research
      - ResearchDirector
      - Salvage
      - Security
      - Service
      - Theatre
      - GenpopEnter
      - GenpopLeave
      # Begin DeltaV Additions
      - Boxer
      - ChiefJustice
      - Clerk
      - Clown
      - Corpsman
      - Justice
      - Library
      - Mail
      - Mantis
      - Mime
      - Musician
      - Paramedic
      - Prosecutor
      - Psychologist
      - Reporter
      - Robotics
      - Surgery
      - Zookeeper
      # End DeltaV Additions
      privilegedIdSlot:
        name: id-card-console-privileged-id
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectOnBreak: true
        swap: false
        whitelist:
          components:
          - IdCard
        blacklist: # DeltaV - prevent removing access using borg id chips
          tags:
          - IdChip
      denialSound:
        path: /Audio/Machines/custom_deny.ogg
      doAfter: 0.5
    - type: UserInterface
      interfaces:
        enum.AccessOverriderUiKey.Key:
          type: AccessOverriderBoundUserInterface
    - type: ActivatableUI
      key: enum.AccessOverriderUiKey.Key
      requiresComplex: true
      requireActiveHand: false
      singleUser: true
      inHandsOnly: true
    - type: ItemSlots
    - type: ContainerContainer
      containers:
        AccessOverrider-privilegedId: !type:ContainerSlot

- type: entity
  parent: AccessConfigurator
  id: AccessConfiguratorUniversal
  name: конфігуратор універсального доступу
  suffix: адмін
  description: Змінений конфігуратор доступу, який використовується лише міфічним адміністратором.
  components:
  - type: Sprite
    sprite: Objects/Tools/universal_access_configurator.rsi
  - type: Clothing
    sprite: Objects/Tools/universal_access_configurator.rsi
  - type: AccessOverrider
    accessLevels:
    # Begin DeltaV Additions
    - Boxer
    - ChiefJustice
    - Clerk
    - Clown
    - Corpsman
    - DV-SpareSafe
    - ERT
    - Justice
    - Library
    - Mail
    - Mantis
    - Mime
    - Musician
    - Paramedic
    - Prosecutor
    - Psychologist
    - Reporter
    - Robotics
    - Surgery
    - Zookeeper
    - Admeme1 # admeme-only access levels
    - Admeme2
    - Admeme3
    # End DeltaV Additions
    - Armory
    - Atmospherics
    - Bar
    - BasicSilicon
    - Borg
    #- Brig # DeltaV
    - Detective
    - Captain
    - Cargo
    - Chapel
    - Chemistry
    - ChiefEngineer
    - ChiefMedicalOfficer
    - Command
    - Cryogenics
    - EmergencyShuttleRepealAll
    - Engineering
    - External
    - HeadOfPersonnel
    - HeadOfSecurity
    - Hydroponics
    - Janitor
    - Kitchen
    - Lawyer
    - Maintenance
    - Medical
    - Quartermaster
    - Research
    - ResearchDirector
    - Salvage
    - Security
    - Service
    - StationAi
    - Theatre
    - CentralCommand
    - NuclearOperative
    - SyndicateAgent
    - Wizard
    - Xenoborg
    - GenpopEnter
    - GenpopLeave
    privilegedIdSlot:
      name: id-card-console-privileged-id
      startingItem: UniversalIDCard
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    denialSound:
      path: /Audio/Machines/custom_deny.ogg
    doAfter: 0.5

- type: entity
  parent: AccessConfigurator
  id: AccessConfiguratorXenoborg
  name: конфігуратор доступу xenoborg
  description: Модифікований конфігуратор доступу, який використовується ксеноборгами.
  components:
  - type: Sprite
    sprite: Objects/Tools/access_configurator.rsi
  - type: Clothing
    sprite: Objects/Tools/access_configurator.rsi
  - type: AccessOverrider
    showPrivilegedId: false
    accessLevels:
    - Xenoborg
    privilegedIdSlot:
      name: id-card-console-privileged-id
      startingItem: XenoborgIDCard
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      disableEject: true
      swap: false
      whitelist:
        components:
        - IdCard
    denialSound:
      path: /Audio/Machines/custom_deny.ogg
    doAfter: 0.5
