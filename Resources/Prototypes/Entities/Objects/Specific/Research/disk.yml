- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: дослідницький диск (1000)
  description: Диск для R&D сервера на 1000 точок.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: дослідницький диск (5000)
  description: Диск для R&D сервера на 5000 точок.
  components:
  - type: ResearchDisk
    points: 5000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: дослідницький диск (10000)
  description: Диск для R&D сервера, що містить 10000 точок.
  components:
  - type: ResearchDisk
    points: 10000

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: дослідницький точковий диск
  suffix: НАЛАГОДЖЕННЯ, НЕ КАРТА
  categories: [ DoNotMap ]
  description: Диск для сервера досліджень і розробок, що містить усі пункти, які вам можуть знадобитися.
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: технологічний диск
  description: Диск для сервера досліджень і розробок, що містить дослідницьку технологію.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        datadisk_base: Sixteen
  - type: TechnologyDisk
  - type: StaticPrice
    price: 100
  - type: StealTarget
    stealGroup: TechnologyDisk

- type: entity
  parent: TechnologyDisk
  id: TechnologyDiskRare
  suffix: рідкісні.
  components:
  - type: TechnologyDisk
    tierWeightPrototype: RareTechDiskTierWeights
