- type: entity
  name: ящик для наручників
  parent: BoxCardboard
  id: BoxHandcuff
  description: Ящик, повний наручників.
  components:
  - type: Storage
    whitelist:
      components:
      - Handcuff
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Handcuffs
        amount: 4
  - type: Sprite
    layers:
    - state: box_security
    - state: handcuff

