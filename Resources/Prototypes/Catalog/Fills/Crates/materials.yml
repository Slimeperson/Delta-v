- type: entityTable
  id: RandomMaterialCrateTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # regular materials, 10
      weight: 35
      children:
      - id: SheetGlass10
      - id: SheetSteel10
      - id: SheetPlastic10
    - !type:GroupSelector # regular materials, stack
      weight: 30
      children:
      - id: SheetGlass
      - id: SheetSteel
      - id: SheetPlastic
    - !type:GroupSelector # secondary materials, stack
      weight: 30
      children:
      - id: MaterialCloth
      - id: SheetPlasteel
      - id: MaterialWoodPlank
      - id: PartRodMetal
    - !type:GroupSelector # tertiary materials, singles
      weight: 5
      children:
      - id: SheetPlasma1
      - id: SheetUranium1
      - id: IngotGold1
      - id: IngotSilver1

- type: entity
  parent: CrateGenericSteel
  id: CrateMaterialRandom
  name: надлишки матеріалів
  description: Зайві матеріали звідкись.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: RandomMaterialCrateTable
        rolls: !type:RangeNumberSelector
          range: 2, 4

- type: entity
  parent: CrateGenericSteel
  id: CrateMaterialSilo
  name: силосний ящик для матеріалу
  description: Пакет із усіма матеріалами для створення силосу для матеріалів.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MaterialSiloMachineCircuitboard
        - id: SheetSteel1
          amount: 5
        - id: MicroManipulatorStockPart
          amount: 4
        - id: CableApcStack1
          amount: 2

- type: entity
  parent: CrateGenericSteel
  id: CrateMaterialBasicResource
  name: основна листова обрешітка
  description: 30 листів сталі, скла та пластику.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SheetSteel
        - id: SheetGlass
        - id: SheetPlastic

