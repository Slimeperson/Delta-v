- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, DrinkBase ]
  id: SprayBottleBase
  components:
  - type: Edible
    edible: Drink
    solution: drink
    transferAmount: 10
    useSound:
      path: /Audio/Effects/spray3.ogg
      params:
        variation: 0.2
  - type: Tag
    tags:
    - Spray
    - Trash
  - type: Sprite
    sprite: Objects/Specific/Janitorial/spray_bottle.rsi
    state: cleaner
  - type: Item
    sprite: Objects/Specific/Janitorial/spray_bottle.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: UseDelay
  - type: Spray
    solution: drink
    transferAmount: 10
    sprayVelocity: 2
    spraySound:
      path: /Audio/Effects/spray2.ogg
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: [ SprayBottleBase, DrinkVisualsFill ]
  id: SprayBottle
  name: пляшка з розпилювачем
  suffix: Порожній
  description: Пляшка з пульверизатором з кришкою, що відкручується.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/spray_bottle.rsi
    layers:
    - state: cleaner
    - state: cleaner-fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    fillBaseName: cleaner-fill-
    inHandsMaxFillLevels: 4

- type: entity
  parent: SprayBottle
  id: MegaSprayBottle
  name: мега спрей пляшка
  suffix: Порожній
  description: Величезний флакон з розпилювачем, який має неперевершену ефективність у прибиранні.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/spray_bottle.rsi
    layers:
    - state: cleaner_large
    - state: cleaner_large-fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 7
    fillBaseName: cleaner_large-fill-
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 250
  - type: Spray
    transferAmount: 15
    sprayedPrototype: BigVapor
    sprayVelocity: 3
    sprayDistance: 4.5
    spraySound:
      path: /Audio/Effects/spray2.ogg

- type: entity
  parent: SprayBottle
  id: SprayBottleWater
  name: пляшка з розпилювачем
  suffix: Заповнений
  components:
  - type: Tag
    tags:
    - Spray
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: Water
          Quantity: 100

- type: entity
  parent: SprayBottle
  id: SprayBottleSpaceCleaner
  suffix: Прибиральник космосу
  description: Непінний засіб для чищення приміщень марки BLAM!!
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 100
  - type: Label
    currentLabel: space cleaner
  - type: Tag
    tags:
      - Spray

- type: entity
  parent: MegaSprayBottle
  id: MegaSprayBottleSpaceCleaner
  suffix: Прибиральник космосу
  description: Непінний засіб для чищення простору бренду BLAM! тепер у більшій упаковці для тих величезних калюж крові!
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 250
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 250
  - type: Label
    currentLabel: space cleaner

- type: entity
  parent: SprayBottle
  id: BorgSprayBottle
  name: внутрішній струмінь розпилення
  suffix: Заповнений
  description: Ємність під тиском для розпилення реагентів, встановлена ​​безпосередньо в кіборга-утримувача. Зазвичай наповнений очищувачем для боротьби з неприємними розливами.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 200
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 200

- type: entity
  parent: MegaSprayBottle
  id: BorgMegaSprayBottle
  name: присл. внутрішній струмінь розпилення
  suffix: Заповнений
  description: Удосконалена версія інтегрованої пляшки з розпилювачем, яка встановлюється безпосередньо в кіборга. Він здатний очищувати простір від вологи в повітрі.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 250
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 250
  - type: SolutionTransfer
    canSend: false # No giving away infinite space cleaner!
  - type: SolutionRegeneration
    solution: drink
    duration: 5 # Delta-V - Refill borg's mega spray 1 full use per 5 seconds
    generated:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 10 # Delta-V - Refill borg's mega spray 1 full use per 5 seconds


# Vapor
- type: entity
  id: Vapor
  categories: [ HideSpawnMenu ]
  name: "пара"
  components:
  - type: SolutionContainerManager
    solutions:
      vapor:
        maxVol: 50
  - type: Vapor
    active: true
    transferAmountPercentage: 0.5
  - type: AnimationPlayer
  - type: Sprite
    sprite: Effects/chempuff.rsi
    rotation: 180
    layers:
    - state: chempuff
      map: ["enum.VaporVisualLayers.Base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        hard: false
        mask:
        - FullTileMask
        - Opaque
        layer:
        - ItemMask
  - type: Appearance
  - type: VaporVisuals

- type: entity
  parent: Vapor
  id: BigVapor
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chempuff.rsi
    rotation: 180
    layers:
    - state: chempuff
      scale: 2, 2
      map: ["enum.VaporVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        hard: false
        mask:
        - FullTileMask
        - Opaque

- type: entity
  parent: Vapor
  id: FlowerVapor
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/extinguisherSpray.rsi
    layers:
    - state: extinguish
      map: [ "enum.VaporVisualLayers.Base" ]
  - type: VaporVisuals
    animationTime: 0.8
    animationState: extinguish
