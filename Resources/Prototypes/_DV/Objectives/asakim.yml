- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseAsakimObjective
  components:
  - type: Objective
    difficulty: 1 # unused
    issuer: objective-issuer-asakim
    icon:
      sprite: _Mono/Objects/Weapons/Melee/hfblade.rsi
      state: icon
  - type: RoleRequirement
    roles:
    - AsakimRole

- type: entity
  parent: BaseAsakimObjective
  id: AsakimKillObjective
  name: "> ПРИПИНИТИ"
  description: loadout-group-security-gun
  components:
  - type: Objective
    issuer: objective-issuer-asakim
    unique: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: object-condition-asakim-terminate-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: RerollAfterCompletion
    rerollObjectivePrototype: AsakimKillObjective
    rerollObjectiveMessage: objective-condition-asakim-terminate-reroll-message

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimTheftObjective
  name: ">КОНФІСКАТИ"
  description: Записи вказують на те, що в цьому секторі можуть бути цінні предмети. Такі предмети вилучити для подальшого вивчення.
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimInfiltrateObjective
  name: ">ІНФІЛЬТРАТ"
  description: У навколишньому радіомовленні згадується "Зони суворої безпеки". Дослідіть такі місця, якщо вони існують.
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimInterrogateObjective
  name: ">ДОПИТУЙТЕ"
  description: ПОПЕРЕДЖЕННЯ. Виявлено розрив у [ERROR] років. Записи можуть бути застарілими. Проконсультуйтеся з місцевим населенням.
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimUpgradeObjective
  name: ">ОНОВИТИ"
  description: Попереднє сканування секторів виявляє можливу важливу кібернетику. Оновіть своє тіло.
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimAllyObjective
  name: ">ФІЛІЯ"
  description: видова назва-оні
  components:
  - type: Objective
