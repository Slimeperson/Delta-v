- type: entity
  id: BarberScissors
  name: перукарські ножиці
  description: Здатний змінити зачіску будь-якої стрижки на свій смак.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Tools/scissors.rsi
    state: icon
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Tools/scissors.rsi
  - type: MagicMirror
    addSlotTime: 20
    removeSlotTime: 20
    selectSlotTime: 20
    changeSlotTime: 20
  - type: ActivatableUI
    key: enum.MagicMirrorUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
  - type: UserInterface
    interfaces:
      enum.MagicMirrorUiKey.Key:
        type: MagicMirrorBoundUserInterface
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Piercing: 6
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
