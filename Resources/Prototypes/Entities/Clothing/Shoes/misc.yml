- type: entity
  parent: [ClothingShoesBase, PowerCellSlotSmallItem, BaseToggleClothing]
  id: ClothingShoesBootsSpeed
  name: швидкісні черевики
  description: Високотехнологічні черевики з переплетеними волокнами bluespace, здатні перетворювати електрику на чисту швидкість! # Незаконні операції DeltaV
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/speedboots.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: Clothing/Shoes/Boots/speedboots.rsi
  - type: ToggleClothing
    action: ActionToggleSpeedBoots
  - type: ClothingSpeedModifier
    walkModifier: 1.7 # DeltaV
    sprintModifier: 1.7 # DeltaV
    standing: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: StaticPrice
    price: 500
  - type: PowerCellDraw
    drawRate: 30 # DeltaV 4>30, you have to turn off micro reactor at somepoint
  - type: ToggleCellDraw
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: Tag
    tags: []
  - type: ReverseEngineering # DeltaV
    difficulty: 4
    recipes:
    - ClothingShoesBootsSpeed

- type: entity
  parent: BaseAction
  id: ActionToggleSpeedBoots
  name: Перемкнути швидкісні черевики
  description: Вмикає та вимикає швидкість завантаження.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

