- type: entity
  parent: BoxCardboard
  id: BoxBottleMedicineBasic
  name: базова коробка для пляшок ліків
  description: Ящик, наповнений пляшками з ліками.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ChemistryBottleBruizine
        - id: ChemistryBottleLacerinol
        - id: ChemistryBottlePuncturase
        - id: ChemistryBottleDermaline
        - id: ChemistryBottlePyrazine
        - id: ChemistryBottleDiphenhydramine
        - id: ChemistryBottleOmnizine
        - id: ChemistryBottleEphedrine
          amount: 2
  - type: Sprite
    layers:
    - state: box
    - state: bottle

- type: entity
  parent: BoxBottleMedicineBasic
  id: BoxBottleMedicineAdvanced
  name: вдосконалена коробка для пляшок з ліками
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ChemistryBottleOmnizine
          amount: 7
        - id: ChemistryBottleEphedrine
          amount: 2
