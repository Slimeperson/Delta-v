- type: entity
  parent: BaseHandheldInstrument
  id: BasePercussionInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - PercussionInstrument

- type: entity
  parent: BasePercussionInstrument
  id: GlockenspielInstrument
  name: глокеншпіль
  components:
  - type: Instrument
    program: 9
  - type: Sprite
    sprite: Objects/Fun/Instruments/glockenspiel.rsi

- type: entity
  parent: BasePercussionInstrument
  id: MusicBoxInstrument
  name: музична скринька
  description: Граючи в цю гру, ви відчуваєте себе в безпеці від страшної аніматроніки.
  components:
  - type: Instrument
    program: 10
  - type: Sprite
    sprite: Objects/Fun/Instruments/musicbox.rsi
  - type: Item
    size: Small

- type: entity
  parent: BasePercussionInstrument
  id: XylophoneInstrument
  name: ксилофон
  description: Глокеншпіль веселкового кольору.
  components:
  - type: Instrument
    program: 13
  - type: Sprite
    sprite: Objects/Fun/Instruments/structureinstruments.rsi
    state: xylophone

- type: entity
  parent: BaseHandheldInstrument
  id: MicrophoneInstrument
  name: мікрофон
  description: Ідеально підходить для співу від душі.
  components:
  - type: Instrument
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Aah": {52: 0}
      "Ooh": {53: 0}
      "Kweh": {4: 1} # Delta-V change - The very gods despair at the sight of the re implementation of this accursed instrument style - Solaris
  - type: Sprite
    sprite: Objects/Fun/Instruments/microphone.rsi
  - type: Item
    size: Small
    storedSprite:
      state: storage
      sprite: Objects/Fun/Instruments/microphone.rsi


- type: entity
