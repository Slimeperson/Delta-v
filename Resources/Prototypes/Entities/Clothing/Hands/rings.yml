- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRing
  name: золотий перстень
  description: Дорогоцінний перстень.
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRing
  name: срібний перстень
  description: Виглядає трохи менш цінним, ніж золотий.
  components:
  - type: Sprite
    layers:
      - state: ring

- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRingDiamond
  name: золотий діамантовий перстень
  description: Виготовлений із етично видобутих космічних алмазів.
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"
      - state: gem
        color: "#c1ffff"
  - type: StaticPrice
    price: 1500

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRingDiamond
  name: срібне кільце з діамантом
  description: Виготовлений із етично видобутих космічних алмазів.
  components:
  - type: Sprite
    layers:
      - state: ring
      - state: gem
        color: "#c1ffff"
  - type: StaticPrice
    price: 1400

- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRingGem
  name: перстень із золотим коштовним каменем
  description: Блискучий і цінний!
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"
      - state: gem
        map: [ "gemColor" ]
  - type: StaticPrice
    price: 2100
  - type: RandomSprite
    getAllGroups: true
    available:
      - gemColor:
          gem: Rainbow

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRingGem
  name: Стильний інтерсекс шарф у смужку. Ідеальний зимовий аксесуар для тих, хто відчуває себе гостро, а також для тих, хто просто не може впоратися з холодним вітром на шиї.
  description: Блискучий і не такий цінний!
  components:
  - type: Sprite
    layers:
      - state: ring
      - state: gem
        map: [ "gemColor" ]
  - type: StaticPrice
    price: 2000
  - type: RandomSprite
    getAllGroups: true
    available:
      - gemColor:
          gem: Rainbow
