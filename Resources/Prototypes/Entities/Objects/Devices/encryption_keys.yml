    - EncryptionScience

- type: entity
  parent: [ EncryptionKey, BaseScienceContraband ]
  id: EncryptionKeyRobo
  name: ключ шифрування robottech
  description: Ключ шифрування, який використовують інженери robototech. Можливо, на ньому LAH-6000?
  components:
  - type: EncryptionKey
    channels:
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: robotics_label

- type: entity
