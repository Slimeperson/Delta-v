- type: entity
  parent: OrganHumanEyes
  abstract: true
  id: BaseCyberneticEyes
  components:
  - type: Cybernetics
  - type: Edible # DeltaV - can't eat it no more
    requiresSpecialDigestion: true 
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/IPC/organs.rsi
    state: "eyes"

- type: entity
  parent: BaseCyberneticEyes
  id: BasicCyberneticEyes
  name: кібернетичні очі
  description: Пара кібернетичних очей, які покращують ваш зір і захищають вас від пошкоджень очей.
  components:
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection

- type: entity
  parent: BaseCyberneticEyes
  id: SecurityCyberneticEyes
  name: очі кібернетичної безпеки
  description: Пара кібернетичних очей, які покращують ваш зір, оснащені вбудованим SecHUD.
  components:
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  parent: BaseCyberneticEyes
  id: MedicalCyberneticEyes
  name: кібернетичні діагностичні очі
  description: Пара кібернетичних очей, які покращують ваш зір, оснащені вбудованим MedHUD.
  components:
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - BiologicalMetaphysical # DeltaV - Kitsune
    - type: ShowHealthIcons
      damageContainers:
      - Biological
      - BiologicalMetaphysical # DeltaV - Kitsune
