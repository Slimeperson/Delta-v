# Prevents the affected entity from using psionic powers.
- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectPsionicsDisabled
  name: псіоніка вимкнена
  components:
  - type: PsionicsDisabled

# Shields the affected entity from external psionic powers.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectShieldedFromPsionics
  name: Машинна друкована плата для епістемічного техфабу.
  components:
  - type: ShieldedFromPsionics

# Causes the entity to repeat what is said in telepathic chat.
- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectTelepathicRepeater
  name: телепатичний ретранслятор
  components:
  - type: TelepathicRepeater

# Slows down the user when using the precognition ability.
- type: entity
  parent: [ StatusEffectSlowdown, MobStatusEffectDebuff ]
  id: PrecognitionSlowdownStatusEffect
  name: сповільнюється силою передбачення

# Slows down the user when using the mass sleep ability.
- type: entity
  parent: [ StatusEffectSlowdown, MobStatusEffectDebuff ]
  id: MassSleepSlowdownStatusEffect
  name: уповільнена силою масового сну
