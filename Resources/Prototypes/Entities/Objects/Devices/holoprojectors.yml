  components:
  #  - type: HolosignProjector # DeltaV - Holoprojectors dont need batteries
  #    signProto: HolosignForcefield
  #    chargeUse: 120
    - type: Sprite
      sprite: Objects/Devices/Holoprojectors/field.rsi
      state: icon
    - type: Tag
      tags:
        - HolofanProjector
    - type: StaticPrice
      price: 130
    # Begin DeltaV Additions
