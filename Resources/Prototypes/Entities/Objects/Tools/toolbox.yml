- type: entity
  id: ToolboxBase
  parent: BaseStorageItem
  abstract: true
  components:
  - type: Sprite
    layers:
      - map: [ base ]
        state: icon
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,6,3
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: Tag
    tags:
    - Toolbox
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Appearance

- type: entity
  name: аварійний ящик для інструментів
  parent: ToolboxBase
  id: ToolboxEmergency
  description: Яскраво-червоний ящик для інструментів, укомплектований інструментами для надзвичайних ситуацій.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi

- type: entity
  name: механічний ящик для інструментів
  parent: ToolboxBase
  id: ToolboxMechanical
  description: Синя коробка з механічними інструментами.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi

- type: entity
  name: електричний ящик для інструментів
  parent: ToolboxBase
  id: ToolboxElectrical
  description: Ящик для інструментів, зазвичай укомплектований електричним обладнанням.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi

- type: entity
  name: електричний ящик для інструментів
  suffix: Синдикат, Турет
  parent: ToolboxElectrical
  id: ToolboxElectricalTurret
  description: Ящик для інструментів, зазвичай укомплектований електричним обладнанням.
  components:
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              WeaponTurretSyndicateDisposable:
                min: 1
                max: 1
  - type: StaticPrice
    price: 1350
  - type: MappingCategories # DeltaV
    categories:
    - Syndicate

- type: entity
  name: художній інструментарій
  parent: ToolboxBase
  id: ToolboxArtistic
  description: Ящик для інструментів, зазвичай укомплектований мистецьким приладдям.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi

- type: entity
  name: підозрілий інструментарій
  parent: [ToolboxBase, BaseSyndicateContraband]
  id: ToolboxSyndicate
  description: Набір інструментів зловісного вигляду, наповнений інструментами елітного синдикату.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20

- type: entity
  name: золотий ящик для інструментів
  parent: ToolboxBase
  id: ToolboxGolden
  description: Ящик із твердого золота для інструментів. Репер убив би за це.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi

- type: entity
  name: дурниця
  parent: ToolboxBase
  id: Foolbox
  description: Ящик для дурнів, укомплектований обладнанням для клоунади.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2
    soundHit: &SoundRubberHammer
      collection: RubberHammer
      params:
        variation: 0.03
        volume: 3
  - type: EmitSoundOnLand
    sound: *SoundRubberHammer
  - type: Storage
    storageOpenSound: &SoundHorn
      collection: BikeHorn
      params:
        variation: 0.125
    storageCloseSound: *SoundHorn
    storageInsertSound: &SoundSqueak
      collection: FootstepClown
      params:
        variation: 0.125
    storageRemoveSound: *SoundSqueak
