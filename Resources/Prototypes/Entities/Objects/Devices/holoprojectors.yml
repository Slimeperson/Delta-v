- type: entity
  parent: Holoprojector
  id: HoloprojectorClownBorg
  name: командний дверний пульт
  description: Проектор holopeel, який створює слизьку, тверду легку бананову шкірку. Він заряджає, щоб веселощі ніколи не закінчувалися!
  suffix: borg
  components:
  #- type: HolosignProjector # DeltaV - Holoprojectors dont need batteries
  #  signProto: HoloPeel
  #  chargeUse: 240
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/peel.rsi
    state: icon
  #- type: ItemSlots # DeltaV - Holoprojectors dont need batteries
  #  slots:
  #    cell_slot:
  #      name: power-cell-slot-component-slot-name-default
  #      startingItem: PowerCellMicroreactor
  #      disableEject: true
  #      swap: false
  # Begin DeltaV Additions
  - type: ChargeHolosignProjector
    signProto: HoloPeel
    signComponentName: Holopeel
  - type: LimitedCharges
    maxCharges: 3 # same as it was on a medium cell
  - type: AutoRecharge
    rechargeDuration: 30 # Same as the holopeel lifetime
  # End DeltaV Additions

- type: entity
