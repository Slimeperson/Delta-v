# not using base kill/keep alive objectives since these intentionally conflict with eachother
- type: entity
  parent: BaseParadoxCloneObjective
  id: ParadoxAnomalyKillObjective
  description: У цьому всесвіті немає місця для нас обох.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      state: icon
  - type: TargetObjective
    title: object-paradox-anomaly-kill-title
  - type: PickSpecificPerson
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: BaseParadoxCloneObjective
  id: ParadoxAnomalyFriendObjective
  description: Можливо, є місце, як друзі.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/folders.rsi
      state: folder-white
  - type: TargetObjective
    title: uplink-contraband-lighter-desc
  - type: PickSpecificPerson
  - type: KeepAliveCondition
