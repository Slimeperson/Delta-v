    stackRequirements:
      Manipulator: 4
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker

- type: entity
  parent: BaseTechFabCircuitboardDV
  id: EngineeringTechFabCircuitboard
