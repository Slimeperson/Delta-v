- type: entity
  abstract: true
  parent: PartBase
  id: PartCarpBase
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Aliens/Carps/carp_parts.rsi
  - type: Icon
    sprite: _Shitmed/Mobs/Aliens/Carps/carp_parts.rsi

- type: entity
  parent: PartCarpBase
  id: TailCarp
  name: короповий хвіст
  description: Унікальні залози в цьому хвості дозволяють космічному коропу літати у вакуумі.
  components:
  - type: Sprite
    state: tail
  - type: Icon
    state: tail
  - type: BodyPart
    partType: Tail
  - type: MovementBodyPart
    walkSpeed: 2.5
    sprintSpeed: 3.5
  # TODO: Make it actually needed. Legs are hardcoded to be the only parts that matter for movement.
  # TODO: space flight stuff

- type: entity
  parent: [ PartCarpBase, BaseTorso ]
  id: TorsoCarp
  name: тулуб коропа
  components:
  - type: Sprite
    state: torso
  - type: Icon
    state: torso
