- type: entity
  abstract: true
  parent: BaseSurviveObjective
  id: SkeletonBaseObjective
  components:
  - type: Objective
    issuer: objective-issuer-skeleton
    icon:
      sprite: Objects/Consumable/Drinks/milk.rsi
      state: icon
    difficulty: 1 # difficulty is unused
  - type: RoleRequirement
    roles:
      - MenaceSkeletonRole

- type: entity
  parent: SkeletonBaseObjective
  id: SkeletonMilkObjective
  name: Висушіть їх молоком
  description: Тобі потрібне молоко, щоб залишитися живим і поправити свої кістки. Отримайте якомога більше!
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Drinks/milk.rsi
      state: icon

- type: entity
  parent: SkeletonBaseObjective
  id: SkeletonHauntObjective
  name: Rattle and Haunt
  description: Ти моторошний страшний скелет, налякай їх!
  components:
  - type: Objective
    icon:
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: skull_icon
  - type: TargetObjective
    title: object-skeleton-haunt-title
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition

- type: entity
  parent: SkeletonBaseObjective
  id: SkeletonFrameObjective
  name: Рама для поховання
  description: Ви вважаєте, що звузили коло тих, хто міг бути відповідальним за ваше поховання. Підставити їх за злочин.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff
  - type: TargetObjective
    title: object-skeleton-frame-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff

- type: entity
  parent: SkeletonBaseObjective
  id: SkeletonBoneObjective
  name: Лінійка Боневелента
  description: Ви вважаєте, що раніше були беззаперечним володарем цієї станції. Встановіть свою претензію та керуйте станцією під своїм вічним правлінням.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Misc/fancycrown.rsi
      state: icon

- type: entity
  parent: SkeletonBaseObjective
  id: SkeletonDripObjective
  name: Багатство поховання
  description: Ви безсмертна і невмируча істота, і ви повинні виглядати так само. Збирайте тільки найяскравіший одяг.
  components:
  - type: Objective
    icon:
      sprite: Clothing/OuterClothing/Coats/expensive_coat.rsi
      state: icon
