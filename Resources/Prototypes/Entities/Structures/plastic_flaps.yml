- type: entity
  id: PlasticFlapsBase
  parent: BaseStructureDynamic
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Structures/plastic_flaps.rsi
    state: plasticflaps
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - MidImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

- type: entity
  id: PlasticFlapsClear
  parent: PlasticFlapsBase
  name: пластикові клапани
  suffix: ясно
  description: Надміцні пластикові клапани. Безумовно, не можна пройти повз них. Ні в якому разі.
  components:
  - type: Construction
    graph: PlasticFlapsGraph
    node: plasticFlaps

- type: entity
  id: PlasticFlapsOpaque
  parent: PlasticFlapsBase
  name: пластикові клапани
  suffix: Непрозорий
  description: Надміцні пластикові клапани. Безумовно, не можна пройти повз них. Ні в якому разі.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - Opaque
        - MidImpassable
  - type: Occluder
  - type: Construction
    graph: PlasticFlapsGraph
    node: opaqueFlaps

- type: entity
  id: PlasticFlapsAirtightClear
  parent: PlasticFlapsBase
  name: герметичні пластикові клапани
  suffix: Герметичний, прозорий
  description: Надміцні, трохи міцніші, герметичні пластикові клапани. Безумовно, не можна пройти повз них. Ні в якому разі.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Airtight
  - type: StaticPrice
    price: 100

- type: entity
  id: PlasticFlapsAirtightOpaque
  parent: PlasticFlapsBase
  name: герметичні пластикові клапани
  suffix: Герметичний, непрозорий
  description: Надміцні, трохи міцніші, герметичні пластикові клапани. Безумовно, не можна пройти повз них. Ні в якому разі.
  components:
