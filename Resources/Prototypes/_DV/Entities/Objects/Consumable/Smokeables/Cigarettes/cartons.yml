- type: entity
  id: CigCartonPurple
  parent: CigCartonGreen
  name: Де-Юре картон
  description: Картонна коробка з 6 пакетами De Jure.
  components:
  - type: Sprite
    sprite: _DV/Objects/Consumable/Smokeables/Cigarettes/Cartons/purple.rsi
  - type: Item
    sprite: _DV/Objects/Consumable/Smokeables/Cigarettes/Cartons/purple.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigPackPurple
        amount: 6

- type: entity
  id: CigCartonCandy
  parent: CigCartonGreen
  name: Коробка Sugar Rush
  description: Картонна коробка з 6 пакетами Sugar Rush.
  components:
  - type: Sprite
    sprite: _DV/Objects/Consumable/Smokeables/Cigarettes/Cartons/pink.rsi
  - type: Item
