- type: entity
  parent: [ ClothingEyesBase, BaseToggleClothing ] # DeltaV - Added BaseToggleClothing
  id: ClothingEyesHudDiagnostic
  name: діагностичний худ
  description: Наявний дисплей, здатний аналізувати цілісність і стан робототехніки та екзокостюмів. Виготовлений із се-борг-іуму. Має мод камери для роботи з Station AI. # DeltaV - Додати останнє речення
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Hud/diag.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Hud/diag.rsi
  # Begin DeltaV Additions
  - type: ToggleClothing
    action: ActionToggleHudDiagnosticCamera
    disableOnUnequip: true
  - type: ItemToggle
    onActivate: false # remove verb so you can't press E on it to add StationAiOverlay to a grid or something
  - type: ComponentToggler
    parent: true
    components:
    - type: StationAiOverlay
      cosmetic: true # don't give roboticists reach hacks
  # End DeltaV Additions
  - type: Tag
    tags:
    - HudDiagnostic
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
    - HumanoidSilicon # DeltaV - IPCs
  - type: ShowAccessReaderSettings

