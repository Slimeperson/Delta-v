- type: entity
  name: імпровізований меч
  parent: BaseSword
  id: SwordMakeshift
  description: Якась гостра сталь, прикріплена до металевого стрижня, її навряд чи можна назвати мечем.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/makeshift_sword.rsi
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/makeshift_sword.rsi
    slots:
    - suitStorage
  - type: Construction
    graph: SwordMakeshiftGraph
    node: sword

