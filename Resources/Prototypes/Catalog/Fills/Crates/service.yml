- type: entity
  parent: CrateGenericSteel
  id: CrateServiceBureaucracy
  name: бюрократичний ящик
  description: Кілька стосів паперу, кілька ручок і офісна іграшка. Що ще можна побажати?
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        # DeltaV - replace the paper in the bureaucracy crate with a ream
        - id: BoxReamWhite
        #- id: Paper
        #  amount: 12
        #- id: PaperOffice
        #  amount: 6
        - id: Pen
          amount: 2
        - id: BoxFolderClipboardEmpty
          amount: 2
        - id: HandLabeler
        - id: BoxFolderBlueEmpty
          amount: 2 # DeltaV - more folders in the bureacracy crate
        - id: BoxFolderRedEmpty
          amount: 2 # DeltaV - more folders in the bureacracy crate
        - id: BoxFolderYellowEmpty
          amount: 2 # DeltaV - more folders in the bureacracy crate
        # Begin DeltaV: sticky notes
        - id: PaperStickyNoteStackFilled
        - id: PaperStickyNoteStackFilledPink
        - id: PaperStickyNoteStackFilledGreen
        - id: PaperStickyNoteStackFilledBlue
        # End DeltaV: sticky notes
        - id: NewtonCradle
        - id: BoxEnvelope
        - id: BrbSign
        # Begin DeltaV - More folders & colored paper reams in the bureaucracy crate + denied/approved stamp, low chance of paperwork hater stamp
        - id: BoxFolderBlack
          amount: 2
        - id: BoxFolderGrey
          amount: 2
        - id: BoxFolderGreen
          amount: 2
        - id: BoxReamClassic
        - id: BoxReamBright
        - id: RubberStampHatePaperwork
          prob: 0.05
        - id: RubberStampApproved
        - id: RubberStampDenied
        # End DeltaV - More folders & colored paper reams in the bureaucracy crate + denied/approved stamp, low chance of paperwork hater stamp

