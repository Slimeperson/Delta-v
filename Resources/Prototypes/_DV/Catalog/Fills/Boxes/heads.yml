- type: entity
  name: коробка для марок [CJ]
  parent: BoxCardboard
  id: BoxCJStamps
  description: Коробка, наповнена марками CJ. Готовий вершити правосуддя!
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: RubberStampApproved
        - id: RubberStampDenied
        - id: RubberStampChiefJustice
  - type: Storage
    grid:
    - 0,0,1,1
    whitelist:
      components:
      - Stamp
  - type: Sprite
    layers:
      - state: box
      - state: stamp

- type: entity
  name: тоталізатор [CJ]
  parent: ToteBase
  id: BoxCJCircuitboards
  description: Сумка, наповнена друкованими платами CJ.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: IDComputerCircuitboard
        - id: CargoRequestJusticeComputerCircuitboard
