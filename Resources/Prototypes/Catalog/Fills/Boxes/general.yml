- type: entity
  parent: BoxBase
  id: BoxCardboard
  name: картонна коробка
  description: Картонна коробка для зберігання речей.
  components:
  - type: Construction
    graph: BoxCardboard
    node: boxcardboard
    containers:
      - storagebase
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 100
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  parent: BoxBaseSmall
  id: BoxCardboardSmall
  name: маленька картонна коробка
  description: Невелика картонна коробка для зберігання речей.
  components:
  - type: Construction
    graph: BoxCardboardSmall # Half the material cost of the "regular" cardboardbox
    node: boxcardboardsmall
    containers:
      - storagebase
  - type: PhysicalComposition # Half of the "regular" cardboard box
    materialComposition:
      Cardboard: 50
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  name: ящик для мишоловки
  parent: BoxCardboard
  id: BoxMousetrap
  description: Ця коробка наповнена мишоловками. Намагайтеся, щоб ваша рука не застрягла в одному.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Mousetrap
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: mousetraps

- type: entity
  name: коробка лампочки
  parent: BoxCardboard
  id: BoxLightbulb
  description: Ця коробка має внутрішню форму, щоб у неї поміщалися лише світлові трубки та лампочки.
  components:
  - type: Sprite
    layers:
      - state: box
      - state: light
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:
      components:
      - LightBulb
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: LightBulb
        amount: 12

- type: entity
