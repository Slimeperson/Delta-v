  description: Машинна друкована плата для інженерно-технічного заводу.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: EngineeringTechFab
  - type: StealTarget
    stealGroup: EngineeringTechFabCircuitboard

- type: entity
