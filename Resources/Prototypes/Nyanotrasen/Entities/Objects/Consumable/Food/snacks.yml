# Snacks and Entrees

- type: entity
  name: скреготіння розмішувати
  parent: FoodMealBase
  id: FoodMothSqueakingFry
  description: Класичний мотелик, виготовлений із сирної маси та тофу (серед іншого).
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - tofu
      - leafy
  - type: Edible
    trash:
    - FoodPlateSmall
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Snacks/moth.rsi
    state: squeakingstirfry
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 6
        - ReagentId: Protein
          Quantity: 8
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheese, tofu and veggies

- type: entity
  name: підсмажене насіння
  parent: FoodBakingBase
  id: FoodMothToastedSeeds
  description: Незважаючи на те, що вони далеко не ситні, підсмажені насіння є популярною закускою серед молі. Для додаткового бадьорості можна додати деякі екзотичні смаки.
  components:
  - type: FlavorProfile
    flavors:
      - seeds
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Snacks/moth.rsi
    state: toastedseeds
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 6
  - type: Tag
    tags:
      - ClothMade # Mothic Food

- type: entity
  name: двигун кормовий
  parent: FoodBakingBase
  id: FoodMothEngineFodder
  description: Звичайна закуска для інженерів-молі, виготовлена ​​з насіння, горіхів, шоколаду, попкорну та картопляних чіпсів, розроблена так, щоб вона була насиченою калоріями та легкою для перекусу, коли потрібен додатковий заряд.
  components:
  - type: FlavorProfile
    flavors:
      - seeds
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Snacks/moth.rsi
    state: enginefodder
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40 # Very compact food
        reagents:
        - ReagentId: Nutriment
          Quantity: 18
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: TableSalt
          Quantity: 2
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 6
  - type: Tag
    tags:
      - ClothMade # Mothic Food

