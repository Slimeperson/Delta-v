- type: entity
  id: DoorElectronics
  parent: BaseElectronics
  name: дверна електроніка
  description: Плата електроніки, яка використовується в дверях і шлюзах.
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: door_electronics
    - type: Tag
      tags:
        - DoorElectronics
    - type: DoorElectronics
    - type: AccessReader
    - type: ActivatableUI
      key: enum.DoorElectronicsConfigurationUiKey.Key
      requiredItems:
        tags:
        - DoorElectronicsConfigurator
    - type: UserInterface
      interfaces:
        enum.DoorElectronicsConfigurationUiKey.Key:
          type: DoorElectronicsBoundUserInterface
