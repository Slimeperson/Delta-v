# this file is fully reorganized by shitmed
- type: entity
  abstract: true
  parent: BasePartInorganic
  id: PartSkeletonBase
  name: частина тіла скелета
  components:
  - type: Sprite
    sprite: Mobs/Species/Skeleton/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Skeleton/parts.rsi
  - type: Destructible # Shitmed Change: Let blunt weapons break bones
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 110
      behaviors:
      - !type:DoActsBehavior # For some reason, if this is GibPartBehavior and spawned skeleton part gets gibbed (by like the nuke), the server crashes.
        acts: [ "Destruction" ]
  - type: BodyPart
    species: Skeleton # Shitmed Change
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: [ PartSkeletonBase, BaseTorsoInorganic ]
  id: TorsoSkeleton
  name: скелет тулуба

- type: entity
  parent: [ PartSkeletonBase, BaseHead, BaseMob ]
  id: HeadSkeleton
  name: череп
  description: На жаль, бідний Йорик...
  components:
  - type: Sprite
    state: "skull_icon"
    scale: 0.5, 0.5 # DeltaV - Scale down sprite because it looks too big
  - type: Icon
    state: "skull_icon"
  - type: BlockMovement
  - type: Input
    context: "human"
  - type: Speech
    speechVerb: Skeleton
    speechSounds: Alto
  - type: SkeletonAccent
  - type: Actions
  - type: Vocal
    sounds:
      Male: Skeleton
      Female: Skeleton
      Unsexed: Skeleton
  - type: Emoting
  - type: Grammar
    attributes:
      proper: true
  - type: Examiner
  - type: DoAfter
  - type: MobState
    allowedStates:
    - Alive
  - type: Tag
    tags:
    - MindTransferTarget
    - Head

