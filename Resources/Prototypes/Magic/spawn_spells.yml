- type: entity
  parent: BaseAction
  id: ActionSpawnMagicarpSpell
  name: Викликати магікарпа
  description: Це заклинання викликає вам на допомогу трьох волхвів-Каропів! Може або не може вмикати користувача.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: TargetAction
    range: 4
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: MobCarpMagic
        amount: 3
      offset: 0, 1
  - type: SpeakOnAction
    sentence: action-speech-spell-summon-magicarp
