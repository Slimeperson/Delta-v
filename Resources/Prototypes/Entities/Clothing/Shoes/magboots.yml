- type: entity
  parent: [ClothingShoesBase, BaseToggleClothing]
  id: ClothingShoesBootsMagBase
  name: чарівні чоботи
  description: Магнітні черевики, які часто використовуються під час позашляховиків, щоб гарантувати, що користувач залишається безпечно прикріпленим до автомобіля.
  abstract: true
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots.rsi
  - type: ToggleClothing
    action: ActionToggleMagboots
    mustEquip: false
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: ItemTogglePrefix
    prefixOn: on
  - type: ToggleClothingPrefix
    prefixOn: on
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: StaticPrice
    price: 200
  - type: Tag
    tags:
    - WhitelistChameleon
    - Magboots # DeltaV

- type: entity
  parent: [ClothingShoesBootsMagBase]
  id: ClothingShoesBootsMag

- type: entity
  parent: [ClothingShoesBootsMagBase, BaseGrandTheftContraband]
  id: ClothingShoesBootsMagAdv
  name: просунуті чарівники
  description: Сучасні магнітні черевики, які не гальмують свого власника.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-advanced.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots-advanced.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Tag
    tags:
    - WhitelistChameleon
    - HighRiskItem
  - type: StaticPrice
    price: 750
  - type: StealTarget
    stealGroup: ClothingShoesBootsMagAdv

- type: entity
  parent: [ClothingShoesBootsMagBase]
  id: ClothingShoesBootsMagSci
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-science.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots-science.rsi

- type: entity
  parent: ClothingShoesBootsMagBase
  id: ClothingShoesBootsMagBlinding
  name: чарівні чоботи сліпучої швидкості
  description: Вони виглядатимуть привабливо на такому транспортнику, як ви.
  components:
  - type: ClothingSpeedModifier
    walkModifier: 1.1 #PVS isn't too much of an issue when you are blind...
    sprintModifier: 1.1
  - type: StaticPrice
    price: 3000

- type: entity
  parent: [ClothingShoesBootsMagBase, BaseJetpack, BaseSyndicateContraband]
  id: ClothingShoesBootsMagSyndie
  name: криваво-червоні чарівники
  description: Створені на базі магнітних черевиків ERT, вони мають сильну магнітну силу та вбудовані двигуни. Він може вмістити 0,75 л газу.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-syndicate.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots-syndicate.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: GasTank
    outputPressure: 42.6
    air:
      # 2 minutes of thrust
      volume: 0.75
      temperature: 293.15
      moles:
        Oxygen: 0.153853429 # oxygen
        Nitrogen: 0.153853429 # nitrogen
  - type: Item
    sprite: null
    size: Normal
  - type: StaticPrice
    price: 1500

- type: entity
  parent: [BaseCentcommContraband, ClothingShoesBootsMagSyndie]
  id: ClothingShoesBootsMagERT
  name: Магнітні черевики ERT
  description: Модернізовані магнітні чоботи, які використовуються групами реагування на надзвичайні ситуації Nanotrasen, мають потужну магнітну силу та вбудовані двигуни. Він може вмістити 0,75 л газу.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-ert.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots-ert.rsi

- type: entity
  parent: BaseAction
  id: ActionToggleMagboots
  name: Перемкнути Magboots
  description: Вмикає та вимикає чарівники.
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 3 # DeltaV - Add delay to avoid spamming magboots to avoid lube puddles.
  - type: InstantAction
    event: !type:ToggleActionEvent
