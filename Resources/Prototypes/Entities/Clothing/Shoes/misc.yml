- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBootsJump
  name: черевики для стрибків
  description: Високотехнологічні черевики, які дають вам неймовірну здатність стрибати! З цими черевиками ви можете стрибати через лаву, прірви та дивні хімікати на підлозі!
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
  - type: JumpAbility
    jumpDistance: 4
    jumpSound: /Audio/Effects/stealthoff.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
  - type: StaticPrice
    price: 220
  - type: Tag
    tags: []
