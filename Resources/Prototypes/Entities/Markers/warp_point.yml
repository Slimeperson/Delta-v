- type: entity
  id: WarpPoint
  parent: MarkerBase
  name: точка викривлення
  components:
  - type: WarpPoint
  - type: Sprite
    state: pink

- type: entity
  id: WarpPointBeacon
  parent: WarpPoint
  name: точка деформації (маяк)
  components:
  - type: NavMapBeacon
  - type: WarpPoint
    location: beacon

# Use for areas like CC
- type: entity
  id: GhostWarpPoint
  parent: MarkerBase
  name: лише примарна точка деформації
  suffix: Off-Station # Delta V – уточнення для картографів
  components:
  - type: Tag
    tags:
    - GhostOnlyWarp
  - type: WarpPoint
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Sprite
    state: pink
