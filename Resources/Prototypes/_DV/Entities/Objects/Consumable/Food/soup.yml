- type: entity
  name: яєчня
  parent: FoodBowlBase
  id: FoodMealScrambledEggs
  description: Кілька варених яєць з сіллю. смакота!
  components:
  - type: FlavorProfile
    flavors:
    - egg
    - salty
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/scrambledeggs.rsi
    layers:
    - state: bowl
    - state: scrambled-eggs
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 10
  - type: FoodSequenceElement
    entries:
      Burger: ScrambledEggs
      Taco: ScrambledEggs
# Tastes like eggs, butter and salt

- type: foodSequenceElement
  id: ScrambledEggs
  name: food-sequence-content-scrambled- eggs
  sprites:
  - sprite: _DV/Objects/Consumable/Food/scrambledeggs.rsi
    state: scrambled-eggs

