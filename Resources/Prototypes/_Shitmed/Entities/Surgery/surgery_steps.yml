- type: entity
  id: SurgeryStepBase
  abstract: true
  components:
  - type: SurgeryStep
  - type: SurgeryStepDirtiness # DeltaV - surgery cross contamination

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Вирізати скальпелем
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        #Bloodloss: 10 # DeltaV
        Slash: 12 # DeltaV
    sleepModifier: 0.5
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Затисніть кровопускачі
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: BleedersClamped
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: -3 # DeltaV
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Втягніть шкіру
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: SkinRetracted
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: SurgeryDamageChangeEffect # DeltaV
    damage:
      types:
        Slash: 4

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Пиляти кістки
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: RibcageSawed
    duration: 4
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect # DeltaV
    sleepModifier: 0.25 # Highly invasive, large damage if the patient is wriggling around
    damage:
      types:
        Slash: 20

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Розкрийте кістки
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: RibcageOpen
    duration: 4 # DeltaV: was 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: SurgeryDamageChangeEffect # DeltaV
    sleepModifier: 0.25 # Highly invasive, large damage if the patient is wriggling around
    damage:
      types:
        Blunt: 15

