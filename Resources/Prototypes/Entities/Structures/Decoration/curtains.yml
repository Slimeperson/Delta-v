- type: entity
  id: BaseCurtains
  parent: BaseStructure
  name: штори
  description: Приховує те, що інші не повинні бачити.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: SpriteFade # DeltaV - Makes it so person behind curtain can see behind it
  - type: Occluder
  - type: AnimationPlayer
  - type: InteractionOutline # DeltaV - Makes it clear what you're interacting with
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - HighImpassable # Delta V - Fix curtain colliding with other structures
        layer:
        - Opaque
  - type: Door
    canCrush: false
    performCollisionCheck: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0.5
    closeTimeTwo: 0.1
    openTimeOne: 0.5
    openTimeTwo: 0.1
    openSound:
      path: /Audio/Effects/curtain_openclose.ogg
    closeSound:
      path: /Audio/Effects/curtain_openclose.ogg
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 1
  - type: WallMount
    arc: 360

- type: entity
  id: HospitalCurtains
  parent: BaseCurtains
  suffix: Лікарня
  description: Містить менше 1% ртуті.
  components:
  - type: Sprite # DeltaV - Removed cardinal snapping
    sprite: _DV/Structures/Decoration/Curtains/hospital.rsi # DeltaV - Changed sprite path
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Construction
    graph: Curtains
    node: Curtains

- type: entity
  id: HospitalCurtainsOpen
  parent: HospitalCurtains
  suffix: Відкрито, лікарня
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Construction
    graph: Curtains
    node: CurtainsOpen
  - type: Physics
    canCollide: false

