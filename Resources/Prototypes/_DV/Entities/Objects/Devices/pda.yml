  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - CrimeAssistCartridge
    - SecWatchCartridge
    - NanoChatCartridge
    - MedTekCartridge
