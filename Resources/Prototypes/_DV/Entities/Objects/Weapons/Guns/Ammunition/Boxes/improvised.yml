- type: entity
  parent: BaseItem
  id: BaseMagazineBoxImprovised
  name: improvised ammunition box
  description: Це підозріло схоже на коробку від магазину .20 із грубим малюнком кулі нагорі. Змішувати боєприпаси не рекомендується.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
        - CartridgePistolImprovised
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - CartridgeLightRifle
        - CartridgeLightRifleImprovised
        - ShellShotgun
        - ShellShotgunImprovised
    proto: null
    capacity: 40
  - type: Item
    size: Small
    storedRotation: -45
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/improvised.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Construction
    graph: ImprovisedMagazineBoxGraph
    node: shell
  - type: Tag
    tags:
    - ImprovisedAmmoBox

- type: entity
  parent: BaseMagazineBoxImprovised
  id: MagazineBoxImprovisedPistol
  name: імпровізований ящик для патронів (.35 auto improvised)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolImprovised
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - type: Construction
      graph: ImprovisedMagazineBoxGraph
      node: pistol

