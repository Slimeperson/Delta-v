- type: entity
  id: ToggleNightVision
  name: Увімкнути нічне бачення
  description: Вмикає нічне бачення.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  id: ToggleThermalVision
  name: Увімкнути тепловізор
  description: Перемикає тепловізор.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 1
    icon:
      sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent

- type: entity
  id: PulseThermalVision
  parent: ToggleThermalVision
  name: Імпульсне тепловізор
  description: Тимчасово ввімкніть тепловізор.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 4
  - type: InstantAction
