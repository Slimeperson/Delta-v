- type: entity
  parent: DoorRemoteDefault
  id: DoorRemoteJustice
  name: правосуддя дверний пульт
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#6b2833"
    - state: door_remotescreencolour
      color: "#6b2833"
  - type: Access
    groups:
    - Justice

- type: entity
  parent: [DoorRemoteDefault, BaseEngineeringContraband]
  id: DoorRemoteFirefight
  name: пульт протипожежних дверей
  description: Гаджет, який може дистанційно відкривати та закривати FireDoors.
  components:
    - type: Sprite
      layers:
        - state: door_remotebase
        - state: door_remotelightscolour
          color: "#ff9900"
        - state: door_remotescreencolour
          color: "#e02020"
    - type: Access
      groups:
      - FireFight

- type: entity
  parent: [DoorRemoteDefault, BaseCentcommContraband]
  id: DoorRemoteOmni
  name: універсальний дверний пульт
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#2eba22"
    - state: door_remotescreencolour
      color: "#22871a"
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
