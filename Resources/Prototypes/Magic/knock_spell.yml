- type: entity
  parent: BaseAction
  id: ActionKnock
  name: Стук
  description: Це заклинання відкриває сусідні двері.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/knock.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: knock
  - type: InstantAction
    event: !type:KnockSpellEvent
  - type: SpeakOnAction
    sentence: action-speech-spell-knock
