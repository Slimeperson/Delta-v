- type: entity
  parent: CrateSecgear
  id: CrateEmergencyExplosive
  name: ящик бомбового костюма
  description: Наука збожеволіла? Сигнали за шлюзом? Придбайте зараз і станьте героєм станції де... Я маю на увазі потреби! (час не включено)
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBombSuit
        - id: ClothingMaskGas
        - id: Screwdriver
        - id: Wirecutter
        - id: Multitool
        - id: ClothingOuterSuitBomb

- type: entity
  parent: CrateGenericSteel
  id: CrateEmergencyFire
  name: протипожежний ящик
  description: Тільки ви можете запобігти пожежі на станції. Об’єднайтеся з двома костюмами пожежників, протигазами, ліхтариками, великими кисневими баллонами, вогнегасниками та касками!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FlashlightLantern
          amount: 2
        - id: FireExtinguisher
          amount: 2
        - id: ClothingHeadHatHardhatRed
          amount: 2
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingOuterSuitFire
          amount: 2
        - id: OxygenTankFilled
          amount: 2

- type: entity
  parent: CrateInternals
  id: CrateEmergencyInternals
  name: внутрішній ящик
  description: Опануйте своєю життєвою енергією та контролюйте своє дихання за допомогою трьох дихальних масок, трьох протигазів, трьох екстрених костюмів EVA, трьох кисневих балонів і трьох балонів з азотом.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 3
        - id: ClothingMaskBreath
          amount: 3
        - id: OxygenTankFilled
          amount: 3
        - id: NitrogenTankFilled
          amount: 3
        - id: ClothingOuterSuitEmergency
          amount: 3

- type: entity
  parent: CrateInternals
  id: CrateEmergencyInternalsLarge
  name: внутрішній ящик (великий)
  description: Керуйте своєю життєвою енергією та контролюйте своє дихання за допомогою шести дихальних масок, шести протигазів, шести екстрених костюмів EVA, шести кисневих балонів і шести балонів з азотом.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 6
        - id: ClothingMaskBreath
          amount: 6
        - id: OxygenTankFilled
          amount: 6
        - id: NitrogenTankFilled
          amount: 6
        - id: ClothingOuterSuitEmergency
          amount: 6

- type: entity
  parent: CrateInternals
  id: CrateNitrogenInternals
  name: внутрішній ящик (азот)
  description: Містить дві дихальні маски, дві протигази та чотири балони з азотом. Призначений для видів, що дихають азотом.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingMaskBreath
          amount: 2
        - id: NitrogenTankFilled
          amount: 4

- type: entity
  parent: CrateRadiation
  id: CrateEmergencyRadiation
  name: ящик радіаційного захисту
  description: Переживіть ядерний апокаліпсис і двигун суперматерії з двома комплектами радіаційних костюмів. Кожен набір містить шолом, костюм і лічильник Гейгера. Навіть пляшку горілки підкинемо і чарки теж, враховуючи тривалість життя людей, які це замовляють.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterSuitRad
          amount: 2
        - id: GeigerCounter
          amount: 2
        - id: DrinkVodkaBottleFull
        - id: DrinkShotGlass
          amount: 2
        - id: RadiationBlockingProjector # Far Horizons

- type: entity
  parent: CratePlastic
  id: CrateEmergencyInflatablewall
  name: надувний настінний ящик
  description: Три купи надувних стін, коли металеві стіни станцій більше не хочуть утримувати атмосферу.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxInflatable

- type: entity
  parent: CratePlastic
  id: CrateGenericBiosuit
  name: аварійний біокостюм ящик
  description: Містить 2 костюми біологічної небезпеки, щоб жодна хвороба не відволікала вас від того, що ви там робите.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearGeneric
          rolls: 2
        - id: ClothingMaskGas
          amount: 2
