- type: entity
  name: Імпровізований револьвер
  parent: [BaseWeaponRevolver, BaseMinorContraband]
  id: WeaponRevolverMakeshift
  description: Трохи більше, ніж ручна гармата з високим шансом вибухнути вам прямо в обличчя.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/makeshift_revolver.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/makeshift_revolver.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - SpeedLoaderMagnum
        - SpeedLoaderMagnumImprovised
    proto: null
    capacity: 1
    chambers: [ null]
    ammoSlots: [ null]
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.30
    selfDamage:
      types:
        Blunt: 8
        Heat: 8
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: RifleStock
        launchAngle: 180
        prob: 0.80

- type: entity
