- type: entity
  parent: BaseAugment
  id: AugmentBaseArm
  name: базове нарощування рук
  abstract: true
  components:
  - type: Organ
    slotId: armImplant
  - type: AugmentArm

- type: entity
  parent: [ActionOpenAugmentInterface, BaseAction]
  id: ActionOpenToolsPanel
  name: Відкрити панель інструментів
  description: Отримайте доступ до імплантованих у вас інструментів
  components:
  - type: Action
    icon: { sprite: Clothing/Belt/utility.rsi, state: icon }

- type: entity
  parent: AugmentBaseArm
  id: AugmentBaseToolPanel
  name: розширення базової панелі інструментів
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/arm.rsi
    state: base
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,9,1
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: AugmentToolPanel
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.AugmentToolPanelUiKey.Key:
        type: AugmentToolPanelMenuBoundUserInterface
        interactionRange: 0
  - type: AugmentActivatableUI
    key: enum.AugmentToolPanelUiKey.Key
    openAction: ActionOpenToolsPanel
  - type: AugmentAction
  - type: Construction
    graph: CreateToolsPanel

- type: entity
  parent: BaseElectronics
  id: AugmentBaseElectronics
  abstract: true
  components:
  - type: PhysicalComposition
    materialComposition:
      Glass: 100
      Steel: 100
    chemicalComposition:
      Silicon: 20
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: mainboard

- type: entity
  parent: AugmentBaseElectronics
  id: AugmentUtilityPanelElectronics
  name: комунальні інструменти панель електроніки
  description: Електронна плата, яка програмує панель інструментів для зберігання певного типу предмета. У цьому зберігаються службові інструменти.
  components:
  - type: Item
    storedRotation: 0
  - type: Tag
    tags: [ AugmentToolBelt ]

- type: entity
  parent: AugmentBaseElectronics
  id: AugmentBotanyPanelElectronics
  name: ботаніка інструменти панель електроніка
  description: Електронна плата, яка програмує панель інструментів для зберігання певного типу предмета. У цьому зберігаються ботанічні інструменти.
  components:
  - type: Item
    storedRotation: 0
  - type: Tag
    tags: [ AugmentBotanyToolBelt ]

- type: entity
  parent: AugmentBaseElectronics
  id: AugmentSurgeryPanelElectronics
  name: хірургічні інструменти панелі електроніки
  description: Електронна плата, яка програмує панель інструментів для зберігання певного типу предмета. Цей тримає хірургічні інструменти.
  components:
  - type: Item
    storedRotation: 0
  - type: Tag
    tags: [ AugmentSurgeryToolBelt ]

- type: entity
  parent: AugmentBaseElectronics
  id: AugmentPaperworkPanelElectronics
  name: документообіг інструменти панель електроніка
  description: Електронна плата, яка програмує панель інструментів для зберігання певного типу предмета. У цьому є інструменти для роботи з документами.
  components:
  - type: Item
    storedRotation: 0
  - type: Tag
    tags: [ AugmentPaperworkToolBelt ]

- type: entity
  parent: BaseItem
  id: BaseIncompleteAugmentToolPanel
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/arm.rsi
  - type: Item
    size: Large
  - type: Construction
    graph: CreateToolsPanel

- type: entity
  parent: BaseIncompleteAugmentToolPanel
  id: AugmentToolPanelCasing
  name: панель інструментів збільшення корпусу
  description: Можна імплантувати в тіло, щоб забезпечити доступ до певних інструментів. Цей неповний.
  components:
  - type: Sprite
    state: base
  - type: Construction
    node: casing
  - type: Tag
    tags: [ AugmentToolPanelCasing ]

- type: entity
  parent: BaseIncompleteAugmentToolPanel
  id: AugmentToolPanelCasingCables
  name: додатковий корпус панелі інструментів із кабелями
  description: Можна імплантувати в тіло, щоб забезпечити доступ до певних інструментів. Цей неповний.
  components:
  - type: Sprite
    state: base_cables
  - type: Construction
    node: cables

- type: entity
  parent: AugmentBaseToolPanel
  id: AugmentToolsPanel
  name: розширення панелі інструментів
  description: Панель, яку можна збільшити на руці пацієнта, щоб забезпечити їм доступ до її вмісту. Тут можна зберігати інструменти.
  components:
  - type: Sprite
    state: engineering
  - type: Storage
    whitelist:
      tags:
      - Wirecutter
      - Crowbar
      - Screwdriver
      - Wrench
      - GeigerCounter
      - Powerdrill
      - JawsOfLife
      - HolofanProjector
      - Multitool
      - AppraisalTool
      components:
      - StationMap
      - SprayPainter
      - NetworkConfigurator
      - RCD
      - RCDAmmo
      - Welder
      - PowerCell
      - Geiger
      - TrayScanner
      - GasAnalyzer
  - type: Construction
    node: "utility tools panel"

- type: entity
  parent: AugmentBaseToolPanel
  id: AugmentBotanyPanel
  name: розширення панелі ботанічних інструментів
  description: Панель, яку можна збільшити на руці пацієнта, щоб забезпечити їм доступ до її вмісту. Тут можна зберігати ботанічні інструменти.
  components:
  - type: Sprite
    state: botany
  - type: Storage
    whitelist:
      tags:
      - PlantSampleTaker
      - BotanyShovel
      - BotanyHoe
      - BotanyHatchet
      - Dropper
      components:
      - HandLabeler
  - type: Construction
    node: "botany tools panel"

- type: entity
  parent: AugmentBaseToolPanel
  id: AugmentPaperworkPanel
  name: розширення панелі інструментів документообігу
  description: Панель, яку можна збільшити на руці пацієнта, щоб забезпечити їм доступ до її вмісту. Тут можна зберігати інструменти для паперів.
  components:
  - type: Sprite
    state: paperwork
  - type: Storage
    whitelist:
      tags:
      - Folder
      - HandLabeler
      components:
      - Stamp
      - TapeRecorder
  - type: Construction
    node: "paperwork tools panel"

- type: entity
  parent: AugmentBaseToolPanel
  id: AugmentSurgicalPanel
  name: збільшення панелі хірургічних інструментів
  description: Панель, яку можна збільшити на руці пацієнта, щоб забезпечити їм доступ до її вмісту. Тут можна зберігати хірургічні інструменти.
  components:
  - type: Sprite
    state: surgical
  - type: Storage
    whitelist:
      requireAll: true
      tags:
      - SurgeryTool
      components:
      - SurgeryTool
  - type: Construction
    node: "surgery tools panel"
