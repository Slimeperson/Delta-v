- type: entity
  parent: BaseSubdermalImplant
  id: BluespaceLifelineImplant
  name: імплантат Bluespace Lifeline
  description: Цей імплантат телепортує тіло користувача в безпечне місце, змушуючи його покинути поточне місцезнаходження, щоб він не міг повернутися.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateBluespaceLifeline
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: DeleteParentOnTrigger
  - type: SpawnOnTrigger
    proto: BluespaceLifeline
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu
