- type: entity
  name: кольорова світлова коробка
  parent: BoxCardboard
  id: BoxColoredLighttube
  description: Ця коробка має внутрішню форму, щоб у неї поміщалися лише світлові трубки та лампочки.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ColoredLightTubeRed
          amount: 4
        - id: ColoredLightTubeFrostyBlue
          amount: 4
        - id: ColoredLightTubeBlackLight
          amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: lighttube
  - type: Storage
    maxItemSize: Small
    grid:
      - 0,0,4,4
    whitelist:
      components:
      - LightBulb

- type: entity
  name: технічне обслуговування лампочок
  parent: BoxCardboard
  id: BoxMaintenanceLightbulb
  description: Ця коробка має внутрішню форму, щоб у неї поміщалися лише світлові трубки та лампочки.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LightBulbMaintenance
          amount: 6
        - id: DimLightBulb
          amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: light
  - type: Storage
    maxItemSize: Small
    grid:
      - 0,0,4,4
    whitelist:
      components:
      - LightBulb

- type: entity
  name: набір для святої води
  parent: BoxCardboard
  id: BoxHolyWater
  description: Ця коробка наповнена всім необхідним для приготування домашньої святої води. Вода не включена.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: DrinkWineCan
          amount: 2
        - id: SprayBottle
        - id: ChemistryBottleMercury
          amount: 2
  - type: Sprite
    layers:
      - state: box_science
      - sprite: Nyanotrasen/Objects/Storage/boxes.rsi
        state: holywater
