- type: entity
  name: Шівон
  parent: MobArcticFox
  id: MobArcticFoxSiobhan
  description: Її ім'я вимовляється як "Шіван", але її друзі знають її як Шівс. Пухнастий чарівний песець.
  components:
  - type: InteractionPopup
    successChance: 1
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot

- type: entity
  name: Лайка
  parent: MobSecDog
  id: MobSecDogLaika
  description: Подібно до своєї тезки, Лайка є особиною невизначеної породи, щойно з вулиць і готова до боротьби.
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: "Лайка"
    description: "Собака-резидент служби безпеки. Зловживайте офіцерів за погладжування голови та чіпайте п’яти жорстоких злочинців».
    job: RoleLaika # determines the playtime requirement
  - type: GhostTakeoverAvailable
  - type: InteractionPopup
    successChance: 1
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: Loadout
    prototypes: [ MobSecDogLaikaGear ]
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
    - DoorBumpOpener
    - K9
  - type: StealTarget
    stealGroup: AnimalSecurity # DeltaV - Adjusts because we have multiple possible sec animals
  - type: TemperatureDamage
    heatDamageThreshold: 315 # 10 lower than base
    coldDamageThreshold: 240 # 20 lower than base

- type: entity
  parent: MobCarp
  id: MobCarpLegal
  name: Carpy the Legal Carp
  description: Має вищу освіту в галузі рибного права.
  components:
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: Sprite
    sprite: _DV/Mobs/Pets/lawyercarp.rsi # Fancy Fishe
    layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
      - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
        state: mouth
        shader: unshaded
      - map: [ "enum.DamageStateVisualLayers.BaseUnshadedAccessory" ]
        state: suit
  - type: TypingIndicator
    proto: lawyer # incase of cognizine
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: mouth
        BaseUnshadedAccessory: suit
      Dead:
        Base: dead
        BaseUnshaded: dead_mouth
        BaseUnshadedAccessory: suit_dead
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: "Карпі, юридичний короп"
    description: "Справжні мізки за Міністерством юстиції. Ваша честь, мій клієнт не підозрює!»
    job: RoleCarpy
  - type: GhostTakeoverAvailable
  -  type: Body
     prototype: Human
  - type: Hands
  - type: InnateTool
    tools:
      - id: LuxuryPenCarpy
      - id: RubberStampCarpy
  - type: UserInterface
    interfaces:
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface

- type: entity
  name: правовий короп штамп
  parent: RubberStampBase
  id: RubberStampCarpy
  description: Штамп, спеціально розроблений для легальних коропів, щоб позначати документи, які не є рибними.
  components:
    - type: Stamp
      stampedName: stamp-component-stamped-name-carpy
      stampedColor: "#a81f3d"
      stampState: "paper_stamp-notary"
    - type: Sprite
      sprite: _DV/Objects/Misc/stamps.rsi
      state: stamp-notary

- type: entity
  name: юридичний короппер
  parent: LuxuryPen
  id: LuxuryPenCarpy
  description: Перо сильніше за меч. Це перо також гостріше завдяки наконечнику з короповими зубами!
  components:
  - type: MeleeWeapon
    angle: 0
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 5
        Slash: 10
    animation: WeaponArcBite


- type: entity
  name: Сільвія
  id: MobCobraSilvia
  parent: MobSpaceBasic
  description: З гострими, як голки, іклами та привабливим поглядом ти дозволиш їй вкусити себе?
  components:
    - type: HTN
      rootTask:
        task: IdleCompound
    - type: Sprite
      drawdepth: Mobs
      sprite: _DV/Mobs/Pets/silvia.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: silvia
        - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
          state: glow
          shader: unshaded
    - type: Loadout
      prototypes: [ MobSilviaGear ]
    - type: Inventory
      speciesId: silvia
      templateId: silvia
    - type: InventorySlots
    - type: Strippable
    - type: UserInterface
      interfaces:
        enum.StrippingUiKey.Key:
          type: StrippableBoundUserInterface
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepSnake
    - type: NoSlip
    - type: MobThresholds
      thresholds:
        0: Alive
        125: Dead
    - type: DamageStateVisuals
      states:
        Alive:
          Base: silvia
          BaseUnshaded: glow
        Dead:
          Base: dead_silvia
    - type: Butcherable
      spawned:
        - id: FoodMeatSnakeSilvia
          maxAmount: 3
        - id: ClothingShoesSnakeskinBoots #different version? wysi
          amount: 1
          prob: 0.2
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
        - ReagentId: Cryoxadone
          Quantity: 200
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.40
          density: 120
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: MeleeWeapon
      attackRate: 1.75 #faster attack rate to compensate for healing in self defense situations
      hidden: true
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        types:
          Piercing: 6 #take dmg to heal dmg
    - type: SolutionContainerManager
      solutions:
        melee:
          maxVol: 30
          reagents:
          - ReagentId: Omnizine
            Quantity: 30 #5 bites to heal 90hp/1 min
    - type: MeleeChemicalInjector
      solution: melee
      transferAmount: 6 #heals 24 burn/brute/air/toxin in 12seconds/minus 6 brute per bite
    - type: SolutionRegeneration
      solution: melee
      duration: 15 #regen 1u every 15 seconds. 7.5 mins to full
      generated:
        reagents:
        - ReagentId: Omnizine
          Quantity: 1
    - type: ReplacementAccent
      accent: xeno #Add cool snake accent later. wyci
    - type: PointLight
      radius: 1.1
      energy: 0.25
      color: "#00ff80"
    - type: Stealth
      enabledOnDeath: false
      maxVisibility: 1.2
    - type: StealthOnMove
      passiveVisibilityRate: -0.15
      movementVisibilityRate: 0.30
    - type: GhostRole
      makeSentient: true
      allowSpeech: true
      allowMovement: true
      name: ghost-role-information-silvia-name
      description: ghost-role-information-silvia-description
      rules: ghost-role-information-silvia-rules
      job: RoleSilvia # determines the playtime requirement
    - type: GhostTakeoverAvailable
    - type: InteractionPopup
      successChance: 0.65
      interactSuccessString: petting-success-snake
      interactFailureString: petting-failure-generic
      interactSuccessSpawn: EffectHearts
      interactSuccessSound:
        path: /Audio/Animals/snake_hiss.ogg
    - type: NpcFactionMember
      factions:
        - PetsNT
    - type: Grammar
      attributes:
        proper: true
        gender: female
    - type: Tag
      tags:
      - CannotSuicide
      - VimPilot
      - DoorBumpOpener
      - FootstepSound
    - type: StealTarget
      stealGroup: AnimalSilvia

