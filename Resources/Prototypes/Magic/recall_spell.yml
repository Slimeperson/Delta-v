- type: entity
  parent: BaseAction
  id: ActionItemRecall
  name: газова турбіна плоский пакет
  description: Позначте утримуваний предмет, щоб пізніше викликати його в руку.
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
      params:
        volume: -5
        pitch: 1.2
        maxDistance: 5
        variation: 0.2
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: item_recall
  - type: InstantAction
    event: !type:OnItemRecallActionEvent
  - type: ItemRecall
    markedEntityBlacklist: # DeltaV
      tags:
        - HighRiskItem
        - Backpack
