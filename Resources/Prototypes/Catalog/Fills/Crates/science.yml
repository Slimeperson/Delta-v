- type: entity
  parent: CrateScienceSecure
  id: CrateScienceBiosuit
  name: ящик для біокостюму вченого
  description: Містить 2 костюми біологічної небезпеки, щоб жодна хвороба не відволікала вас від занять наукою. Щоб відкрити, потрібен доступ Science.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearScience
          rolls: 2
        - id: ClothingMaskSterile
          amount: 2

- type: entity
  parent: CrateScienceSecure
  id: CrateCrewMonitoring
  name: ящик для моніторингу екіпажу
  description: Містить пакет із сервером моніторингу екіпажу та кількома комп’ютерами моніторингу екіпажу. Щоб відкрити, потрібен доступ Science.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CrewMonitoringServerFlatpack
        - id: CrewMonitoringComputerFlatpack
          amount: 3

- type: entity
  parent: CrateScienceSecure
  id: CrateStationAiCore
  name: Ядро станції AI
  description: Містить компоненти для створення ядра ШІ станції. Позитронний мозок не включений. Щоб відкрити, потрібен доступ Science.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: StationAiCoreElectronics
        - id: Intellicard
        - id: SheetPlasteel1
          amount: 4
        - id: CableApcStack1
        - id: SheetRGlass1
          amount: 2
