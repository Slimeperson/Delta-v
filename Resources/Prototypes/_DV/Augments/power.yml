- type: entity
  parent: BaseAction
  id: ActionOpenAugmentInterface
  abstract: true
  # name: Open augment UI
  # description: This is a developer placeholder and should not be seen
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gas.rsi, state: icon }
    iconOn: Interface/Default/blocked.png
  - type: InstantAction
    event: !type:AugmentUIOpenEvent

- type: entity
  parent: BaseItem
  id: AugmentPowerCellSlotCasing
  name: збільшити комірку живлення
  description: Може бути імплантований в тіло для живлення інших імплантатів. Цей неповний.
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: incomplete_cell
  - type: Construction
    graph: CreatePowerCellAugment
    node: casing
    defaultTarget: augment
  - type: Tag
    tags: [ AugmentCellCasing ]

- type: entity
  parent: BaseItem
  id: AugmentPowerCellSlotCasingCables
  name: доповніть корпус слота живлення за допомогою кабелів
  description: Може бути імплантований в тіло для живлення інших імплантатів. Цей неповний.
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: incomplete_cell_cables
  - type: Construction
    graph: CreatePowerCellAugment
    node: cables

- type: entity
  parent: BaseAugment
  id: AugmentPowerCellSlot
  name: додатковий слот живлення
  description: Може бути імплантований в тіло для живлення інших імплантатів.
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: cell
  - type: Organ
    slotId: powerCell
    onAdd:
    - type: HasAugmentPowerCellSlot
  - type: AugmentPowerCellSlot
  - type: Construction
    graph: CreatePowerCellAugment
    node: augment
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: BaseAugment
  id: AugmentBaseCharger
  name: доповнення базового зарядного пристрою
  abstract: true
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: cell
  - type: Organ
    slotId: charger
  - type: AugmentCharger

- type: entity
  parent: BaseItem
  id: AugmentRechargerCasing
  name: збільшити корпус зарядного пристрою
  description: Можна імплантувати в тіло, щоб зарядити внутрішній елемент живлення. Цей неповний.
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: incomplete_charger
  - type: Construction
    graph: CreatePowerCellChargerAugment
    node: casing
  - type: Tag
    tags: [ AugmentChargerCasing ]

- type: entity
  parent: BaseItem
  id: AugmentRechargerCasingCables
  name: доповніть корпус зарядного пристрою кабелями
  description: Можна імплантувати в тіло, щоб зарядити внутрішній елемент живлення. Цей неповний.
  components:
  - type: Sprite
    sprite: _DV/Objects/Augments/power.rsi
    state: incomplete_charger_cables
  - type: Construction
    graph: CreatePowerCellChargerAugment
    node: cables

- type: entity
  parent: AugmentBaseCharger
  id: AugmentRechargerAPC
  name: augment apc recharger
  description: Дозволяє імплантату заряджати свій елемент живлення через БТР.
  components:
  - type: Sprite
    state: apc
  - type: Organ
    onAdd:
    - type: BatteryDrinker
  - type: Construction
    graph: CreatePowerCellChargerAugment
    node: apc

- type: entity
  parent: AugmentBaseCharger
  id: AugmentRechargerStation
  name: зарядний пристрій доповнювальної станції
  description: панель інструментів збільшення корпусу
  components:
  - type: Sprite
    state: station
  - type: Organ
    onAdd:
    - type: AugmentStationRecharge
  - type: Construction
    graph: CreatePowerCellChargerAugment
    node: station
