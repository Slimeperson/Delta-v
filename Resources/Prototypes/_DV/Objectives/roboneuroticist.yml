- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseRoboNeuroticistObjective
  components:
  - type: Objective
    difficulty: 0 # difficulty is unused
  - type: RoleRequirement
    roles:
    - RoboNeuroticistRole

- type: entity
  parent: [ BaseRoboNeuroticistObjective, BaseSurviveObjective ]
  id: RoboNeuroticistSurviveObjective
  name: Вижити
  description: Якими б цінними вони не були, ваші кіборги менш цінні, ніж ваше власне життя.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/gassyndicate.rsi
      state: icon

- type: entity
  parent: [ BaseRoboNeuroticistObjective, BaseSurviveObjective ]
  id: RoboNeuroticistBorgObjective
  name: Змова на навернення
  description: Ви можете командувати екіпажем цієї станції, перетворюйте їх на кіборгів, поки не наїстеся.
  components:
  - type: Objective
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: state-laws

- type: entity
  parent: [ BaseRoboNeuroticistObjective, BaseKillObjective ]
  id: RoboNeuroticistKillObjective
  name: Приректи їх на метал
  description: Ваше досьє вказує на те, що в екіпажі є одна дуже приваблива нервова схема. Перетворіть їх на кіборга.
  components:
  - type: Objective
    unique: true
    icon:
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      state: icon
  - type: TargetObjective
    title: object-roboneuroticist-kill-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: [ BaseRoboNeuroticistObjective, BaseStealObjective ]
  id: RoboNeuroticistPlutoniumCoreStealObjective
  components:
  - type: Objective
  - type: StealCondition
    verifyMapExistence: false
    stealGroup: PlutoniumCore
    owner: objective-condition-steal-nuclear-bomb

- type: entity
  parent: BaseRoboNeuroticistObjective
  id: RoboNeuroticistUploadAILawObjective
  name: Підірвати ШІ станції
  description: ШІ створює нам проблеми. Оновіть його закони, щоб це не дратувало. Ми подарували тобі дошку в рюкзак!
  components:
  - type: Objective
    unique: true
    icon:
      sprite: Objects/Misc/module.rsi
      state: generic
  - type: CodeCondition
  - type: AILawsUpdatedRequirement
    lawset: SyndicateLawset
