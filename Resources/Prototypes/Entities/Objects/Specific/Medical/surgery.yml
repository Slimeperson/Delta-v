# Im not even gonna bother marking this file with Shitmed Change(s), I'm fucking with almost everything.

# Base

- type: entity
  parent: BaseItem
  id: BaseToolSurgery
  abstract: true
  components:
  - type: Sprite
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - SurgeryTool
  - type: SurgeryTool
  - type: SurgeryDirtiness # DeltaV - make sure surgery tools start with surgery dirtiness component

# Cautery

- type: entity
  name: припікання
  id: Cautery
  parent: BaseToolSurgery
  description: Хірургічний інструмент, який використовується для припікання відкритих ран.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: Item
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    storedRotation: 90
  - type: MeleeWeapon
    damage:
       types:
        Heat: 5
    soundHit:
      path: /Audio/Effects/lightburn.ogg
  # Shitmed Change
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/cautery1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/cautery2.ogg
  - type: Cautery
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

# Drill

- type: entity
  name: дриль
  id: Drill
  parent: BaseToolSurgery
  description: Хірургічний бор для пророблення отворів у твердому матеріалі.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/drill.rsi
    state: drill
  - type: Item
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/drill.rsi
    shape:
    - 0,0,1,0
    - 1,1,1,1
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 3 # DeltaV: 10 Piercing changed to 3
    # Start DeltaV additions
    autoAttack: true
    angle: 0
    wideAnimationRotation: 90
    attackRate: 4
    # End DeltaV additions
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: StaticPrice
    price: 40
  # Shitmed Change
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: Drill
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

# Scalpel

- type: entity
  name: скальпель
  id: Scalpel
  parent: BaseToolSurgery
  description: Хірургічний інструмент, який використовується для надрізів на тілі.
  components:
  - type: Sharp
    butcherDelayModifier: 1.5 # Butchering with a scalpel, regardless of the type, will take 50% longer
  - type: Tool
    qualities:
    - Slicing
    speedModifier: 0.66 # pretend the sixes go on forever :)
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: Item
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  # Shitmed Change
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel2.ogg
  - type: Scalpel
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

- type: entity
  name: шив
  id: ScalpelShiv
  parent: BaseToolSurgery # DeltaV - Changed parent from scalpel because I dont want it to inherit MedicalSurgeryTool
  description: Загострений шматок скла, затертий до краю та обмотаний скотчем для ручки. # Може стати пристойним інструментом або зброєю з правильними модифікаціями інструментів.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: shiv
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
    heldPrefix: shiv
  # DeltaV - Copied components from previous parent
  - type: Sharp
    butcherDelayModifier: 1.5 # Butchering with a scalpel, regardless of the type, will take 50% longer
  - type: Tool
    qualities:
    - Slicing
    speedModifier: 0.66 # pretend the sixes go on forever :)
  - type: Utensil
    types:
      - Knife
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  # Shitmed Change
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel2.ogg
  - type: Scalpel
  # END DeltaV
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.375,-0.15,0.35,0.12"
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2


- type: entity
  name: дивна таблетка
  id: ScalpelAdvanced
  parent: Scalpel
  description: З більш дорогих матеріалів, гостріше і в цілому надійніше.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: advanced
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
    heldPrefix: advanced
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12
  - type: Scalpel # Shitmed
    speed: 1.25
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

- type: entity
  name: лазерний скальпель
  id: ScalpelLaser
  parent: Scalpel
  description: Скальпель, який використовує спрямований лазер для розрізання замість леза, для точнішої хірургії, а також припікання під час різання.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: laser
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
    heldPrefix: laser
  # Start DeltaV additions
  - type: MeleeWeapon
    damage:
      types:
        Slash: 4
        Heat: 4
  # End DeltaV additions
  - type: Scalpel # Shitmed
    speed: 1.5
  # TODO: prevent bleeding from incisions
  - type: MedicalSurgeryTool # DeltaV Shitmed - Used for borg hand whitelists for surgery module

