- type: entity
  abstract: true
  parent: [ BaseItem, BaseMagicalContraband ]
  id: BaseSpellbook
  name: книга заклинань
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper_blood
      - state: cover_strong
        color: "#645a5a"
      - state: decor_wingette_flat
        color: "#4d0303"
      - state: icon_pentagramm
        color: "#f7e19f"
    - type: Spellbook
    - type: Tag
      tags:
      - Spellbook

# For the Wizard antagonist
# Do not add discounts or price inflation
- type: entity
  parent: [ BaseItem, StorePresetSpellbook, BaseMagicalContraband ]
  id: WizardsGrimoire
  name: гримуар чарівника
  suffix: майстер
  description: Важкий фоліант, що містить складні таємничі формули для приготування магічних заклинань і заклинання надприродного обладнання. Десятиліття досліджень пішли на дослідження цієї колекції містичних таємниць; тепер використовуй їх, щоб зіпсувати комусь день.
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper_blood
      - state: cover_strong
        color: "#645a5a"
      - state: decor_wingette_flat
        color: "#4d0303"
      - state: icon_pentagramm
        color: "#f7e19f"
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      refundAllowed: true
      ownerOnly: true # Lesser minds cannot comprehend the arcane secrets within
      balance:
        WizCoin: 10 # prices are balanced around this 10 point maximum and how strong the spells are

# No-refund version meant for manual spawning, so people can't abuse refund if they were given a tome. Not meant for wizard antag proper!
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireNoRefund
  suffix: Майстер, без повернення
  components:
    - type: Store
      refundAllowed: false

# For debugging purposes only! Or spawn this for an admeme so a wizard can have every spell at once, I can't stop you.
- type: entity
  parent: WizardsGrimoire
  id: WizardsGrimoireDebug
  suffix: Майстер, DEBUG
  description: Важкий фоліант, що містить складні таємничі формули для приготування магічних заклинань і заклинання надприродного обладнання. На внутрішній стороні обкладинки хтось написав «ЛИШЕ ДЛЯ ЕКСПЕРИМЕНТАЛЬНОГО ВИКОРИСТАННЯ».
  components:
    - type: Store
      ownerOnly: false # For ease of debugging.
      balance:
        WizCoin: 99999

- type: entity
  parent: BaseSpellbook
  id: SpawnSpellbook
  name: spawn книга заклинань
  components:
    - type: Spellbook
      spellActions:
        ActionSpawnMagicarpSpell: null

- type: entity
  parent: BaseSpellbook
  id: ForceWallSpellbook
  name: Силова стіна книга заклинань
  components:
    - type: Sprite
      sprite: Objects/Misc/books.rsi
      layers:
      - state: paper
      - state: cover_strong
        color: "#366ed6"
      - state: decor_vertical_middle
        color: "#95ffff"
      - state: decor_wingette_circle
        color: "#95ffff"
      - state: icon_magic_forcewall
        shader: unshaded
      - state: detail_rivets
        color: gold
    - type: Spellbook
      spellActions:
        ActionForceWall: null

