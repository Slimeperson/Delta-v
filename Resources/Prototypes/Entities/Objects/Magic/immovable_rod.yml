- type: entity
  id: ImmovableRod
  name: нерухомий стрижень
  description: Ви можете відчути, що він голодний. Зазвичай це поганий знак.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: MovementIgnoreGravity
    weightless: true
  - type: Sprite
    sprite: Objects/Fun/immovable_rod.rsi
    state: icon
    noRot: false
  - type: ImmovableRod
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: PointLight
    radius: 3
    color: red
    energy: 2.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 1
        hard: false
        layer:
        - Impassable
        - Opaque
  - type: WarpPoint
    follow: true
    location: immovable rod
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag # DeltaV - Prevent the warp point from being chosen for bombing/effigy targets
    tags:
      - GhostOnlyWarp

- type: entity
  parent: ImmovableRod
  id: ImmovableRodDespawn
  suffix: Деспаун
  components:
  - type: TimedDespawn
    lifetime: 30.0

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodSlow
  suffix: Повільно
  components:
  - type: ImmovableRod
    minSpeed: 1
    maxSpeed: 5

- type: entity
  parent: ImmovableRodDespawn
  id: ImmovableRodKeepTiles
  suffix: Тримайте плитки
  components:
  - type: ImmovableRod
    destroyTiles: false
    hitSoundProbability: 1.0

# For Wizard Polymorph
- type: entity
  parent: ImmovableRod
  id: ImmovableRodWizard
  suffix: майстер
  components:
  - type: ImmovableRod
    maxSpeed: 25
    destroyTiles: false
    randomizeVelocity: false
    shouldGib: false
    damage:
      types:
        Blunt: 190
  - type: Physics
    bodyType: KinematicController
  - type: InputMover
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 5
    baseWeightlessModifier: 2
    baseWeightlessFriction: 0
    baseFriction: 0
    offGridFriction: 0
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: NoSlip

- type: entity
  parent: ImmovableRodKeepTiles
  id: ImmovableRodKeepTilesStill
  suffix: Тримайте Tiles, Still
  components:
  - type: ImmovableRod
    randomizeVelocity: false
    maxSpeed: 0

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodMop
  name: нерухома швабра
  description: Кинуто, як спис, з силою тисячі розлючених двірників.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/mop.rsi
    state: mop
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodShark
  name: нерухома акула
  description: Силова стіна книга заклинань
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/shark.rsi
    state: blue
    rotation: 90
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodClown
  name: непорушний клоун
  description: Викинута з сусідньої станції одна сонячна система понад. СВИДНІТЬ!
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: clown
    rotation: 180
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodBanana
  name: нерухомий банан
  description: Принаймні на ньому не посковзнешся.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
    state: produce
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodHammer
  name: нерухомий молоток
  description: Bwoink.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodThrongler
  name: нерухомий дросел
  description: Якщо ви зловите це, ви можете зберегти його.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/Throngler2.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodGibstick
  name: нерухомий gibstick
  description: Чого ви очікували?
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/debug.rsi
    state: icon
    rotation: 225
    noRot: false

- type: entity
  parent: ImmovableRodKeepTilesStill
  id: ImmovableRodWeh
  name: нерухомий вех
  description: WEH!
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/lizard.rsi
    state: icon
    noRot: false
