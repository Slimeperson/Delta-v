- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFugitiveObjective
  components:
  - type: Objective
    issuer: objective-issuer-self
    difficulty: 1
  - type: RoleRequirement
    roles:
    - FugitiveRole

- type: entity
  parent: [BaseFugitiveObjective, BaseLivingObjective]
  id: FugitiveEscapeObjective
  name: Ухилятися від правоохоронних органів
  description: Ви ніколи не спокутуєте свої злочини, переконайтеся в цьому, злившись з натовпом.
  components:
  - type: Objective
    icon:
      sprite: Markers/jobs.rsi
      state: prisoner
  - type: EscapeShuttleCondition
