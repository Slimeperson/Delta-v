- type: entity
  parent: EncryptionKey
  id: EncryptionKeyJustice
  name: ключ шифрування справедливості
  description: Ключ шифрування, який використовується міністерством юстиції.
  components:
  - type: EncryptionKey
    channels:
    - Justice
    defaultChannel: Justice
  - type: Sprite
    layers:
    - state: crypt_gray
    - sprite: _DV/Objects/Devices/encryption_keys.rsi
      state: justice_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyPrison
  name: В'язничний ключ шифрування
  description: Ключ шифрування, яким користується кожен, кому потрібно поговорити з ув'язненими
  components:
  - type: EncryptionKey
    channels:
    - Prison
    defaultChannel: Prison
  - type: Sprite
    sprite: _DV/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_orange
    - state: prisoner_label

