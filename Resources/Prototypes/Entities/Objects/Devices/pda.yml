  description: Чому не сірий?
  suffix: Хамелеон
  components:
  - type: PdaBorderColor
    borderColor: "#717059"
  - type: Tag
    tags: # ignore "WhitelistChameleon" tag
    - DoorBumpOpener
  - type: ChameleonClothing
    slot: [idcard]
    default: PassengerPDA
    requireTag: WhitelistChameleonPDA
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface

- type: entity
  parent: BasePDA # DeltaV
  id: WizardPDA
  name: майстер КПК
  description: Ви чуєте слабкий шепіт, що доноситься звідти.
  components:
  - type: Pda
    id: WizardIDCard
    penSlot:
      startingItem: PenWiz
      priority: -1
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-wizard # DeltaV
  - type: PdaBorderColor
    borderColor: "#b5b196" # DeltaV
  - type: Icon
    state: pda-wizard # DeltaV


- type: entity
  parent: ClearPDA
