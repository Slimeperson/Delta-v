- type: entity
  parent: ReagentPacketBase
  id: ReagentContainerSalt
  name: контейнер для солі
  description: Велика ємність солі. Добре підходить для приготування!
  components:
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/ingredients.rsi
    state: salt-big
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: TableSalt
          Quantity: 50
  - type: Edible
    edible: Drink
    solution: food

