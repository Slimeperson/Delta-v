- type: entity
  name: кований меч
  parent: BaseSword
  id: SwordForged
  description: Виготовлений із пластмаси, достатньо одного дотику до леза, щоб взяти кров.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/forged_sword.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/forged_sword.rsi
    slots:
    - suitStorage
  - type: Tag
    tags:
    - SwordForged

- type: entity
  name: світанок
  parent: [ BaseSword,Welder ]
  id: SwordFlaming
  description: Як досягти досконалості? Звичайно, використовуйте вогонь! Будьте сяючим світлом у головах і хоробро боріться!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    enabled: false
    radius: 3
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 8
            Slash: 10
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
    slots:
    - suitStorage
  - type: Construction
    graph: SwordFlamingGraph
    node: sword

- type: entity
  name: аномалія-поведінка-швидка
  parent: BaseSword
  id: ClaymoreForged
  description: Ідеальна зброя для молодого лицаря!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/tidebreaker.rsi
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Slash: 20
        Structural: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/tidebreaker.rsi
    slots:
    - suitStorage
  - type: DisarmMalus
  - type: Scalpel
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/scalpel2.ogg