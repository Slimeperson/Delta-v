- type: entity
  abstract: true
  parent: BaseAction
  id: BasePsionicAction
  components:
  - type: Action
    itemIconStyle: BigAction
    startDelay: true

- type: entity
  parent: BasePsionicAction
  id: ActionDispel
  name: Розвіяти
  description: Розсіювати покликаних сутностей, таких як фамільяри або силові стіни.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: dispel
    useDelay: 45
    checkCanInteract: false
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:DispelPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMassSleep
  name: Масовий сон
  description: Покладіть мішені на невелику територію для сну.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mass_sleep
    useDelay: 60
  - type: InstantAction
    event: !type:MassSleepPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMindSwapPsionic
  name: Mind Swap
  description: Поміняйтеся думками з метою. Будь-яка з них може повернутися через 20 секунд.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mind_swap
    useDelay: 240
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:MindSwapPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMindSwapReturn
  name: Зворотний обмін думками
  description: Поверніться до свого початкового тіла.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mind_swap_return
    useDelay: 20
    checkCanInteract: false
  - type: InstantAction
    event: !type:MindSwappedReturnPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionNoosphericZap
  name: Ноосферний зап
  description: Шокує ціль і залишає її приголомшеною та заїкається.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: noospheric_zap
    useDelay: 100
    checkCanInteract: false
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    event: !type:NoosphericZapPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPyrokinesis
  name: Пірокінез
  description: Підпалити легкозаймисту мішень.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: pyrokinesis
    useDelay: 50
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:PyrokinesisPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMetapsionicPulse
  name: Метапсіонний пульс
  description: Надішліть ментальний імпульс через вказану область, щоб побачити, чи є екстрасенси.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: metapsionic
    useDelay: 45
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: -1 # You can cast it anywhere on your screen.
  - type: WorldTargetAction
    event: !type:MetapsionicPulsePowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionEruption
  name: Псіонічне виверження
  description: Дайте волю потужному псіонічному виверженню, що знищить вас і все навколо.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: eruption
    useDelay: 45
    checkCanInteract: false
  - type: InstantAction
    event: !type:PsionicEruptionPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPsionicRegeneration
  name: Псіонічна регенерація
  description: Доведіть свій природний метаболізм до межі, щоб активізувати регенераційну здатність вашого тіла.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: regeneration
    useDelay: 120
    checkCanInteract: false
  - type: InstantAction
    event: !type:PsionicRegenerationPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionTelegnosis
  name: Телегноз
  description: Створіть телегностичну проекцію, щоб дистанційно спостерігати за речами.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: telegnosis
    useDelay: 150
    checkCanInteract: false
  - type: InstantAction
    event: !type:TelegnosisPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPsionicInvisibility
  name: object-condition-culttier-title
  description: Зробіть себе невидимим для будь-якої сутності, яка потенційно може бути психічною. Борги, тварини і так далі не впливають.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: invisibility
    useDelay: 120
    checkCanInteract: false
  - type: InstantAction
    event: !type:PsionicInvisibilityPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPrecognition
  name: Передбачення
  description: Зазирніть у майбутнє, щоб отримати підказку про наступну випадкову подію.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: precognition
    useDelay: 240
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:PrecognitionPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPsychokineticScream
  name: Психокінетичний крик
  description: Видайте крик, від якого холоне кров, і розбийте всі вогні в цьому місці.
  components:
  - type: Action
    icon: { sprite: _DV/Actions/shatterlights.rsi, state: shatter-lights }
    useDelay: 60
  - type: InstantAction
    event: !type:PsychokineticScreamPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionFracturedForm
  name: Форма обміну
  description: Перейдіть на одну з альтернативних форм, якщо вона у вас є. Це також можна зробити за допомогою сну.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics_small.rsi
      state: fractured_form
    useDelay: 60
    checkCanInteract: false
  - type: InstantAction
    event: !type:FracturedFormPowerActionEvent
