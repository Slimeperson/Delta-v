- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardMagicocracyObjective
  name: Магікократія
  description: Узурпуйте владу та встановіть магікократію серед світських на цій станції!
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/wizardhat.rsi
      state: icon

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardBalanceObjective
  name: Баланс
  description: Встановіть космічний баланс на станції, досягнувши ідеального поєднання хаосу та миру за допомогою дотепності та таємниці!
  components:
  - type: Objective
    icon:
      sprite: _DV/Misc/wizard.rsi
      state: scale

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardDestroyObjective
  name: Знайдіть найсмішніший спосіб закінчення станції
  description: Шукайте найвеселіший можливий сценарій апокаліпсису. Варіанти тесту. Симулюйте катастрофи. Пройдіть опитування членів екіпажу. Виберіть свій улюблений кінець і спробуйте його втілити.
  components:
  - type: Objective
    difficulty: 2
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardTeachObjective
  name: Навчати
  description: Створіть рух, заснований на навчанні, інструктуванні або обговоренні з екіпажем таємного мистецтва, будь то наставництво чи експериментування!
  components:
  - type: Objective
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardProfitObjective
  name: Прибуток
  description: Використовуйте станцію з метою отримання прибутку для федерації чарівників!
  components:
  - type: Objective
    icon:
      sprite: Objects/Economy/cash.rsi
      state: cash_1000000

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardPopularObjective
  name: Стати популярним
  description: Прагніть бути найбільш улюбленою, обговорюваною або затребуваною людиною на станції!
  components:
  - type: Objective
    icon:
      sprite: Clothing/Eyes/Glasses/sunglasses.rsi
      state: icon

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardDataObjective
  name: Збирайте безглузді дані
  description: Записуйте та аналізуйте такі химерні показники, як «Середній час вагання дверного отвору», «Оцінки пробивності екіпажу» або «Скільки пір’я — це забагато пір’я?» Якщо вас запитають, просто скажіть їм: «Це для науки».
  components:
  - type: Objective
    icon:
      sprite: _DV/Clothing/Head/Hats/propellerhat.rsi
      state: icon

- type: entity
  parent: [BaseWizardObjective, BaseKeepAliveObjective]
  id: WizardPreserveObjective
  description: Таємнича космічна сутність передбачила, що смертний на борту станції продовжить творити великі справи, і ви повинні зберегти його життя будь-якими засобами.
  components:
  - type: Objective
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: shield
  - type: TargetObjective
    title: object-condition-wizard-preserve-person-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
        - KillPersonCondition # Should also choose those who have targets on their heads by other antags :3
    - !type:ObjectiveImmuneFilter

- type: entity
  parent: [BaseWizardObjective, BaseKillObjective]
  id: WizardKillObjective
  description: Федерація космічних чарівників доручила вам впоратися з одним із її суперників. Зробіть це найбільш публічним і вражаючим способом!
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Basic/wands.rsi
      state: death
  - type: TargetObjective
    title: object-condition-wizard-kill-person-title
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: [BaseWizardObjective, BaseFreeObjective]
  id: WizardFearObjective
  name: Стати страхом
  description: Seek to become the most feared person on the station. Змусьте їх відсахнутися при згадці вашого імені!
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/cluwne.rsi
      state: icon
