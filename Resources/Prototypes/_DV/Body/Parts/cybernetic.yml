- type: entity
  parent: LeftArmCyberneticBase
  id: ForcewallLeftArm
  name: FWL ліва рука
  description: Протез руки, створений шляхом поєднання передової кібернетики та потужної псіоніки. Це дозволяє використовувати здатність forcewall.
  components:
  - type: BodyPart
    onAdd:
    - type: ActionGrant
      actions:
      - ActionForceWall
    - type: Psionic

