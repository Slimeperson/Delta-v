        Slash: 4 # DeltaV: 15 brute changed to 4 slash
        Piercing: 4 # DeltaV: 15 brute changed 4 piercing
        Structural: 20 # DeltaV: Added 20 structural damage
  - type: Tool
    speedModifier: 2.0
  - type: BoneSaw # Shitmed
