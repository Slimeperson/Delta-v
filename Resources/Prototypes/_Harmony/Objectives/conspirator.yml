- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseConspiratorObjective
  components:
  - type: Objective
    issuer: conspirator-objective-issuer
    difficulty: 0 # uses own system for assignment
  - type: RoleRequirement
    roles:
    - ConspiratorRole
  - type: NoCompletionObjective

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorUnionObjective
  name: Сильно захопити контроль над відділом
  description: Візьміть на себе безпосередній контроль над відділом і декларуйте незалежність від Nanotrasen.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunprod.rsi
      state: stunprod_off

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorGameshowObjective
  name: Проведіть ігрове шоу на життя чи смерть
  description: Змусьте команду взяти участь в ігровому шоу з неймовірними ставками.
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/computers.rsi
      state: television

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorTechnologyObjective
  name: Захопити всю станційну техніку
  description: Покажіть екіпажу переваги простішого життя. Тому що тільки ви заслуговуєте на чудеса техніки.
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/autolathe.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArmsObjective
  name: Зніміть службу безпеки та озбройтеся
  description: Візьміть зброю у служби безпеки і віддайте її собі. Їм не можна довіряти.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorThiefObjective
  name: Здійсніть найбільше пограбування всіх часів
  description: Запишіть свої імена в підручниках історії за те, що ви берете з цієї станції.
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/thief_beacon.rsi
      state: extraction_point

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorMafiaObjective
  name: Створіть злочинну сім'ю
  description: Станьте лідерами злочинності на цій станції та закріпіть свою репутацію групи, з якою не можна зв’язуватися.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Hands/Gloves/KnuckleDusters/brassknuckleduster.rsi
      state: brassknuckleduster

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArrestObjective
  name: Змусити службу безпеки заарештувати невинних людей
  description:  Продемонструйте свою некомпетентність, показавши, наскільки легко їх обдурити.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_off

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorCameraObjective
  name: Демонтаж штату стеження
  description: Повернути працівникам Nanotrasen право на конфіденційність.
  components:
  - type: Objective
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: ai_camera
