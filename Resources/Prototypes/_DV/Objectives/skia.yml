- type: entity
  parent: BaseObjective
  id: SkiaReapObjective
  name: Можливо, є місце, як друзі.
  description: Переконайтеся, що цю душу хоча б один раз випустили зі свого тіла.
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-skia
    unique: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: RoleRequirement
    roles:
    - SkiaRole
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: об'єктивна-умова-жати-душу-титул
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    # Can't have multiple objectives to kill the same person.
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: RerollAfterCompletion
    rerollObjectivePrototype: SkiaReapObjective
    rerollObjectiveMessage: objective-condition-reap-soul-reroll-message
