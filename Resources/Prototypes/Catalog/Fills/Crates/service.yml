- type: entity
  parent: CratePlastic
  id: CrateServiceJanitorialSupplies
  name: ящик для прибирального приладдя
  description: Боріться з брудом і брудом за допомогою Nanotrasen Janitorial Essentials(tm)! Містить три відра, попереджувальні знаки та очищувальні гранати. Також є одна швабра, мітла, спрей для чищення, дротяна щітка, ганчірка та пакет для сміття.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: AllSoapsTable
        - id: MopItem
        - id: MopBucketCubeWrapped
        - id: Bucket
          amount: 3
        - id: WetFloorSign
          amount: 2
        - id: SprayBottleSpaceCleaner
          amount: 2
        - id: TrashBag
          amount: 2
        - id: Plunger
          amount: 2
        - id: BoxCleanerGrenades
        - id: WireBrush
          amount: 2

