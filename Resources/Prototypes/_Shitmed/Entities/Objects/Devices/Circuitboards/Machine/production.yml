- type: entity
  id: MedicalBiofabMachineBoard
  parent: BaseMachineCircuitboard
  name: медична біофабрична машина
  description: revenant-blood-writing-name
  components:
    - type: Sprite
      state: medical
    - type: MachineBoard
      prototype: MedicalBiofabricator
      stackRequirements:
        Manipulator: 4

- type: entity
  parent: BaseMachineCircuitboard
  id: AutodocCircuitboard
  name: плата машини autodoc
  description: Машинна друкована плата для автодок.
  components:
  - type: MachineBoard
    prototype: Autodoc
    stackRequirements:
      Cable: 3
      Manipulator: 4
      Steel: 10
    tagRequirements:
      BorgArm:
        amount: 3
        defaultPrototype: LeftArmBorg

- type: entity
  parent: AutodocCircuitboard
  id: AutodocSyndieCircuitboard
  suffix: Синді
  components:
  - type: MachineBoard
    prototype: AutodocSyndie

- type: entity
  parent: BaseMachineCircuitboard
  id: OperatingTableCircuitboard
  name: операційний стіл машинна дошка
  description: Машинна друкована плата для операційного столу.
  components:
  - type: MachineBoard
    prototype: OperatingTable
    stackRequirements:
      Cable: 3
      Silver: 2
      Steel: 4

- type: entity
  parent: BaseMachineCircuitboard
  id: OperatingTableAdvancedCircuitboard
  name: вдосконалена дошка машини операційного столу
  description: Машинна друкована плата для вдосконаленого операційного столу.
  components:
  - type: MachineBoard
    prototype: OperatingTableAdvanced
    stackRequirements:
      Cable: 3
      Silver: 2
      Steel: 4