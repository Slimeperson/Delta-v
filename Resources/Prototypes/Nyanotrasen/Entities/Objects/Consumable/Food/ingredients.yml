# Curd cheese, substitute for a lot of things
- type: entity
  name: сирний сир
  parent: FoodBakingBase
  id: FoodCurdCheese
  description: Міцний комплект комбінезона для трекінгу по зірках.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - creamy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/cheese.rsi
    state: curdcheese
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4
        reagents:
        - ReagentId: Protein
          Quantity: 3
        - ReagentId: Cream
          Quantity: 1
  - type: Tag
    tags:
      - ClothMade # Mothic Food

- type: entity
  name: сирні сирки
  parent: FoodBakingBase
  id: FoodCheeseCurds
  description: Не сплутати з сирним сиром. Смачно смажене у фритюрі.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/cheese.rsi
    state: cheesecurds
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Protein
          Quantity: 3
  - type: Tag
    tags:
      - ClothMade # Mothic Food

