- type: entity
  abstract: true
  id: BaseSubfloorAnchorStorage
  components:
  - type: Appearance
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Transform
    anchored: false
  - type: AnchoredStorageFilter
    blacklist:
      components:
      - HumanoidAppearance # for forks with felines
  - type: BlockAnchorOn
    blacklist:
      components:
      - AnchoredStorageFilter
  - type: Visibility
    layer: 1

- type: entity
  abstract: true
  parent: BaseSubfloorAnchorStorage
  id: BaseSubfloorAnchorStorageAnchored
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, ClothingBackpackSatchel, BaseMinorContraband ]
  id: ClothingBackpackSatchelSmuggler
  name: контрабандистський ранець
  suffix: Порожній
  description: Зручний сумець підозрілого вигляду. Досить рівно, щоб поміститися під плитку для підлоги.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon

- type: entity
  parent: [ BaseSubfloorAnchorStorage, ClothingBackpackSatchel, BaseMinorContraband ]
  id: ClothingBackpackSatchelSmugglerUnanchored
  name: контрабандистський ранець
  suffix: Порожній, незакріплений
  description: Зручний сумець підозрілого вигляду. Досить рівно, щоб поміститися під плитку для підлоги.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, BriefcaseSyndie, BaseMinorContraband ]
  id: BriefcaseSmugglerCash
  name: портфель контрабандиста
  suffix: Контрабандист, не мапа
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SpaceCash5000
          amount: !type:RangeNumberSelector
            range: 1, 11

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, ClothingBackpackDuffelClown, BaseMinorContraband ]
  id: ClothingBackpackDuffelClownSmuggler
  name: речовий мішок клоуна контрабандиста
  suffix: Контрабандист, не мапа
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: RandomCapGunTable
        rolls: 4, 7

- type: entity
  parent: ClothingBackpackSatchelSmuggler
  id: ClothingBackpackSatchelSmugglerFilled
  suffix: Контрабандист, не мапа
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: FillSmugglerBackpack

- type: entity
  parent: MarkerBase
  id: RandomSatchelSpawner
  name: спавнер випадкового контрабандиста
  suffix: Не мап
  components:
  - type: Sprite
    layers:
      - sprite: Clothing/Back/Satchels/smuggler.rsi
        state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomSatchelTable
