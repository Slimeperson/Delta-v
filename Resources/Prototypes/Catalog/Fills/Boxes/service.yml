- type: entity
  name: box cleanades
  parent: BoxCardboard
  id: BoxCleanerGrenades
  description: Ящик, наповнений очищами.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CleanerGrenade
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: flashbang

- type: entity
  name: Набір НТ «AgriChem Is Fun».
  parent: BoxCardboard
  id: BoxAgrichem
  description: Для початківців ботаніків, готових дізнатися про максимізацію продуктивності ферми. Цій вицвілій коробці має бути не менше 50 років.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PaperAgrichemManual
        - id: ChemistryEmptyBottle01
        - id: ChemistryBottlePotassium
        - id: ChemistryBottlePhosphorus
        - id: ChemistryBottleNitrogen
        - id: ChemistryBottleHydrogen
        - id: ChemistryBottleEthanol
        - id: RadiumChemistryVial
        - id: ChlorineChemistryVial
  - type: Sprite
    layers:
      - state: boxwide
      - state: agrichemkit
  - type: GuideHelp
    guides:
    - Botanical
    - Chemicals

