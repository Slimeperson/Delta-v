- type: entity
  name: чорний фоліант
  parent: BasePaper
  id: KillTome
  suffix: KillTome, Admeme # Щоб залишатися вірним знанням, будь ласка, ніколи не робіть це доступним поза божественним втручанням (admeme).
  description: Потертий чорний фоліант. Пахне старим папером.
  components:
  - type: Sprite
    sprite: Objects/Misc/killtome.rsi
    state: icon
  - type: KillTome
    defaultKillDelay: 40
    damage:
      types:
        Blunt: 200
  - type: Paper
    content: killtome-rules
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
