- type: entity
  name: Спаунер людських трупів
  id: SalvageHumanCorpseSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - SalvageHumanCorpse

- type: entity
  name: Випадковий сервісний спавнер трупів
  id: RandomServiceCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: botanist
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomServiceCorpse

- type: entity
  name: H.O.N.K. Спаунер
  id: RandomEngineerCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: engineer
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomEngineerCorpse

- type: entity
  name: Випадковий породжувач трупів логістики # DeltaV - відділ логістики замінює вантаж
  id: RandomCargoCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: cargo_tech
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomCargoCorpse

- type: entity
  name: Випадковий спавнер медичного трупа
  id: RandomMedicCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: doctor
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomMedicCorpse

- type: entity
  name: Випадковий спавнер епістемічних трупів # DeltaV - Відділ епістемічних досліджень замінює науку
  id: RandomScienceCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: scientist
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomScienceCorpse

- type: entity
  name: Випадковий спавнер трупів безпеки
  id: RandomSecurityCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  categories: [ HideSpawnMenu ] # DeltaV - Prevent security corpses from being mapped in
  components:
  - type: Sprite
    layers:
      - state: security_officer
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomServiceCorpse # DeltaV - Prevent Security corpses from spawning and instead spawn Service corpses

- type: entity
  name: Випадкова команда Corpse Spawner
  id: RandomCommandCorpseSpawner
  parent: SalvageHumanCorpseSpawner
  components:
  - type: Sprite
    layers:
      - state: captain
      - state: green
  - type: ConditionalSpawner
    prototypes:
      - MobRandomCommandCorpse
