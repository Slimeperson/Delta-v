# When adding new balloons, also add it to id: AllMiscToysTable

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBalloon
  components:
  - type: Sprite
    noRot: true
  - type: Item
    size: Small
  - type: EmitSoundOnCollide
    sound: &SoundBalloonHit
      path: /Audio/Effects/balloon_hits.ogg
  - type: EmitSoundOnLand
    sound: *SoundBalloonHit
  - type: Damageable
    damageContainer: Inorganic
  - type: TileFrictionModifier
    modifier: 0.3
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseBalloon
  id: BalloonSyn
  name: синді повітряна куля
  description: Роздано найсміливішим людям, які вижили під час атракціону «атомний твістер» у Синділенді.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/syndicate.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/syndicate.rsi
  - type: StaticPrice
    price: 100 # Entertainment.

- type: entity
  parent: BaseBalloon
  id: BalloonNT
  name: нанотрасен повітряна куля
  description: Спеціально розроблений для нанесення максимальної психологічної шкоди оперативникам Синдикату.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/nanotrasen.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/nanotrasen.rsi

- type: entity
  parent: BaseBalloon
  id: BalloonCorgi
  name: повітряна куля коргі
  description: Так само, як мати справжню собаку, але набагато плаваючу.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/corgi.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/corgi.rsi
