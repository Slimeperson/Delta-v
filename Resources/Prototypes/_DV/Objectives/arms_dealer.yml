- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseArmsdealerObjective
  components:
  - type: Objective
    difficulty: 0 # difficulty is unused
  - type: RoleRequirement
    roles:
    - ArmsdealerRole

- type: entity
  parent: [BaseArmsdealerObjective, BaseSurviveObjective]
  id: ArmsdealerSurviveObjective
  description: Виживіть, щоб розпродати свої товари ще один день!
  name: Вижити і процвітати
  components:
  - type: Objective
    icon:
      sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
      state: icon

- type: entity
  parent: [BaseArmsdealerObjective, BaseSurviveObjective]
  id: ArmsdealerSaleObjective
  description: Ваш підрядник доручив вам заробити 50 тисяч песо.
  name: Всі спесо
  components:
  - type: Objective
    icon:
      sprite: _DV/Objects/Misc/first_bill.rsi
      state: icon
