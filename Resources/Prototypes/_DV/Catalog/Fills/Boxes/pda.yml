- type: entity
  name: безпека КПК
  parent: BoxPDA
  id: BoxPDASecurity
  description: Коробка запасних мікрокомп'ютерів КПК для служби безпеки.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SecurityPDA
        - id: DetectivePDA
        - id: WardenPDA
        - id: SeniorOfficerPDA

- type: entity
  name: ув'язнений КПК
  parent: BoxPDA
  id: BoxPDAPrisoner
  description: Коробка запасних мікрокомп'ютерів КПК для наглядача для використання ув'язненими.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PrisonerPDA
        amount: 4

