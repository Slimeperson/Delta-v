- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackElectropack
  name: електропакет
  suffix: SelfUnremovable
  description: Удари по сигналу. Використовується для того, щоб тримати під контролем особливо небезпечного злочинця.
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/electropack.rsi
    state: icon
  - type: Clothing
    stripDelay: 10
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
  - type: SelfUnremovableClothing
  # Start DeltaV Additions
  - type: ShockOnUnequip
    damage: 5
    duration: 3
  - type: AccessReader
    access: [["Security"]]
  # End DeltaV Additions
  - type: ShockOnTrigger
    targetContainer: true
    damage: 5
    duration: 3
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger

