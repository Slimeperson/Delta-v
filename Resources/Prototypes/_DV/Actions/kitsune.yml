- type: entity
  parent: BaseAction
  id: ActionFoxfire
  name: Створіть Foxfire
  description: Створіть прохолодний, ніжно сяючий вогник
  components:
  - type: LimitedCharges
    maxCharges: 3
    disableWhenEmpty: false
  - type: Action
    icon: { sprite: _DV/Structures/Specific/Species/Kitsune/foxfire.rsi, state: icon }
  - type: InstantAction
    event: !type:CreateFoxfireActionEvent

- type: entity
  parent: BaseAction
  id: ActionKitsuneMorph
  name: Kitsune Shapeshift
  description: Перейдіть у форму лисиці
  components:
  - type: Action
    icon: { sprite: Mobs/Animals/fox.rsi, state: fox }
    useDelay: 2
  - type: InstantAction
    event: !type:MorphIntoKitsune
