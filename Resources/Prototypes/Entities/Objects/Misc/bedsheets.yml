  description: Книга являє собою добре збережену тверду обкладинку з простим елегантним дизайном на обкладинці, що зображує світ у русі. Сторінки чіткі та чисті, без слідів зношення чи потертості, що свідчить про те, що його попередній власник добре доглядав і цінував його. Текст надруковано чітким, розбірливим шрифтом, а розділи організовано логічно та легко для сприйняття, що робить його доступним для читачів усіх рівнів знань.
  components:
  - type: Sprite
    sprite: _DV/Objects/Misc/bedsheets.rsi # DeltaV - resprite sec bedsheets
    state: sheetbrigmedic
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/grey.rsi # DeltaV - resprite sec bedsheets

