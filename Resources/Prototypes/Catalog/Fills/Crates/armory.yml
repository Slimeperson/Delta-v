- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateArmorySMG
  name: Ящик SMG
  description: Містить два SMG з чотирма магазинами. Щоб відкрити, потрібен доступ до Збройової палати.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: WeaponSubMachineGunWt550
          amount: 2
        - id: MagazinePistolSubMachineGunTopMounted
          amount: 4

- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateArmoryShotgun
  name: ящик для дробовика
  description: Бо коли ворога конче потрібно замінити свинцем. Містить дві бойові дробовики Enforcer і декілька стандартних рушничних гільз. Щоб відкрити, потрібен доступ до Збройової палати.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: WeaponShotgunEnforcer
          amount: 2
        - id: BoxLethalshot
          amount: 4

- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateTrackingImplants
  name: відстеження імплантів
  description: Містить декілька імплантаторів відстеження. Добре підходить для в’язнів, яких ви хочете звільнити, але все ще стежите за ними.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: TrackingImplanter
        amount: 5

- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateTrainingBombs
  name: навчальні бомби
  description: Містить три тренувальні бомби малої потужності для безпеки, щоб навчитися знешкоджувати та безпечно знешкоджувати боєприпаси, костюм EOD не входить. Щоб відкрити, потрібен доступ до Збройової палати.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: TrainingBomb
        amount: 3

- type: entity
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  id: CrateArmoryLaser
  name: лазерний ящик
  description: Містить три стандартні лазерні гвинтівки. Щоб відкрити, потрібен доступ до Збройової палати.
  components:
