- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: ключ шифрування
  description: Невеликий чіп шифр для гарнітур.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: загальний ключ шифрування
  description: Ключ шифрування, який використовується будь-ким.
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label
  - type: Tag
    tags:
    - EncryptionCommon

- type: entity
  parent: [ EncryptionKey, BaseCargoContraband ]
  id: EncryptionKeyCargo
  name: ключ шифрування логістики # DeltaV - відділ логістики замінює Cargo
  description: голобар'єрний проектор
  components:
  - type: EncryptionKey
    channels:
    - Supply
    defaultChannel: Supply
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: cargo_label
  - type: Tag
    tags:
    - EncryptionCargo

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyCentCom
  name: центральний командний ключ шифрування
  description: електроніка пульта управління сторожової вежі
  components:
  - type: EncryptionKey
    channels:
    - CentCom
    defaultChannel: CentCom
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommCommandContraband ]
  id: EncryptionKeyStationMaster
  name: головний ключ шифрування станції
  description: Ключ шифрування, який використовують боси станції.
  components:
  - type: EncryptionKey
    channels:
    - Common
    - Command
    - Engineering
    - Justice # Delta V- adds Justice department
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Prison # DeltaV
    - Traffic # DeltaV
    defaultChannel: Command
  - type: Sprite
    layers:
    - state: crypt_gold
    - state: cap_label

- type: entity
  parent: [ EncryptionKey, BaseCommandContraband ]
  id: EncryptionKeyCommand
  name: ключ шифрування команди
  description: Ключ шифрування, який використовують боси екіпажу.
  components:
  - type: EncryptionKey
    channels:
    - Command
    defaultChannel: Command
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: com_label
  - type: Tag
    tags:
    - EncryptionCommand

- type: entity
  parent: [ EncryptionKey, BaseEngineeringContraband ]
  id: EncryptionKeyEngineering
  name: інженерний ключ шифрування
  description: Ключ шифрування, який використовують інженери.
  components:
  - type: EncryptionKey
    channels:
    - Engineering
    defaultChannel: Engineering
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: eng_label
  - type: Tag
    tags:
    - EncryptionEngineering

- type: entity
