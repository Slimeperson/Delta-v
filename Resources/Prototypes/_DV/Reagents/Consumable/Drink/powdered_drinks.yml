  name: назва-реагенту-порошок-сік-лайма
  group: Foods
  desc: reagent-desc-powdered-juice-lime
  flavor: sour
  color: "#B4FF64"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 0.5
      - !type:Emote
        emote: Cough
        showInChat: true
        probability: 0.33
