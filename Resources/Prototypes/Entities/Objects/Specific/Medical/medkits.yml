- type: entity
  name: аптечка першої допомоги
  description: Це аптечка для невідкладної допомоги для тих серйозних бу-бу.
  parent: BaseStorageItem
  id: Medkit
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    state: firstaid
  - type: Storage # DeltaV - add whitelist to first aid kits
    whitelist:
      tags:
        - Bloodpack
        - Bottle
        - Brutepack
        - Gauze
        - Ointment
        - PillCanister
        - Syringe
      components:
        - GasTank # DeltaV
        - BreathMask
        - Injector # Deltav
    maxItemSize: Small
    grid:
    - 0,0,3,1
  - type: Item
    size: Large
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: firstaid
  - type: PhysicalComposition
    materialComposition:
      Plastic: 150
  - type: Tag
    tags:
    - Medkit

