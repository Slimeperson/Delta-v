- type: entity
  parent: [WeaponLaserCarbinePractice, BaseGunWieldable, BaseSecurityContraband]
  id: EmergencyWeaponLaserCarbine
  name: аварійна лазерна гвинтівка
  description: Екстрена лазерна гвинтівка для використання, коли своєчасне отримання дозволу не є варіантом. Віддайте це охороні, коли берег буде вільним.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Battery/emergency_laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: StaticPrice
    price: 300
  - type: BatteryAmmoProvider
    proto: EmergencyRedLaser
    fireCost: 50
  - type: Item
    size: Ginormous
  - type: PointLight
    radius: 1.5
    energy: 14
    color: "#ff0043"
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 180
