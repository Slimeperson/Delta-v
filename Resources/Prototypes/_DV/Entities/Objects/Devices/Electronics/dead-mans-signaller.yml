#This signaller device will send a signal if it is dropped while activated

- type: entity
  parent: RemoteSignaller
  id: DeadMansSignaler
  name: сигналіст мерця
  description: Пристрій, який, якщо його ввімкнено, надсилатиме сигнали об’єктам у радіусі 50 метрів, коли його впадуть або приберуть.
  components:
  - type: DeadMansSignaller
  - type: ItemToggle
  - type: Sprite
    drawdepth: Items
    sprite: _DV/Objects/Devices/deadmanssignaller.rsi
    layers:
    - state: inactive
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: active}
          False: {state: inactive}
  - type: WirelessNetworkConnection
    range: 50
