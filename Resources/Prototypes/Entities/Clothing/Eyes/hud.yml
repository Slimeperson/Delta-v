- type: entity
  id: ShowMedicalIcons
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
    # Begin DeltaV Changes - Kitsune
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - BiologicalMetaphysical
  - type: ShowHealthIcons
