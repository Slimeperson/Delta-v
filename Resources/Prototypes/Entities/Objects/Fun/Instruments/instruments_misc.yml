- type: entity
  parent: BaseHandheldInstrument
  id: BikeHornInstrument
  name: позолочений велосипедний гудок
  description: Вишукано прикрашений велосипедний гудок, який може сигналити різноманітними нотами.
  components:
  - type: Instrument
    program: 1
    bank: 1
  - type: Sprite
    sprite: Objects/Fun/Instruments/bike_horn.rsi
  - type: Tag
    tags:
    - BrassInstrument #Go figure.
  - type: Item
    size: Small
    storedRotation: -90
  - type: Clothing
    slots: [Belt]
    quickEquip: false

- type: entity
  parent: PhoneInstrument
  id: BananaPhoneInstrument
  name: телефон банан
  description: Пряма лінія до Honkmother. Здається, завжди переходить на голосову пошту.
  components:
  - type: Sprite
    state: banana_phone
  - type: EmitSoundOnLand
    sound:
       path: /Audio/Items/bikehorn.ogg
  - type: Slippery
  - type: StepTrigger
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 5
        mask:
        - ItemMask
  - type: Prayable
    sentMessage: prayer-popup-notify-honkmother-sent
    notificationPrefix: prayer-chat-notify-honkmother
    verb: prayer-verbs-call
    verbImage: null
