- type: entity
  parent: BaseLightbulb
  name: синя світлова трубка
  description: Лампа середньої потужності, яка нагадує про космос. Може містити ртуть.
  id: BlueLightTube
  components:
  - type: LightBulb
    bulb: Tube
    color: "#B4FCF0"
    lightEnergy: 3
    lightRadius: 12
    lightSoftness: 0.5
    BurningTemperature: 350
    PowerUse: 75
  - type: Sprite
    sprite:  Objects/Power/light_tube.rsi
    state: normal

- type: entity
  parent: BaseLightbulb
  name: лампочка розжарювання
  suffix: Технічне обслуговування
  id: LightBulbMaintenance
  description: Тьмяна лампочка.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#FFD1A3" # 4000K color temp
    lightEnergy: 0.05
    lightRadius: 5
    lightSoftness: 7
  - type: Tag
    tags:
    - LightBulb
    - Trash

