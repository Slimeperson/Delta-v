- type: entity
  id: HandTeleporter
  parent: [BaseItem, BaseGrandTheftContraband]
  name: ручний телепорт
  description: "Фірмова річ Nanotrasen — лише найкраща технологія bluespace. Інструкції: використайте один раз, щоб створити портал, який телепортується випадковим чином. Скористайтеся ще раз, щоб пов’язати його з порталом у вашому поточному місці. Скористайтеся ще раз, щоб очистити всі портали."
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
  - type: HandTeleporter
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: HandTeleporter

- type: entity
  id: HandTeleporterAdmeme
  suffix: Admeme
  parent: BaseItem
  name: міжвимірний телепорт
  description: Дозволяє відкривати стійкі портальні ворота, які не обмежені відстанню.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
      color: green
  - type: HandTeleporter
    firstPortalPrototype: PortalGatewayBlue
    secondPortalPrototype: PortalGatewayOrange
