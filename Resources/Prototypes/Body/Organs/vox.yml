- type: entity
  id: OrganVoxLungs
  parent: OrganHumanLungs
  description: "Сині анаеробні легені вокса, вони споживають азот, щоб дихати. Будь-яка форма газоподібного кисню є смертельно токсичною при вдиханні».
  suffix: "вокс"
  name: vox легені # Shitmed
  components:
  - type: Sprite
    sprite: Mobs/Species/Vox/organs.rsi
  - type: Metabolizer
    metabolizerTypes: [ Vox ]
  - type: Lung
    alert: LowNitrogen
  - type: Item
    size: Small
    heldPrefix: lungs

