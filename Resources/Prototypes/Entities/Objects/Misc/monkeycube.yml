- type: entity
  parent: BoxCardboard
  name: коробка для кубиків мавпи
  id: MonkeyCubeBox
  description: Кубики мавпи бренду Drymate. Просто додайте води!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MonkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: BaseItem
  abstract: true
  suffix: Загорнутий
  id: BaseWrappedCube
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi

- type: entity
  parent: BaseWrappedCube
  name: куб мавпи
  id: MonkeyCubeWrapped
  description: Розгорніть це, щоб отримати куб мавпи.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MonkeyCube
  - type: Sprite
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube

- type: entity
  parent: MonkeyCubeBox
  name: кубична коробка Кобольда
  id: KoboldCubeBox
  description: Згущені кобольди в кубі. Просто додайте води!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: KoboldCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold

- type: entity
  parent: MonkeyCubeBox
  name: цукерниця"
  id: VariantCubeBox
  description: І куби кобольда, і куби мавпи. Просто додайте води!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: KoboldCubeWrapped
          amount: 4
        - id: MonkeyCubeWrapped
          amount: 4
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant

- type: entity
  parent: BaseWrappedCube
  name: куб кобольда
  id: KoboldCubeWrapped
  description: Розгорніть це, щоб отримати куб Кобольда.
  components:
  - type: SpawnItemsOnUse
    items:
      - id: KoboldCube
  - type: Sprite
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: коробка для кубиків мавпи
  suffix: Синдикат
  id: SyndicateSpongeBox
  description: Кубики мавпи бренду Drymate. Просто додайте води!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: куб мавпи
  suffix: Загорнуто, Синдикат
  id: SyndicateSpongeWrapped
  components:
  - type: SpawnItemsOnUse
    items:
      - id: SyndicateSponge
