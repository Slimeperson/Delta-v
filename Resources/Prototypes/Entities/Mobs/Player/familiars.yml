  - type: MindExaminable
  - type: NpcFactionMember
    factions:
    - PetsNT
    - PsionicInterloper #Nyano - Summary: makes a part of the psionic faction.
  - type: Alerts
  - type: Familiar
  - type: Psionic #Nyano - Summary: Makes psionic on creation.

- type: entity
  name: Цербер
  parent: MobCorgiNarsi
  id: MobCorgiCerberus
  description: Це цуценя не корисне.
  components:
  - type: GhostRole
    makeSentient: true
    allowMovement: true
    allowSpeech: true
    name: ghost-role-information-cerberus-name
    description: ghost-role-information-cerberus-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 8
        Shadow: 7 # DeltaV - add shadow damage to relevant mobs
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - Syndicate
    - PsionicInterloper #Nyano - Summary: makes part of the psionoic faction.
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-corrupted-corgi
    interactFailureString: petting-failure-corrupted-corgi
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: Grammar
    attributes:
      gender: male
      proper: true
  - type: Tag
    tags:
    - DoorBumpOpener
    - VimPilot
  - type: Access
    tags:
    - Chapel
  - type: MindContainer
  - type: MindExaminable
  - type: Familiar
  - type: Dispellable
  - type: Psionic #Nyano - Summary: makes psionic on creation.
  - type: Vocal
    sounds:
      Male: Cerberus
      Female: Cerberus
      Unsexed: Cerberus
