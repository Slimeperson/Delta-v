- type: entity
  parent: BaseAction
  id: ActionRevertPolymorph
  name: Повернути
  description: Поверніться до початкової форми.
  components:
  #- type: ConfirmableAction # DeltaV - Don't ask for confirmation, affects Kitsune Foxes reverting
  #  popup: revert-polymorph-action-popup
  - type: InstantAction
    event: !type:RevertPolymorphActionEvent

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseActionPolymorph
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: InstantAction
    event: !type:PolymorphActionEvent

- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWizardSpider
  name: Павук Поліморф
  description: Перетворює вас на Павука.
  components:
  - type: Action
    icon:
      sprite: Mobs/Animals/spider.rsi
      state: tarantula
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WizardSpider

- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWizardRod
  name: Стрижнева форма
  description: ДЗВІН!
  components:
  - type: Action
    icon:
      sprite: Objects/Fun/immovable_rod.rsi
      state: icon
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WizardRod

- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphJaunt
  name: Ефірна прогулянка
  description: Розтопіться в Ethereal Plane, щоб швидко втекти!
  components:
  - type: Magic
  - type: Action
    useDelay: 30
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: jaunt
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: Jaunt
    # TODO: Effect ECS (from cardboard box)
  - type: ActionUpgrade
    effectedLevels:
      2: ActionPolymorphJauntII
      3: ActionPolymorphJauntIII

- type: entity
  parent: ActionPolymorphJaunt
  id: ActionPolymorphJauntII
  name: Ethereal Jaunt II
  description: Розтопіться в Ethereal Plane для ще швидшої втечі!
  components:
  - type: Action
    useDelay: 25

- type: entity
  parent: ActionPolymorphJaunt
  id: ActionPolymorphJauntIII
  name: Ethereal Jaunt III
  description: Ви вже навіть відчутні?
  components:
  - type: Action
    useDelay: 20
