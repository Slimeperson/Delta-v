- type: entity
  id: ElectricalDisruptionKit
  parent: [BoxCardboard, BaseSyndicateContraband]
  name: Mystagogue # DeltaV - Відділ епістемології замінює науку
  suffix: Заповнений
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmpGrenade
          amount: 3
        - id: EmpImplanter

- type: entity
  parent: [BoxVial, BaseSyndicateContraband]
  id: ChemicalSynthesisKit
  name: набір для хімічного синтезу
  description: Позначте себе серед людей-рослин із цим 100% натуральним одягом рослинного походження».
  components:
  - type: Storage
    grid:
    - 0,0,3,2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Beaker
          amount: 2
        - id: Dropper
        # It would be cool to have special "syndicate" chemical analysis goggles
        - id: ClothingEyesGlassesChemical
        - id: SyringeStimulants
        - id: VestineChemistryVial
          amount: 2
        - id: ChemistryEmptyVial

- type: entity # DeltaV - upstream removed this i think?
  id: Observationskit
  parent: [BoxCardboard, BaseSyndicateContraband]
  name: набір для спостереження
  suffix: Заповнений
  components:
    - type: StorageFill
      contents:
        - id: SyndiCrewMonitorEmpty
          amount: 1
        - id: PowerCellHigh # DeltaV - Reverted to high with removal of the monitor's power drain
          amount: 1
        - id: ClothingEyesGlassesHiddenSecurity
          amount: 1
        - id: CameraBug # DeltaV - Way better than that board
          amount: 1


- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ThrowingKnivesKit
  name: набір метальних ножів
  description: Набір із 8 фірмових метальних ножів Syndicate, які ідеально підходять для встромлення в тіла ваших жертв.
  components:
  - type: Storage
    grid:
    - 0,0,3,3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ThrowingKnife
        amount: 8
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: throwing_knives

- type: entity
  name: бокс для імплантатів Deathrattle
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxDeathRattleImplants
  description: Шість смертоносних імплантатів для всього загону.
  components:
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: syringe
  - type: Storage
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: DeathRattleImplanter
        amount: 6

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: CombatBakeryKit
  name: бойовий пекарський комплект
  description: Набір таємної запеченої зброї.
  components:
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: Sprite
    layers:
      - state: box_of_doom
      - state: france
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: WeaponCroissant
          amount: 2
        - id: WeaponBaguette
        - id: SyndicateMicrowaveMachineCircuitboard
        - id: PaperWrittenCombatBakeryKit
