#CREW HARDSUITS
#Atmospherics Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseEngineeringContraband]
  id: ClothingOuterHardsuitAtmos
  name: твердий комбінезон atmos
  description: Спеціальний костюм, який захищає від небезпечного середовища з низьким тиском. Має термозахист.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/atmospherics.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/atmospherics.rsi
    clothingVisuals: # Delta V - Need this for Harpies
      outerClothing:
      - state: equipped-OUTERCLOTHING
      outerClothing-harpy:
      - sprite: _DV/Clothing/OuterClothing/Hardsuits/atmospherics.rsi
        state: equipped-OUTERCLOTHING-harpy
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-vox
      outerClothing-reptilian:
      - state: equipped-OUTERCLOTHING-reptilian
      outerClothing-dog:
      - state: equipped-OUTERCLOTHING-dog
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: FireProtection
    reduction: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.8
        Radiation: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitAtmos
  - type: Tag
    tags:
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon
    - HidesHarpyWings # DeltaV: Used by harpies to help render their hardsuit sprites

