- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSurplusBundle
  name: Ящик надлишків синдикату
  description: Містить 50 телекристалів абсолютно випадкових предметів Синдикату. Це може бути непотрібний мотлох або дійсно хороший.
  components:
    - type: SurplusBundle
      totalPrice: 50
    - type: MappingCategories # DeltaV
      categories:
      - Syndicate

- type: entity
  parent: CrateSyndicate
  id: CrateCybersunJuggernautBundle
  name: Набір Cybersun Juggernaut
  suffix: Заповнений
  description: Містить усе, крім великого пістолета для відправлення поштою.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitJuggernaut
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable
  - type: MappingCategories # DeltaV
    categories:
    - Syndicate

- type: entity
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  id: CrateSyndicateSuperSurplusBundle
  name: Ящик супер надлишків Syndicate
  description: Містить 125 телекристалів абсолютно випадкових предметів Синдикату.
  components:
    - type: SurplusBundle
      totalPrice: 125
    - type: MappingCategories # DeltaV
      categories:
      - Syndicate
