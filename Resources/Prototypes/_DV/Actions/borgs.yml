- type: entity
  parent: BaseAction
  id: ActionFabricateLollipop
  name: Виготовити Lollipop
  description: аромат-основа-застарілий
  components:
  - type: Action
    icon: { sprite: _DV/Objects/Consumable/Food/candy.rsi, state: lollipop }
    useDelay: 120
  - type: InstantAction
    event: !type:FabricateCandyActionEvent
      item: FoodLollipop

- type: entity
  parent: BaseAction
  id: ActionFabricateGumball
  name: Виготовити Гамбола
  description: Виготовте гумову кульку, наповнену цукром і ліками, щоб лікувати невеликі травми.
  components:
  - type: Action
    icon: { sprite: _DV/Objects/Consumable/Food/candy.rsi, state: gumball }
    iconColor: '#FFAED7'
    useDelay: 40
  - type: InstantAction
    event: !type:FabricateCandyActionEvent
      item: FoodGumball

- type: entity
  parent: BaseMentalAction
  id: ActionOpenCartridges
  name: Відкрийте програми
  description: Перегляньте встановлене на вас програмне забезпечення
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _DV/Interface/Actions/actions_ai.rsi
      state: pda
    useDelay: 0.5
  - type: InstantAction
    event: !type:TogglePdaScreenEvent
