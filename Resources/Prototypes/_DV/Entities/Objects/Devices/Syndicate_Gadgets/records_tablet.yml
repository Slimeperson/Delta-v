  name: карта станції
  description: Відображає зчитування поточної станції.
  suffix: Планшет для записів
  components:
  - type: CharacterRecordConsole
    consoleType: Generic
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: ActivatableUI
    inHandsOnly: false
    singleUser: true
    key: enum.CharacterRecordConsoleKey.Key
  - type: UserInterface
    interfaces:
      enum.CharacterRecordConsoleKey.Key:
        type: CharacterRecordConsoleBoundUserInterface
  - type: MappingCategories
    categories:
    - Syndicate
