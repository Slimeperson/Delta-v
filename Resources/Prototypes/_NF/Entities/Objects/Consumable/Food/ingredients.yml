- type: entity
  name: сирі кавові зерна
  parent: FoodProduceBase
  id: FoodCoffeeBeansRaw
  description: Зелені кавові зерна просто чекають на обсмаження.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Edible
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 1
        - ReagentId: Theobromine # Caffeine
          Quantity: 1
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans
  - type: Tag
    tags:
    - Fruit
  - type: Construction
    graph: Coffee
    node: start
    defaultTarget: light roasted coffee
  - type: AtmosExposed # Expose the beans to atmosphere - heats and cools them
  - type: Temperature # Temperature components needed to cook the beans
    currentTemperature: 290
  - type: InternalTemperature
    thickness: 0.008 # 8mm (roughly bean sized)
    area: .2 # essentially a giant sheet of beans

- type: entity
  name: легкі обсмажені кавові зерна
  parent: FoodProduceBase
  id: FoodCoffeeBeansRoastedLight
  description: Смажені кавові зерна з корицею. Яскравий і фруктовий.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Edible
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: CoffeeGrounds
          Quantity: 5
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-light
  - type: Tag
    tags:
    - Fruit
  - type: Construction
    graph: Coffee
    node: light roasted coffee
    defaultTarget: medium roasted coffee
  - type: AtmosExposed # Expose the beans to atmosphere - heats and cools them
  - type: Temperature # Temperature components needed to cook the beans
  - type: InternalTemperature
    thickness: 0.008 # 8mm (roughly bean sized)
    area: .2 # essentially a giant sheet of beans
    conductivity: 1.5 # Arbitrarily chosen
  - type: Extractable
    grindableSolutionName: food

- type: entity
  name: кавові зерна середнього обсмаження
  parent: FoodCoffeeBeansRoastedLight
  id: FoodCoffeeBeansRoastedMedium
  description: Міська обсмажена кава в зернах. Гладкий і горіховий.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-medium
  - type: Construction
    graph: Coffee
    node: medium roasted coffee
    defaultTarget: dark roasted coffee

- type: entity
  name: темні смажені кавові зерна
  parent: FoodCoffeeBeansRoastedLight
  id: FoodCoffeeBeansRoastedDark
  description: Віденська обсмажена кава в зернах. Димно-гострий.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-dark
  - type: Construction
    graph: Coffee
    node: dark roasted coffee
    defaultTarget: null
