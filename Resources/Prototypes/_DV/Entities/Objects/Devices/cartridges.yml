- type: entity
  parent: BaseItem
  id: CrimeAssistCartridge
  name: Картридж CrimeAssist
  description: Патрон, який допомагає розпізнавати злочини та бачити відповідне покарання.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: Icon
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: UIFragment
    ui: !type:CrimeAssistUi
  - type: Cartridge
    programName: crime-assist-program-name
    icon:
      sprite: _DV/Icons/cri.rsi
      state: cri

- type: entity
  parent: BaseItem
  id: SecWatchCartridge
  name: Картридж SecWatch
  description: Картридж, який відстежує статус розшукуваних осіб.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: Icon
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: UIFragment
    ui: !type:SecWatchUi
  - type: Cartridge
    programName: sec-watch-program-name
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_on
  - type: SecWatchCartridge

- type: entity
  parent: BaseItem
  id: MailMetricsCartridge
  name: Картридж MailMetrics
  description: Картридж, який відстежує статистику доставки пошти.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-mail
  - type: StationTracker
  - type: Icon
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-mail
  - type: UIFragment
    ui: !type:MailMetricUi
  - type: MailMetricsCartridge
  - type: Cartridge
    programName: mail-metrics-program-name
    icon:
      sprite: Nyanotrasen/Objects/Specific/Mail/mail.rsi
      state: icon

- type: entity
  parent: BaseItem
  id: StockTradingCartridge
  name: Картридж StockTrading
  description: Картридж, який відстежує міжгалактичний фондовий ринок.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-stonk
  - type: Icon
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-mail
  - type: UIFragment
    ui: !type:StockTradingUi
  - type: StockTradingCartridge
  - type: Cartridge
    programName: stock-trading-program-name
    icon:
      sprite: _DV/Misc/program_icons.rsi
      state: stock_trading
  - type: AccessReader # This is so that we can restrict who can buy stocks
    access: [["Quartermaster"]] # Was Orders, should be reverted if order access is removed from cargo technicians.

- type: entity
  parent: BaseItem
  id: NanoChatCartridge
  name: Картридж NanoChat
  description: Дозволяє надсилати повідомлення іншим людям!
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/cartridge.rsi
    state: cart-chat
  - type: UIFragment
    ui: !type:NanoChatUi
  - type: NanoChatCartridge
  - type: Cartridge
    programName: nano-chat-program-name
    icon:
      sprite: _DV/Misc/program_icons.rsi
      state: nanochat
  - type: ActiveRadio
    channels:
    - Common
