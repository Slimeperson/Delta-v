#Entities found at entities/objects/specific/medical
- type: entity
  id: MedkitFilled
  suffix: Заповнений
  parent: Medkit
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
        - id: Ointment
        - id: Gauze
        - id: PillCanisterTricordrazine
        - id: PillCanisterGranibitulari # Funkychem - tricordrazine variant
      # see https://github.com/tgstation/blob/master/code/game/objects/items/storage/firstaid.dm for example contents

- type: entity
  id: MedkitBurnFilled
  suffix: Заповнений
  parent: MedkitBurn
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Ointment
          amount: 2
        - id: PillCanisterKelotane
        - id: PillCanisterDermaline

- type: entity
  id: MedkitBruteFilled
  suffix: Заповнений
  parent: MedkitBrute
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
        - id: Gauze
        - id: PillCanisterIron
        - id: PillCanisterCopper
        - id: PillCanisterBicaridine # DeltaV

- type: entity
  id: MedkitToxinFilled
  suffix: Заповнений
  parent: MedkitToxin
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SyringeIpecac
        - id: SyringeEthylredoxrazine
        - id: AntiPoisonMedipen
        - id: PillCanisterDylovene
        - id: PillCanisterCharcoal

- type: entity
  id: MedkitOxygenFilled
  suffix: Заповнений
  parent: MedkitO2
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreathMedical
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
          amount: 2 # Funkychem - more medipens in O2 kits
        - id: SyringeConvermol # Funkychem - was inaprovaline
          amount: 2
        - id: PillCanisterDexalin

- type: entity
  id: MedkitRadiationFilled
  suffix: Заповнений
  parent: MedkitRadiation
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SyringePhalanximine
        - id: RadAutoInjector
        - id: PillCanisterPotassiumIodide
        - id: PillCanisterHyronalin

- type: entity
  id: MedkitAdvancedFilled
  suffix: Заповнений
  parent: MedkitAdvanced
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        - id: Bloodpack
          amount: 2

- type: entity
  id: MedkitCombatFilled
  suffix: Заповнений
  parent: MedkitCombat
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        - id: SyringeRevivopine # Funkychem - revivopine is the dedicated combat chemical now
        - id: SyringeSaline
        - id: BruteAutoInjector
        - id: BurnAutoInjector

- type: entity
  id: StimkitFilled
  suffix: Стімкіт, Заповнений
  parent: Medkit
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: StimpackMini
        amount: 6
