## Webbing

# Weirdly the only webbing with a storage whitelist and item mapper.
# Might be worth making less common (armory only?) and removing the whitelist to eliminate the inconsistency.
- type: entity
  parent: [ClothingBeltStorageBase, ClothingSlotBase] # DeltaV - add parent ClothingSlotBase
  id: ClothingBeltSecurityWebbing
  name: установка для скрині безпеки # DeltaV - перейменовано з "носія безпеки" через уже існуючий носій пластини
  description: Унікальний і універсальний нагрудник, який може містити захисне спорядження.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Belt/securitywebbing.rsi # DeltaV - resprite
  - type: Clothing
    sprite: _DV/Clothing/Belt/securitywebbing.rsi # DeltaV - resprite
  - type: ItemSlots # DeltaV - add sidearm and radio slot
    slots:
      holster:
        name: одяг-ремінь-зброя
        whitelist:
          tags:
          - Sidearm
        insertOnInteract: false
      radio:
        name: одяг-пояс-радіо
        whitelist:
          tags:
          - Radio
        insertOnInteract: false
  - type: Storage # DeltaV - Split Inventory
    grid:
    - 0,0,2,1
    - 4,0,7,1
  - type: ItemMapper # DeltaV - add holstered sidearm sprite
    mapLayers:
      slp:
        whitelist:
          tags:
          - Sidearm
    sprite: _DV/Clothing/Belt/belt_overlay.rsi
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      holster: !type:ContainerSlot {}
      radio: !type:ContainerSlot {} # DeltaV - add radio holster
  - type: Appearance # DeltaV

