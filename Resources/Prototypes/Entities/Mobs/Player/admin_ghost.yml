- type: entity
  parent: [MobObserverBase, InventoryBase]
  id: AdminObserver
  name: адмін спостерігач
  categories: [ HideSpawnMenu ]
  components:
  - type: Eye
    visMask:
      - TelegnosticProjection
      - PsionicInvisibility
      - Ghost
      - Normal
      - CosmicCultMonument # DeltaV - Cosmic Cult
  - type: ContentEye
    maxZoom: 8.916104, 8.916104
  - type: Tag
    tags:
    - InstantDoAfters
    - CanPilot
    - BypassInteractionRangeChecks
    - BypassDropChecks
    - NoConsoleSound
    - SilentStorageUser
    - PreventAccessLogging
    - AllowBiomeLoading
    - NotGhostnadoWarpable
  - type: Input
    context: "aghost"
  - type: Ghost
    canInteract: true
  - type: GhostHearing
  - type: Hands
    hands:
      hand_right:
        location: Right
      hand_left:
        location: Left
    sortedHands:
    - hand_right
    - hand_left
  - type: ComplexInteraction
  - type: Puller
    needsHands: false
  - type: CombatMode
  - type: Physics
    bodyType: Kinematic # Admin ghosts should ignore the laws of physics.
    ignorePaused: true
  - type: Access
    groups:
    - AllAccess
    - Silicon
    tags:
    - NuclearOperative
    - SyndicateAgent
    - CentralCommand
  - type: UserInterface
    interfaces:
      enum.SolarControlConsoleUiKey.Key:
        type: SolarControlConsoleBoundUserInterface
      enum.CommunicationsConsoleUiKey.Key:
        type: CommunicationsConsoleBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CargoConsoleUiKey.Orders:
        type: CargoOrderConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
      # Begin CD - Character Records
      enum.CharacterRecordConsoleKey.Key:
        type: CharacterRecordConsoleBoundUserInterface
      # End CD - Character Records
      enum.GeneralStationRecordConsoleKey.Key:
      # who the fuck named this bruh
        type: GeneralStationRecordConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.SolarControlConsoleUiKey.Key:
        toggleAction: ActionAGhostShowSolar
      enum.CommunicationsConsoleUiKey.Key:
        toggleAction: ActionAGhostShowCommunications
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.CargoConsoleUiKey.Orders:
        toggleAction: ActionAGhostShowCargo
      enum.CrewMonitoringUIKey.Key:
        toggleAction: ActionAGhostShowCrewMonitoring
      enum.GeneralStationRecordConsoleKey.Key:
        toggleAction: ActionAGhostShowStationRecords
      # Begin CD - Character Records
      enum.CharacterRecordConsoleKey.Key:
        toggleAction: ActionAGhostShowCharacterRecords
      # End CD - Character Records
  - type: SolarControlConsole # look ma i AM the computer!
  - type: CommunicationsConsole
    title: comms-console-announcement-title-centcom
    color: "#1d8bad"
    delay: 10
    initialDelay: 0
    global: true
  - type: RadarConsole
    followEntity: true
  - type: CargoOrderConsole
  - type: CrewMonitoringConsole
    alertsEnabled: false # DeltaV - crew monitors beeping is specific to deltaV, and we don't want it for aghost.
  - type: GeneralStationRecordConsole
    canDeleteEntries: true
  # Begin CD - Character Records
  - type: CharacterRecordConsole
    consoleType: Admin
  - type: CriminalRecordsConsole
  # End CD - Character Records
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
    transmitFrequencyId: ShuttleTimer
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: Thieving
    stripTimeReduction: 9999
    stealthy: true
  - type: Stripping
  - type: SolutionScanner
  - type: IgnoreUIRange
  - type: ShowAntagIcons
  - type: ShowContrabandDetails
  - type: Inventory
    templateId: aghost
  - type: Loadout
    prototypes: [ MobAghostGear ]
  - type: BypassInteractionChecks
  - type: ExplosionResistance
    damageCoefficient: 0

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseAGhostAction
  components:
  - type: Action
    icon: { sprite: Structures/Machines/parts.rsi, state: box_0 }
    iconOn: { sprite: Structures/Machines/parts.rsi, state: box_2 }
    keywords: [ "AI", "console", "interface" ]
    priority: -10

- type: entity
  parent: BaseAGhostAction
  id: ActionAGhostShowSolar
  name: Інтерфейс керування сонячною енергією
  description: Переглянути інтерфейс керування сонячною енергією.
  components:
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.SolarControlConsoleUiKey.Key }

