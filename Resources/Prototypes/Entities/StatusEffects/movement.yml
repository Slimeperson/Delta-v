- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectSlowdown
  abstract: true
  name: сповільнення
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
    blacklist:
      tags:
      - SlowImmune
  - type: MovementModStatusEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectSpeed
  abstract: true
  name: швидкість
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
  - type: MovementModStatusEffect

- type: entity
  parent: StatusEffectSpeed
  id: ReagentSpeedStatusEffect
  name: швидкість реагенту

- type: entity
  parent: StatusEffectSlowdown
  id: VomitingSlowdownStatusEffect
  name: уповільнення блювоти

- type: entity
  parent: StatusEffectSlowdown
  id: TaserSlowdownStatusEffect
  name: постріл уповільнення електрошокера

- type: entity
  parent: StatusEffectSlowdown
  id: FlashSlowdownStatusEffect
  name: впливає уповільнення спалаху

- type: entity
  parent: StatusEffectSlowdown
  id: StatusEffectStaminaLow
  name: витривалість низька

# Makes you more slippery, or perhaps less slippery.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectFriction
  name: тертя
  components:
  - type: FrictionStatusEffect

# Stunnable Status Effect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectStunned
  name: приголомшений
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
    blacklist:
      tags:
      - StunImmune
  - type: StatusEffectAlert
    alert: Stun
  - type: StunnedStatusEffect
