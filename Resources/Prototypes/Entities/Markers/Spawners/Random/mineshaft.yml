- type: entity
  id: RandomWoodenSupport
  name: дерев'яна опора нерестовик
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/mines.rsi
        state: support
  - type: RandomSpawner
    prototypes:
      - WoodenSupport
      - WoodenSupportBeam
      - WoodenSupportBeam
      - WoodenSupportBeam
    chance: 0.9

- type: entity
  id: RandomWoodenWall
  name: дерев'яний настінний спаунер
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/mines.rsi
        state: support_wall
  - type: RandomSpawner
    prototypes:
      - WoodenSupportWall
      - WoodenSupportWallBroken
    chance: 0.9

- type: entity
  id: RandomStalagmiteOrCrystal
  name: сталагмітовий або кристалічний спаунер
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/Flora/flora_stalagmite.rsi
        state: stalagmite2
  - type: RandomSpawner
    offset: 0.3
    prototypes:
      - RandomBrownStalagmite
      - RandomGreyStalagmite
      - CrystalSpawner
    chance: 0.9

