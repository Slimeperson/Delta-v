- type: entity
  id: BaseXenoArtifact
  parent: BaseMob # we use this since it can technically get inhabited
  name: артефакт
  description: Дивний артефакт невідомих часів. Здається, добре провести час.
  abstract: true
  noSpawn: true
  components:
  # Visual
  - type: Appearance
  - type: InteractionOutline
  - type: UserInterface #needs to be here for certain effects
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  - type: GuideHelp
    guides:
    - Xenoarchaeology
  # gameplay interactions
  - type: XenoArtifact
    effectsTable: !type:NestedSelector
      tableId: XenoArtifactEffectsDefaultTable
  - type: Damageable
  - type: Actions
  - type: Physics
    bodyType: KinematicController
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.25
    baseSprintSpeed: 0.5
  - type: UseDelay
  - type: StealTarget
    stealGroup: XenoArtifact
  - type: ContainerContainer
    containers:
      node-container: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: Psionic # DeltaV - sentient artifacts are psionic
  # These components are needed for certain triggers to work.
  - type: PsionicPowerDetector # DeltaV - Required for PsionicPowerUsage Trigger.
  - type: RadiationReceiver
    selfSourceMultiplier: 0.1 # DeltaV - a radiation effect triggering a radiation trigger on the same artifact is often annoying
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch]

- type: entity
  id: ActionSentientArtifactActivate
  name: Активувати артефакт
  description: Активізуйте себе, викликаючи хаос у тих, хто поруч.
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano29
    useDelay: 300
  - type: InstantAction
    event: !type:ArtifactSelfActivateEvent

- type: entity
  id: SimpleXenoArtifact
  parent: ComplexXenoArtifact
  name: "Простий артефакт"
  description: "Простий заповнювач артефакту Xeno."
  components: []

- type: entity
  id: MediumXenoArtifact
  parent: ComplexXenoArtifact
  name: "Середній артефакт"
  description: "Заповнювач артефакту середнього розміру."
  components: []

- type: entity
  id: SimpleXenoArtifactItem
  parent: ComplexXenoArtifactItem
  name: "Простий предмет артефакту"
  description: "Простий заповнювач елемента артефакту."
  components: []

- type: entity
  id: MediumXenoArtifactItem
  parent: ComplexXenoArtifactItem
  name: "Середній предмет артефакту"
  description: "Заповнювач елемента артефакту середнього розміру."
  components: []

- type: entity
  id: VariedXenoArtifactItem
  parent: ComplexXenoArtifactItem
  name: "Різноманітний предмет артефакту"
  description: "Різноманітний заповнювач артефакту."
  components: []
