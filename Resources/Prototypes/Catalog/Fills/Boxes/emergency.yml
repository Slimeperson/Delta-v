- type: entity
  parent: BoxCardboard
  id: BoxSurvival
  name: ящик для виживання
  description: Це коробка з основними внутрішніми елементами всередині.
  suffix: Стандартний
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: SpaceMedipen # DeltaV - keep spacepen
        - id: Flare
        - id: FoodPSB # DeltaV - replace nutribrick with PSB
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank

- type: entity
  parent: BoxSurvival
  id: BoxSurvivalNitrogen
  suffix: Стандарт N2
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyNitrogenTankFilled
        - id: EmergencyMedipen
        - id: SpaceMedipen # DeltaV - keep spacepen
        - id: Flare
        - id: FoodPSB # DeltaV - replace nutribrick with PSB
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: nitrogentank
  - type: Label
    currentLabel: reagent-name-nitrogen

