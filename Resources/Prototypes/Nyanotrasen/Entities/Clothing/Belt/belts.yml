- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltMantis
  name: пояс псіонічного богомола # DeltaV — перейменуйте Forensic Mantis у Psionic Mantis
  description: Ідеально підходить для зберігання всього вашого обладнання.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Belt/mantis_belt.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Belt/mantis_belt.rsi
  - type: Storage
    whitelist:
      tags:
        - Document
        - Flashlight
        - ForensicBeltEquip
        - HandLabeler
        - Sidearm
        - Folder

- type: entity
  parent: ClothingBeltBase
  id: ClothingBeltMartialBlack
  name: чорний пояс
  description: Це самий бойовий з усіх поясів.
  components:
  - type: MeleeWeapon
    attackRate: 1.25
    range: 1.65
    damage:
      types:
        Blunt: 1
        Slash: 1
  - type: Item
    size: Small
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Belt/Martial/black.rsi
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Belt/Martial/black.rsi

- type: entity
  parent: ClothingBeltBase # DeltaV - reparent from ClothingBeltStorageBase
  id: ClothingBeltKatanaSheath
  name: піхви катани
  description: Декорований пояс, призначений для пари самурайських клинків, або дайсьо.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Clothing/Belt/katanasheath.rsi
    state: sheath
  - type: Clothing
    sprite: Nyanotrasen/Clothing/Belt/katanasheath.rsi
  - type: ItemSlots # DeltaV - adjust how objects are stored
    slots:
      katanaslot:
        name: одяг-пояс-катана
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - Katana
        priority: 2
      wakizashislot:
        name: одяг-ремінь-вакідзасі
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - Wakizashi
        priority: 1
  - type: ItemMapper # DeltaV - adjust how stored objects are displayed
    mapLayers:
      katana:
        whitelist:
          tags:
          - Katana
      wakizashi:
        whitelist:
          tags:
          - Wakizashi
    sprite: _DV/Clothing/Belt/belt_overlay.rsi
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      katanaslot: !type:ContainerSlot {}
      wakizashislot: !type:ContainerSlot {}
  - type: Appearance
  - type: Tag
    tags:
      - BeltSlotNotBelt

- type: entity
  parent: [ClothingBeltStorageBase, ClothingSlotBase] # DeltaV - add parent ClothingSlotBase
  id: ClothingBeltMilitaryWebbingCMO
  name: нагрудна установка головного медичного лікаря
  description: Медична нагрудна установка з глибокими кишенями для парамедиків і медичних працівників.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Belt/cmowebbing.rsi # DeltaV - resprite
  - type: Clothing
    sprite: _DV/Clothing/Belt/cmowebbing.rsi # DeltaV - resprite
  - type: Item
    size: Large
  - type: ItemSlots # DeltaV - add medkit slot
    slots:
      medkit:
        name: одяг-пояс-аптечка
        whitelist:
          tags:
          - Medkit
        insertOnInteract: false # or you can't easily stow medkits in your rig.
  - type: Storage
    maxItemSize: Normal
    grid: # DeltaV - Make the grid smaller
    - 0,0,2,1
    - 4,0,7,1
  - type: ItemMapper # DeltaV - add stowed medkit sprite
    mapLayers:
      medkit:
        whitelist:
          tags:
          - Medkit
    sprite: _DV/Clothing/Belt/belt_overlay.rsi
  - type: Tag
    tags:
      - BeltSlotNotBelt
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      medkit: !type:ContainerSlot {}
  - type: Appearance # DeltaV
