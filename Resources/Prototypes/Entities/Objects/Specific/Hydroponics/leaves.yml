  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tea_plant.rsi
  - type: Produce
    seedId: teaPlant
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Vitamin
          Quantity: 2

- type: entity
  name: Розширений інженерний модуль, що містить найсучасніші інструменти.
