# generic modules
- type: entity
  id: BorgModuleCable
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: кабельний модуль кіборг
  description: Універсальний модуль-кіборг, який дозволяє установці та маніпуляції електричними системами.
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-cables
  - type: ItemBorgModule
    hands:
    - item: CableApcStack10
      hand:
        emptyRepresentative: CableApcStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: CableMVStack10
      hand:
        emptyRepresentative: CableMVStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: CableHVStack10
      hand:
        emptyRepresentative: CableHVStack10
        emptyLabel: borg-slot-cables-empty
        whitelist:
          tags:
          - CableCoil
    - item: Wirecutter
    - item: Crowbar
    - item: trayScanner
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: wire-module }

- type: entity
  id: BorgModuleArtistry
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: модуль артистизм кіборг
  description: Модуль для мистецтв і ремесел, поки станція горить!
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-artistry
  - type: ItemBorgModule
    hands:
    - item: SprayPainterBorg
    - item: CrayonBorg
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: artistry-module }

- type: entity
  id: BorgModuleFireExtinguisher
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: рушійний кіборг-модуль
  description: NT доручила команді розробити реактивний ранець для загонів кіборгів, але у них закінчилося фінансування, і вони просто зробили більший вогнегасник. Однак він поставляється з вбудованим GPS і сканером маси!
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-fire-extinguisher
  - type: ItemBorgModule
    hands:
    - item: BorgFireExtinguisher
    - item: BorgHandheldGPSBasic
    - item: HandheldStationMapUnpowered
    - item: HandHeldMassScannerBorg
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: extinguisher-module }

- type: entity
  id: BorgModuleTool
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: Інструмент кіборг модуль
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: ItemBorgModule
    hands:
    - item: Crowbar
    - item: Wrench
    - item: Screwdriver
    - item: Wirecutter
    - item: WelderIndustrial
    - item: Multitool
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: tool-module }

- type: entity
  id: BorgModuleInflatable
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: надувний модуль кіборг
  components:
  - type: Sprite
    layers:
    - state: generic
