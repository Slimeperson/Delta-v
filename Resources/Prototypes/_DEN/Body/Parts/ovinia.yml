- type: entity
  id: PartOvinia
  parent: [BaseItem, BasePart]
  name: "частина тіла ovinia"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoOvinia
  name: "тулуб яйцеклітини"
  parent: [PartOvinia, BaseTorso]
  components:
  - type: Sprite
    sprite: _DEN/Mobs/Species/Ovinia/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  categories: [ HideSpawnMenu ]

- type: entity
  id: HeadOvinia
  name: "Песто — популярна начинка для піци для молі, цілком можливо, тому що вона є прикладом їхніх улюблених смаків; сир, зелень і овочі.
  parent: [PartOvinia, BaseHead]
  components:
  - type: Sprite
    sprite: _DEN/Mobs/Species/Ovinia/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10
  categories: [ HideSpawnMenu ]

