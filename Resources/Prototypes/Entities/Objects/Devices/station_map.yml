- type: entity
  parent: BaseItem
  id: BaseHandheldStationMap
  name: карта станції
  description: Відображає зчитування поточної станції.
  abstract: true
  components:
    - type: StationMap
    - type: Sprite
      sprite: Objects/Devices/tablets.rsi
      layers:
        - state: tablet
        - state: generic
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      key: enum.StationMapUiKey.Key
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: UserInterface
      interfaces:
        enum.StationMapUiKey.Key:
          type: StationMapBoundUserInterface

- type: entity
  id: HandheldStationMap
  parent:
  - BaseHandheldStationMap
  - BaseHandheldComputer
  suffix: Портативний

- type: entity
  id: HandheldStationMapEmpty
  parent: HandheldStationMap
  suffix: Ручний, порожній
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  id: HandheldStationMapUnpowered
  parent: BaseHandheldStationMap
  suffix: Портативний, постійно живиться

- type: entity
  parent: HandheldStationMap
  id: HandheldStationMapStatic
  suffix: Ручний, працює поза станцією
  components:
  - type: StationMap
    initializeWithStation: true

- type: entity
  parent: HandheldStationMap
  id: HandheldStationMapNukeops
  name: карта цільової станції
  suffix: Портативний пристрій, NukeOps
  description: Відображає зчитування цільової станції.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: syndie
      shader: unshaded
  - type: Item
    sprite: Objects/Devices/tablets.rsi
    inhandVisuals:
      left:
      - state: inhand-left-syndie
      right:
      - state: inhand-right-syndie
  - type: StationMap
    showLocation: false
    initializeWithStation: true
  - type: NukeopsStationMap

