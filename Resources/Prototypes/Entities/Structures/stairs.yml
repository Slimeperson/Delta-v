- type: entity
  abstract: true
  id: BaseFloorDecoration
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    drawdepth: FloorTiles

- type: entity
  id: Stairs
  parent: BaseFloorDecoration
  name: сходи
  suffix: сталь
  description: Найбільший винахід після реактивних гранат.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: _DV/Structures/stairs.rsi # Delta V - Resprite stairs
    state: stairs_steel
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: StairStage
  parent: Stairs
  suffix: Сталь, етап
  components:
  - type: Sprite
    sprite: _DV/Structures/stairs.rsi # Delta V - Resprite stairs
    state: stairs_stage_steel
    drawdepth: FloorTiles

