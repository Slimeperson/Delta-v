- type: entity
  parent: BaseAction
  id: ActionCosmicSiphon
  name: Сифонна ентропія
  description: Тихо висмоктуйте ентропію з вашої цілі.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicSiphon {}

- type: entity
  parent: BaseAction
  id: ActionCosmicBlank
  name: Шунт суб'єктивності
  description: Витягніть розум вашої цілі з її тіла в космічну темряву, тимчасово зробивши її тіло безглуздим.
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: blank
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - CosmicCult
      - BibleUser
    event: !type:EventCosmicBlank {}

- type: entity
  parent: BaseAction
  id: ActionCosmicPlaceMonument
  name: Манить пам'ятник
  description: Викличте Пам'ятник у реальний простір. Тримайте його прихованим і безпечним від некультистів!
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument
  - type: ConfirmableAction
    popup: cosmicability-monument-spawn-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicPlaceMonument {}
  - type: MonumentPlacementPreview
    tier: 1

- type: entity
  parent: BaseAction
  id: ActionCosmicMoveMonument
  name: Перенести пам'ятник
  description: Твоя робота обов'язкова, а кінець неминучий. Переконайтеся, що це завершено під вашим наглядом.
  components:
  - type: Action
    useDelay: 999
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: monument-relocate
  - type: ConfirmableAction
    popup: cosmicability-monument-move-confirm
    primeTime: 10 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicMoveMonument
  - type: MonumentPlacementPreview
    tier: 2

- type: entity
  parent: BaseAction
  id: ActionCosmicReturn
  name: Повернення
  description: Розвійте свою астральну проекцію та поверніться у своє тіло.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 0
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: return
  - type: InstantAction
    event: !type:EventCosmicReturn {}

- type: entity
  parent: BaseAction
  id: ActionCosmicLapse
  name: Аберантний пропуск
  description: Втрачає тілесну форму вашої цілі, тимчасово роблячи її незмінною, непрохідною та застиглою на місці.
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - BibleUser
    event: !type:EventCosmicLapse {}

- type: entity
  parent: BaseAction
  id: ActionCosmicGlare
  name: Нульовий відблиск
  description: Випромінюйте жахливий імпульс космічного світла, сповільнюючи та дезорієнтуючи всіх навколо. Його ефекти посилюються проти кремнієвих сутностей.
  components:
  - type: Action
    useDelay: 60
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: glare
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 5 #increased to give you more time to figure out where you want to put it
  - type: InstantAction
    event: !type:EventCosmicGlare {}

- type: entity
  parent: BaseAction
  id: ActionCosmicIngress
  name: Силовий вхід
  description: Використовуйте зосереджений вибух сили, щоб змусити відкрити двері.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
        - Door
    event: !type:EventCosmicIngress {}

- type: entity
  parent: BaseAction
  id: ActionCosmicImposition
  name: Вакуумне накладання
  description: Ви на короткий час нівелюєте будь-яку вхідну шкоду.
  components:
  - type: Action
    useDelay: 80
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition {}

- type: entity
  parent: BaseAction
  id: ActionCosmicNova
  name: Астральна Нова
  description: Киньте великий і руйнівний вибух астральної енергії.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: nova
  - type: TargetAction
    range: 6000 # You're just picking a direction anyways
  - type: WorldTargetAction
    event: !type:EventCosmicNova {}

- type: entity
  parent: BaseAction
  id: ActionCosmicFragmentation
  name: Нульова фрагментація
  description: Перенесіть свої злоякісні можливості в цифрову систему, таку як AI Upload Console або Cyborg, пошкодивши її в процесі. Роблячи це, ви витратите свої можливості.
  components:
  - type: Action
    useDelay: 25
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - SiliconLawUpdater
    event: !type:EventCosmicFragmentation {}
  - type: LimitedCharges
    maxCharges: 1

## COLOSSUS ACTIONS

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusSunder
  name: Ентропійний розкол
  description: Деформуйтеся до цільового місця та випустіть каскадну детонацію шкідливої ​​енергії.
  components:
  - type: Action
    useDelay: 18
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi
      state: sunder
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder

- type: entity
  parent: BaseAction
  id: ActionCosmicColossusIngress
  name: Колосальний інгрес
