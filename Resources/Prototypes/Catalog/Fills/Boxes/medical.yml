- type: entity
  name: шприц коробка
  parent: BoxCardboard
  id: BoxSyringe
  description: Коробка, повна шприців.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Syringe
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: syringe

- type: entity
  name: коробка для таблеток
  parent: BoxCardboard
  id: BoxPillCanister
  description: Коробка, повна каністр з таблетками.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PillCanister
        amount: 9
  - type: Sprite
    layers:
      - state: box
      - state: pillbox

- type: entity
  name: коробка для пляшок
  parent: BoxCardboard
  id: BoxBottle
  description: Ящик, повний пляшок.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ChemistryEmptyBottle01
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: bottle

- type: entity
  name: коробка стерильної маски
  parent: BoxCardboard
  id: BoxSterileMask
  description: У коробці знаходяться стерильні медичні маски.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingMaskSterile
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: sterile

- type: entity
  name: ящик для латексних рукавичок
  parent: BoxCardboard
  id: BoxLatexGloves
  description: Містить стерильні латексні рукавички.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingHandsGlovesLatex
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: latex

- type: entity
  name: нітриловий бардачок
  parent: BoxCardboard
  id: BoxNitrileGloves
  description: Містить стерильні нітрилові рукавички. Краще ніж латекс.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ClothingHandsGlovesNitrile
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: nitrile

- type: entity
  name: ящик для сумки для тіла
  parent: BoxCardboard
  id: BoxBodyBag
  description: Містить мішки для тіла.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: BodyBagFolded
        amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: bodybags
  - type: Storage # TODO cardboard boxes shouldn't have whitelisting
    whitelist:
      tags:
        - BodyBag

- type: entity
  name: флаконна коробка
  parent: BoxCardboard
  id: BoxVial
  description: Коробка, повна флаконів.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ChemistryEmptyVial
          amount: 3
        - id: ChemistryEmptyVialSmall
        rolls: 2 # group the small vials on the right column
  - type: Sprite
    layers:
      - state: box
      - state: vials
