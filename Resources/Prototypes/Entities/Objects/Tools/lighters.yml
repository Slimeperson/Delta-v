    sprite: Objects/Tools/Lighters/donkco.rsi
  - type: Item
    sprite: Objects/Tools/Lighters/donkco.rsi
  - type: Welder #
    fuelConsumption: 0.02
    fuelLitCost: 0.1
    tankSafe: true
  - type: Tag
    tags:
    - DonkPocket
    - Meat
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 12
        maxVol: 12
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Omnizine
          Quantity: 10
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: ComponentToggler
    components:
    - type: Edible # This shouldn't be component toggler, but doesn't work when it's not
  - type: PointLight
    enabled: false
    netsync: false
    radius: 2
    color: orange
