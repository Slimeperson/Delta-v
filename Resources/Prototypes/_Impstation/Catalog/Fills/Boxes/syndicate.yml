- type: entity
  parent: BoxCardboard
  id: LeviathanExplosiveRocketBox
  name: Ракетна коробка Левіафан (вибухівка)
  description: 4 ракети високої руйнівної сили, що зберігаються в надто крихкому контейнері.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CartridgeBazookaExp
        amount: 4
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: writing_of_doom

- type: entity
  parent: LeviathanExplosiveRocketBox
  id: LeviathanIncendiaryRocketBox
  name: Ракетний ящик Левіафан (запалювальний)
  description: 4 ракети, наповнені легкозаймистим паливом, зберігаються в надто крихкому контейнері.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CartridgeBazookaInc
        amount: 4
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: writing_of_doom

- type: entity
  parent: LeviathanExplosiveRocketBox
  id: LeviathanConcussionRocketBox
  name: Ракетна коробка Левіафан (струсна)
  description: 4 вольфрамові снаряди, що зберігаються в неміцному контейнері. Таке відчуття, ніби через дно вирветься.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CartridgeBazookaCon
        amount: 4
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: writing_of_doom

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: AdderBox
  name: Коробка суматора
  description: Сучасний плазмовий пістолет із двома каністрами запатентованого палива.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: WeaponPlasmaAdder
        - id: EchionCanister
          amount: 2
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: writing_of_doom
