- type: entity
  parent: [ClothingBeltStorageBase, ContentsExplosionResistanceBase, BaseSecurityContraband, ClothingSlotBase] # DeltaV - add ClothingSlotBase
  id: ClothingBeltSecurity
  name: ремінь безпеки
  description: Може тримати засоби безпеки, такі як наручники та спалахи.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Belt/security.rsi # DeltaV - resprite
  - type: Clothing
    sprite: _DV/Clothing/Belt/security.rsi # DeltaV - resprite
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Storage
    whitelist:
      tags:
      - CigPack
      - Taser
      - SecBeltEquip
      - Radio
      - Sidearm
      - MagazinePistol
      - MagazineMagnum
      - CombatKnife
      - Truncheon
      - HandGrenade
      components:
      - Stunbaton
      - FlashOnTrigger
      - SmokeOnTrigger
      - Flash
      - Handcuff
      - BallisticAmmoProvider
      - CartridgeAmmo
      - DoorRemote
      - Whistle
      - BalloonPopper
  - type: ItemMapper # DeltaV - Custom sprite and item mapper
    sprite: _DV/Clothing/Belt/belt_overlay.rsi 
    mapLayers:
      baton:
        whitelist:
          components:
          - Stunbaton
      gasgrenade:
        whitelist:
          components:
          - FlashOnTrigger
      slp:
        whitelist:
          tags:
          - Sidearm
  - type: ContainerContainer # DeltaV
    containers:
      storagebase: !type:Container
        ents: []
      holster: !type:ContainerSlot {}
      radio: !type:ContainerSlot {}
  - type: ItemSlots # DeltaV - add sidearm and radio slot
    slots:
      holster:
        name: одяг-ремінь-зброя
        whitelist:
          tags:
          - Sidearm
        insertOnInteract: false
      radio:
        name: одяг-пояс-радіо
        whitelist:
          tags:
          - Radio
        insertOnInteract: false
  - type: Appearance
