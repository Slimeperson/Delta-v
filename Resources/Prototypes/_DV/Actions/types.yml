- type: entity
  parent: BaseAction
  id: ActionOpenRadioImplant
  name: Відкритий радіоімплант
  description: Відкриває відсік для ключа bluespace радіоімплантату, вбудованого у ваш череп.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Clothing/Ears/Headsets/base.rsi
      state: icon
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

- type: entity
  parent: BaseAction
  id: ActionOpenMouthStorage
  name: Зберігання відкритих щік
  description: Дозволяє зберігати предмети в щоках.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    icon: _DV/Interface/Actions/mouthStorageOpen.png
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

- type: entity
  parent: BaseAction
  id: ActionToggleSneakMode
  name: Увімкнути режим скритності
  description: Прокрастися під столи.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 3
    # L5 - toggle icon
    icon:
      sprite: _L5/Actions/sneak.rsi
      state: sneak
    iconOn:
      sprite: _L5/Actions/sneak.rsi
      state: stand
    # end L5 - toggle icon
  - type: InstantAction
    event: !type:ToggleCrawlingStateEvent

- type: entity
  parent: BaseAction
  id: ActionChitzite
  name: Відкашлюйте чицит
  description: Очистіть своє тіло від надлишку радіації та отримайте прохолодний небезпечний камінь.
  components:
  - type: Action
    enabled: false
    icon: { sprite: _DV/Objects/Specific/Species/chitinid.rsi, state: chitzite }
    useDelay: 300
  - type: InstantAction
    event: !type:CoughItemActionEvent

- type: entity
  id: ActionHairball
  name: Відкашлюйте кулю волосся
  description: Очистіть частину свого хімічного потоку та отримайте круту кулю волосся, щоб кидати її в людей.
  components:
  - type: Action
    icon:
      sprite: Nyanotrasen/Objects/Specific/Species/felinid.rsi
      state: icon
    useDelay: 30
  - type: InstantAction
    event: !type:CoughItemActionEvent

- type: entity
  parent: BaseToggleAction
  id: ActionToggleBipod
  name: Встановіть свою сошку
  description: Підвищте точність і скорострільність своєї вогнепальної зброї.
  components:
  - type: Action
    icon: { sprite: _DV/Objects/Weapons/Guns/LMGs/NT-3.rsi, state: bipod-off }
    iconOn: { sprite: _DV/Objects/Weapons/Guns/LMGs/NT-3.rsi, state: bipod-on }
