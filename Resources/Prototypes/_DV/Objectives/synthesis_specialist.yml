- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseSynthesisObjective
  components:
  - type: Objective
    difficulty: 0 # difficulty is unused
  - type: RoleRequirement
    roles:
    - SynthesisRole

- type: entity
  parent: [BaseSynthesisObjective, BaseSurviveObjective]
  id: SynthesisSurviveObjective
  description: Виживіть, щоб розпродати свої товари ще один день!
  name: Вижити і процвітати
  components:
  - type: Objective
    icon:
      sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
      state: icon

- type: entity
  parent: [BaseSynthesisObjective, BaseSurviveObjective]
  id: SynthesisPrescribeObjective
  description: Розкрадати або витрачати кошти будь-якого відділу.
  name: Прибуток і синтез
  components:
  - type: Objective
    icon:
      sprite: Objects/Specific/Chemistry/chem_bag.rsi
      state: icon
