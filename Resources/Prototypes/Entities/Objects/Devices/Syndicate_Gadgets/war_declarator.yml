- type: entity
  parent: [BaseItem, BaseSyndicateContraband ]
  id: NukeOpsDeclarationOfWar
  name: оголошувач війни
  description: Використовуйте, щоб надіслати оголошення про військові дії цілі, затримуючи відправлення вашого шатла, поки вони готуються до вашого нападу. Такий нахабний крок приверне увагу могутніх благодійників у Синдикаті, які забезпечать вашу команду величезною кількістю бонусних телекристалів. Потрібно використовувати на початку місії, інакше ваші благодійники втратять інтерес.
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: Item
    - type: UseDelay
      delay: 0.5
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      requireActiveHand: false
      key: enum.WarDeclaratorUiKey.Key
    - type: UserInterface
      interfaces:
        enum.WarDeclaratorUiKey.Key:
          type: WarDeclaratorBoundUserInterface
    - type: WarDeclarator
      message: war-declarator-default-message
      sound: /Audio/Announcements/war.ogg
    - type: AccessReader
      access: [["NuclearOperative"]]
