- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: Закрити кістки
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    remove:
    - type: RibcageOpen
    duration: 4 # DeltaV: was 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor
  - type: SurgeryDamageChangeEffect # DeltaV: Reverse damage from SurgeryStepOpenBones
    damage:
      types:
        Blunt: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendRibcage
  name: Виправити грудну клітку
  components:
  - type: SurgeryStep
    tool:
    - type: BoneGel
    remove:
    - type: RibcageSawed
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel
  - type: SurgeryDamageChangeEffect # DeltaV: Reverse damage from SurgeryStepSawBones
    damage:
      types:
        Slash: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: Закритий розріз
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    # This surgery removes a bunch of components that might be leftover from other surgeries in unintended cases.
    # Essentially a bit of a fallback for endusers :)
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: BodyPartReattached
    - type: InternalBleedersClamped
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Slash: -5 # DeltaV: Cauterizing closes incisions, not grafting skin
    sleepModifier: 2
  - type: SurgeryStepEmoteEffect

# Feature Insertion

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertFeature
  name: Вставити частину
  components:
  - type: SurgeryStep
    tool:
    - type: BodyPart
    duration: 6
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryAddPartStep
  - type: SurgeryStepDirtiness # DeltaV - surgery cross contamination
    toolDirtiness: 7.5
    gloveDirtiness: 7.5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealWounds
  name: Ущільнення ран
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: InternalBleedersClamped
    duration: 2
  - type: SurgeryAffixPartStep
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Slash: -5 # DeltaV: Cauterizing closes incisions, not grafting skin
    sleepModifier: 2

# Feature Removal

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawFeature
  name: Пиляти кістки
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: BodyPartSawed
    duration: 4
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect # DeltaV
    damage:
      types:
        Slash: 5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampInternalBleeders
  name: Затисніть внутрішні кровопускачі
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: InternalBleedersClamped
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveFeature
  name: Ампутувати частину
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    remove:
    # We remove these components to force people to go through all the steps again lol, otherwise you can just keep chopping.
    - type: SkinRetracted
    - type: BleedersClamped
    - type: InternalBleedersClamped
    - type: IncisionOpen
    duration: 8
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryRemovePartStep
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect # DeltaV: Traumatic amputation is traumatic
    sleepModifier: 0.25
    damage:
      types:
        Slash: 30
  - type: SurgeryStepDirtiness # DeltaV - surgery cross contamination
    toolDirtiness: 7.5
    gloveDirtiness: 7.5

# Tend Wounds

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCarefulIncisionScalpel
  name: Зробіть акуратний надріз
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 3
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect # DeltaV
    sleepModifier: 0
    damage:
      types:
        Slash: 4

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBruteTissue
  name: Відновлення пошкодженої тканини
  components:
  - type: SurgeryStep
    tool:
    - type: Tending
    duration: 2 # DeltaV: was 1
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryTendWoundsEffect
    damage:
      groups:
        Brute: -5
  - type: SurgeryRepeatableStep
  - type: SurgeryStepDirtiness # DeltaV - surgery cross contamination
    toolDirtiness: 0.5
    gloveDirtiness: 0.5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBurnTissue
  name: морська плитка повна
  components:
  - type: SurgeryStep
    tool:
    - type: Tending
    duration: 2 # DeltaV: was 1
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryTendWoundsEffect
    mainGroup: Burn
    damage:
      groups:
        Burn: -5
  - type: SurgeryDamageChangeEffect # DeltaV
    damage:
      types:
        Slash: 1
  - type: SurgeryRepeatableStep
  - type: SurgeryStepDirtiness # DeltaV - surgery cross contamination
    toolDirtiness: 0.5
    gloveDirtiness: 0.5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealTendWound
  name: Заклеїти рану
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Slash: -1 # DeltaV: Cauterizing closes incisions, not grafting skin
    sleepModifier: 2
  - type: SurgeryStepEmoteEffect

# Cavity Implanting

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertItem
  name: Вставте предмет в порожнину
  components:
  - type: SurgeryStep
    duration: 4
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryStepCavityEffect
    action: Insert
  - type: SurgeryStepEmoteEffect
  - type: SurgeryDamageChangeEffect # DeltaV
    sleepModifier: 0.25 # Highly invasive, huge damage if the patient is wriggling around
    damage:
      types:
        Blunt: 40

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveItem
  name: Вийміть предмет із порожнини
  components:
  - type: SurgeryStep
    duration: 4
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryStepCavityEffect
    action: Remove
  - type: SurgeryStepEmoteEffect

# Organ Manipulation

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveOrgan
  name: Видаліть орган
  components:
