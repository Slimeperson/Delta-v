- type: entity
  abstract: true
  parent: FoodBase
  id: FoodCandyBase
  components:
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/candy.rsi
  - type: Appearance
  - type: RandomizedCandy

- type: entity
  parent: FoodCandyBase
  id: FoodLollipop
  name: льодяник
  description: За такий хороший спорт! Він збагачений сильнодіючими, але переважно безпечними для вживання ліками.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 17 # 2 extra
        reagents:
        - ReagentId: Sugar
          Quantity: 3
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Omnizine
          Quantity: 3
        - ReagentId: Iron
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 3
  - type: Sprite
    layers:
    - state: lollipop-ball
      map: [ "enum.CandyVisualLayers.Ball" ]
    - state: lollipop-stickandshine
  - type: Clothing
    sprite: _DV/Objects/Consumable/Food/candy.rsi
    slots: [ mask ]
    equippedPrefix: lollipop
    quickEquip: false # would block eating otherwise

- type: entity
  parent: FoodCandyBase
  id: FoodGumball
  name: гумовий м'яч
  description: "Як би ви не намагалися, ви не можете з ним пускати мильні бульбашки... він збагачений ліками від незначних захворювань».
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15 # 1 extra
        reagents:
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Kelotane
          Quantity: 3
        - ReagentId: Tricordrazine
          Quantity: 3
        - ReagentId: Dylovene
          Quantity: 3
  - type: Sprite
    layers:
    - state: gumball
      map: [ "enum.CandyVisualLayers.Ball" ]
    - state: gumball-shine
