- type: entity
  parent: PlushieMoth
  id: PlushieMothMusician
  name: моль музикант плюшевий
  description: Плюш із зображенням чарівної людини-молі з маленьким синтезатором і крихітними окулярами.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Fun/Toys/moff.rsi
    state: moffmusician

- type: entity
  parent: PlushieMoth
  id: PlushieMothBartender
  name: моль бармен плюш
  description: Плюш із зображенням чарівної людини-молі з крихітним капелюшком і крихітним кевларовим жилетом. Пахне цигарками.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Fun/Toys/moff.rsi
    state: moffbartender
