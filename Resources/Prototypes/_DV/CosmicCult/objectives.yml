- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCosmicCultObjective
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-cosmiccult
  - type: RoleRequirement
    roles:
    - CosmicCultRole

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCosmicColossusObjective
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-cosmiccult
  - type: RoleRequirement
    roles:
    - CosmicColossusRole

############################### COSMIC CULT'S OBJECTIVES

- type: entity
  parent: BaseCosmicCultObjective
  id: CosmicConversionObjective
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: infection
  - type: NumberObjective
    min: 7
    max: 14
    title: об'єктивна-умова-перетворення-заголовок
    description: object-condition-conversion-desc
  - type: CosmicConversionCondition

- type: entity
  parent: BaseCosmicCultObjective
  id: CosmicEntropyObjective
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: siphon
  - type: NumberObjective
    min: 70
    max: 90
    title: об'єктивна-умова-ентропія-назва
    description: object-condition-entropy-desc
  - type: CosmicEntropyCondition

- type: entity
  parent: BaseCosmicCultObjective
  id: CosmicMonumentObjective
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: upgrade
  - type: NumberObjective
    min: 3
    max: 3
    title: object-condition-culttier-title
    description: object-condition-culttier-desc
  - type: CosmicTierCondition

- type: entity
  parent: BaseCosmicCultObjective
  id: CosmicFinalityObjective
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: summon
  - type: NumberObjective
    min: 1
    max: 1
    title: об'єктивна-умова-перемога-титул
    description: object-condition-victory-desc
  - type: CosmicVictoryCondition

############################### COLOSSI OBJECTIVES

- type: entity
  parent: [BaseCosmicColossusObjective, BaseSurviveObjective]
  id: ColossusSurviveObjective
  name: НАПОЛІЙТЕ
  description: Наполягай до кінця всього.
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: colossus

- type: entity
  parent: [BaseCosmicColossusObjective, BaseCodeObjective]
  id: ColossusEffigyObjective
  name: МАНІТЬ
  description: Викличте опудало ентропії.
  components:
  - type: Objective
    icon:
      sprite: _DV/CosmicCult/Icons/objectives.rsi
      state: effigy
  - type: CosmicEffigyCondition
    blacklist:
      tags:
      - GhostOnlyWarp
      - NinjaBombingTargetBlocker # Use the same blacklist as ninja
