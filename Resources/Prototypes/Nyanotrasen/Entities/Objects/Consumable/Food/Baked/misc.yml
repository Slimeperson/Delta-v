- type: entity
  name: кульки для чізкейку
  parent: FoodBakedBase
  id: FoodMothCheesecakeBalls
  description: Готується з м’якого сиру, цукрової пудри і борошна, скачується в кульки, збивається і смажиться у фритюрі. Їх часто подають з медом.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - cheesy
      - honey
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    state: cheesecakes
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 1
        - ReagentId: Sugar
          Quantity: 12
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheesecake and honey

- type: entity
  name: gi
  parent: FoodBakedBase
  id: FoodMothMothmallow
  description: Легкий і пухнастий веганський зефір зі смаком ванілі та рому. Вони відомі метеликам як хмарні квадрати.
  components:
  - type: FlavorProfile
    flavors:
      - vanilla
      - sweet
      - sublime
  - type: SliceableFood
    count: 5
    slice: FoodMothMothmallowSlice
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    state: mothmallow
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 10
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like vanilla and clouds.

- type: entity
  name: скибочка молі
  parent: FoodBakedBase
  id: FoodMothMothmallowSlice
  description: Пухнасті маленькі хмарки радості - дивної метеликової форми та кольору.
  components:
  - type: FlavorProfile
    flavors:
      - vanilla
      - sweet
      - sublime
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    state: mothmallow-slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Sugar
          Quantity: 2
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like vanilla and clouds.

- type: entity
  name: мофін
  parent: FoodBakedBase
  id: FoodMothMoffin
  description: вид-назва-ovinia
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    layers:
      - state: moffin
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          moffin: ""
      - enum.DamageStateVisualLayers.Base:
          moffin2: ""
      - enum.DamageStateVisualLayers.Base:
          moffin3: ""
  - type: FlavorProfile
    flavors:
      - muffin
      - cotton
      - fiber
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: Fiber
          Quantity: 4
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like muffin, dust and lint
