- type: entity
  parent: BaseSuicideAction
  id: DionaGibAction
  name: Gib Yourself!
  description: Розпадається на 3 німфи.
  components:
  - type: Action
    icon:
      sprite: Mobs/Species/Diona/organs.rsi
      state: brain
  - type: InstantAction
    event: !type:GibActionEvent {}

- type: entity
  parent: BaseAction
  id: DionaReformAction
  name: реформа
  description: Реформа назад у цілу Діону.
  components:
  - type: Action
    useDelay: 600 # Once every 10 minutes. Keep them dead for a fair bit before reforming
    icon:
      sprite: Mobs/Species/Diona/parts.rsi
      state: full
  - type: InstantAction
    event: !type:ReformEvent {}
