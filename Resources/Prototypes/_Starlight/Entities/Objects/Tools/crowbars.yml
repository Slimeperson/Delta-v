- type: entity
  name: імпровізований лом
  parent: BaseItem
  id: CrowbarMakeshift
  description: Ледве краще, ніж нічого. Хоча за допомогою зварювальника можна зробити щось більше.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg  
  - type: Sprite
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
    state: base
  - type: Item
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
  - type: Tool
    qualities:
    - Prying
  - type: ToolTileCompatible
    delay: 4
  - type: Prying
    speedModifier: 0.25
  - type: ToolRefinable
    refineResult:
    - id: CrowbarWrenchMakeshift
  - type: Construction
    graph: MakeshiftCrowbarGraph
    node: tool
  - type: Tag
    tags:
      - Crowbar

- type: entity
  name: імпровізований лом
  parent: CrowbarMakeshift
  id: CrowbarImprovised
  description: Кілька шматочків металу, зварених разом і заточених по краях. Не найкращий засіб, але підійде.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
    storedSprite:
      sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
      state: storage
  - type: ToolTileCompatible
    delay: 2
  - type: Prying
    speedModifier: 0.50