# gloves
- type: entity
  parent: BaseToggleAction
  id: ActionToggleNinjaGloves
  name: Переключити рукавички ніндзя
  description: Перемикає всі дії з рукавичками при клацанні лівою кнопкою миші. Включає ваш дверний вимик, виснаження енергії, приголомшення ворогів і злом певних комп’ютерів.
  components:
  - type: Action
    priority: -13

# suit
- type: entity
  parent: BaseAction
  id: ActionCreateThrowingStar
  name: Створіть метальну зірку
  description: Канали використовують силу для створення метальної зірки, яка завдає додаткової шкоди витривалості.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: Objects/Weapons/Throwable/throwing_star.rsi
      state: icon
    itemIconStyle: NoItem
    priority: -10
  - type: InstantAction
    event: !type:CreateItemEvent {}

- type: entity
  parent: BaseAction
  id: ActionRecallKatana
  name: Згадайте катану
  description: Телепортує енергетичну катану, пов’язану з цим костюмом, до її власника, вартість залежить від відстані.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Objects/Weapons/Melee/energykatana.rsi
      state: icon
    itemIconStyle: NoItem
    priority: -11
  - type: InstantAction
    event: !type:RecallKatanaEvent {}

- type: entity
  parent: BaseAction
  id: ActionNinjaEmp
  name: EM Бурст
  description: Вимкніть будь-які сусідні технології за допомогою електромагнітного імпульсу.
  components:
  - type: Action
    icon:
      sprite: Objects/Weapons/Grenades/empgrenade.rsi
      state: icon
    itemIconStyle: BigAction
    priority: -13
  - type: InstantAction
    event: !type:NinjaEmpEvent {}

- type: entity
  parent: BaseAction
  id: ActionTogglePhaseCloak
  name: Фазовий плащ
  description: Перемикає фазовий плащ вашого костюма. Будьте обережні: якщо вас вдарять, усі здібності вимикаються на 5 секунд, включаючи ваш плащ!
  components:
  - type: Action
    # have to plan (un)cloaking ahead of time
    useDelay: 5
    priority: -9
  - type: InstantAction
    event: !type:ToggleActionEvent

# katana
- type: entity
  parent: BaseAction
  id: ActionEnergyKatanaDash
  name: Катана ривок
  description: Телепортуйтеся куди завгодно, якщо у вас в руці енергетична катана.
  components:
  - type: Action
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
    itemIconStyle: NoItem
    sound:
      path: /Audio/Magic/blink.ogg
      params:
        volume: 5
    priority: -12
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:DashEvent
