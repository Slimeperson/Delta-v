- type: entity
  name: Вакуумний маркер Atmos Fix
  id: AtmosFixBlockerMarker
  description: "Вакуум, T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: vacuum
    - type: AtmosFixMarker
      mode: 1

- type: entity
  name: Кисневий маркер Atmos Fix
