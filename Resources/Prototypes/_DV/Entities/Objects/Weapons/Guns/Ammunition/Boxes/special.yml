- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxSpecial
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeSpecial
    proto: CartridgeSpecial
    capacity: 60
  - type: Item
    size: Small
    storedRotation: -45
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Ammunition/Boxes/special.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxSpecial
  id: MagazineBoxSpecial
  name: ammunition box (.38 special)
  description: A cardboard box of .38 special rounds. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeSpecial
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxSpecial
