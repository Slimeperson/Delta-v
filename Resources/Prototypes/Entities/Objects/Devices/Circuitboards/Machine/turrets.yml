  parent: BaseMachineCircuitboard
  id: WeaponEnergyTurretStationMachineCircuitboardBase
  name: дошка сторожової турелі
  description: Машинна друкована плата для сторожової вежі.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: security
  - type: MachineBoard
    prototype: WeaponEnergyTurretStation
    tagRequirements:
      TurretCompatibleWeapon:
        amount: 1
        defaultPrototype: WeaponLaserCannon
        examineName: construction-insert-info-examine-name-laser-cannon
      ProximitySensor:
