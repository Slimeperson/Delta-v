- type: entity
  parent: BaseItem
  id: Holoprojector
  name: проектор голографічних знаків
  description: Зручний голографічний проектор, який відображає табличку прибиральника.
  components:
  - type: Item
    storedRotation: -90
  #- type: HolosignProjector # DeltaV - Holoprojectors don't need batteries
  # Begin DeltaV - Holoprojectors don't need batteries
  - type: ChargeHolosignProjector
    signComponentName: Holosign
  - type: LimitedCharges
    maxCharges: 6 # same as it was on a medium cell
  - type: AutoRecharge
    rechargeDuration: 90 # Same as holosign lifetime
  # END DeltaV
  - type: UseDelay
  #- type: ContainerContainer # DeltaV - Holoprojectors dont need batteries
  #  containers:
  #    cell_slot: !type:ContainerSlot {}
  #- type: PowerCellSlot # DeltaV - Holoprojectors dont need batteries
  #  cellSlotId: cell_slot
  #- type: ItemSlots
  #  slots:
  #    cell_slot:
  #      name: power-cell-slot-component-slot-name-default
  #      startingItem: PowerCellMedium
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/custodial.rsi
    state: icon
  - type: Tag
    tags:
      - HolosignProjector


