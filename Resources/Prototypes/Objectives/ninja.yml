- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseNinjaObjective
  components:
  - type: Objective
    # difficulty isn't used since all objectives are picked
    difficulty: 1.5
    issuer: objective-issuer-spiderclan
  - type: RoleRequirement
    roles:
    - NinjaRole

- type: entity
  parent: BaseNinjaObjective
  id: DoorjackObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/emag.rsi
      state: icon
  - type: NumberObjective
    min: 15
    max: 40
    title: object-condition-doorjack-title
    description: object-condition-doorjack-description
  - type: DoorjackCondition

- type: entity
  parent: BaseNinjaObjective
  id: StealResearchObjective
  description: Ваші рукавички можна використати для злому дослідницького сервера та викрадення його цінних даних. Якщо епістемія заслабла, вам доведеться братися за роботу. # DeltaV - Департамент епістемології замінює науку
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/server.rsi
      state: server
  - type: NumberObjective
    min: 9
    max: 13
    title: об'єктивний-умова-викрадення-назви дослідження
  - type: StealResearchCondition

- type: entity
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: SpiderChargeObjective
  description: Цю бомбу можна підірвати в певному місці. Зверніть увагу, що бомба більше ніде не працюватиме!
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Bombs/spidercharge.rsi
      state: icon
  - type: SpiderChargeCondition
    blacklist:
      tags:
      - GhostOnlyWarp
      - NinjaBombingTargetBlocker

- type: entity
  parent: [BaseNinjaObjective, BaseSurviveObjective]
  id: NinjaSurviveObjective
  name: Вижити
  description: Ви б не були дуже хорошим ніндзя, якби померли, чи не так?
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/ninja.rsi
      state: icon

- type: entity
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: TerrorObjective
  name: Викликати погрозу
  description: Використовуйте свої рукавички на пульті зв'язку, щоб принести чергову загрозу станції.
  components:
  - type: Objective
    icon:
      sprite: Objects/Fun/Instruments/otherinstruments.rsi
      state: red_phone

- type: entity
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: MassArrestObjective
  name: Налаштуйте всіх на бажані
  description: Використовуйте свої рукавички, щоб зламати консоль судимостей, оголосивши всю станцію в розшук!
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_on
