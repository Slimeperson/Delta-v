  description: Старий, але золотий шолом, призначений для позашляховиків. Сумно відомий тим, що доводив офіцерів безпеки до параноїків.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva.rsi
