- type: entity
  parent: CrateMedicalSecure
  id: CrateVirologyBiosuit
  name: вірусологічний біо костюм ящик
  description: Містить 2 костюми біологічної небезпеки, щоб жодна хвороба не відволікала вас від лікування екіпажу. Для відкриття потрібен медичний доступ.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearVirology
          rolls: 2
        - id: ClothingMaskSterile
          amount: 2
