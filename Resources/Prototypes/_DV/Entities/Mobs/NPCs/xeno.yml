# GhostTakeover

# Snakes
- type: entity
  parent: MobPurpleSnake
  id: MobPurpleSnakeGhost
  suffix: гравець
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: рятівна змія
    description: Ви рятувальна змія, яка полює за їжею.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

- type: entity
  parent: MobSmallPurpleSnake
  id: MobSmallPurpleSnakeGhost
  suffix: Гравець, Малий
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: false
    makeSentient: true
    name: рятівна змія
    description: Ви рятувальна змія, яка полює за їжею.
    rules: deltav-ghost-role-information-salvageantag-rules
    mindRoles:
      - MindRoleGhostRoleSoloAntagonist
  - type: SalvageMobRestrictions

# Variants of Xenos to allow ghost takeover again

- type: entity
  abstract: true
  id: BaseMobXenoPlayer
  suffix: гравець
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-xeno-name
    description: ghost-role-information-xeno-description
    rules: ghost-role-information-xeno-rules
    mindRoles:
      - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

- type: entity
  parent: [BaseMobXenoPlayer, MobXeno] # Reverse order so suffix works
  id: MobXenoPlayer
  name: Burrower

